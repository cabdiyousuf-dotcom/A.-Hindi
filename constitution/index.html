onstitution.", "3. No person may be a member of more than one branch of the State at the same time.", "4. Any constitutional dispute between the branches of the State shall be decided by the Supreme Court of the North East State."], "ch": 5, "pg": 21}, {"id": "a49", "k": "art", "n": 49, "lab": "Article 49", "labso": "Qodobka 49aad", "tso": "Qaab Dhismeedka Golaha Wakiillada", "ten": "Structure of the House of Representatives", "so": ["1. Golaha Wakiilladu waxa uu ka kooban yahay 83 xubnood;", "2. Doorashada Golaha Wakiilladu waxa ay noqonaysaa doorasho qof iyo cod ah oo toos ah, xor ah, xalaal ah, caddaaladna ah;", "3. Muddada xil haynta Golaha Wakiilladu waa shan (5) sano oo ka bilaabmaya maalinta xilka loo dhaariyo.", "4. Golaha Wakiilladu waxa uu yeelanayaa Guddoomiye iyo laba Guddoomiye ku Xigeen.", "5. Xarunta Golaha Wakiilladu waa Magaalo madaxda Dawladda Waqooyi Bari ee Laascaanood.", "6. Xubnaha Golaha Wakiillada waa in lagu dhaariyaa labaatan (20) maalmood gudohood, ka dib marka la shaaciyo natiijada doorashada."], "en": ["1. The House of Representatives consists of 83 members;", "2. The election of the House of Representatives shall be a direct, free, fair and just one-person-one-vote election;", "3. The term of office of the House of Representatives is five (5) years, starting from the day it is sworn in.", "4. The House of Representatives shall have a Speaker and two Deputy Speakers.", "5. The seat of the House of Representatives is Las Anod, the capital of the North East State.", "6. Members of the House of Representatives must be sworn in within twenty (20) days of the announcement of the election results."], "ch": 6, "pg": 21}, {"id": "a50", "k": "art", "n": 50, "lab": "Article 50", "labso": "Qodobka 50aad", "tso": "Xubinnimada Golaha Wakiillada", "ten": "Membership of the House of Representatives", "so": ["1. Muwaaddin kasta oo ka mid ah shacabka Dawladda Waqooyi Bari waxa uu isu sharrixi karaa doorashooyinka Golaha Wakiillada, haddii uu buuxiyo shuruudahan soo socda:", "(b) Waa in uu yahay Muslim, ku dhaqma diinta Islaamka, anshax wanaagsan, xilkas ah, maskax ahaanna fayow.", "(t) Waa in uu daacad u yahay mabaadi’da asaasiga ah ee Dawladda Waqooyi Bari.", "(j) Waa in uu u diiwaangashan yahay cod bixiye.", "(x) Waa in da’diisu aanay ka yarayn soddon (30) sano, marka laga reebo guddoonka golaha oo da’doodu aanay ka yaraan karin afartan (40) sano.", "(kh) Waa in aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin.", "(d) Waa in uu leeyahay ugu yaraan aqoon heer jaamacad ama waayo aragnimo u dhiganta.", "(r) Waa in uu ka tanaasulo haddii uu hayo xil dawladeed.", "(s) Guddiga Doorashooyinka iyo Soohdimaha ee Dawladda Waqooyi Bari waa in ay hubiyaan in musharrax kasta uu buuxiyay shuruudaha sharciga ah ee looga baahan yahay."], "en": ["1. Every citizen who is a member of the people of the North East State may stand for election to the House of Representatives if they meet the following requirements:", "(a) They must be a Muslim who practises Islam, of good character, responsible and of sound mind.", "(b) They must be loyal to the fundamental principles of the North East State.", "(c) They must be registered as a voter.", "(d) They must be at least thirty (30) years old, except for the Speaker and Deputies of the House, who must be at least forty (40) years old.", "(e) They must not have been convicted of a crime by a final judgment of a competent court.", "(f) They must have at least a university-level education or equivalent experience.", "(g) They must resign if they hold a government office.", "(h) The Electoral and Boundaries Commission of the North East State must verify that every candidate meets the legal requirements."], "ch": 6, "pg": 22}, {"id": "a51", "k": "art", "n": 51, "lab": "Article 51", "labso": "Qodobka 51aad", "tso": "Waayidda Xubinnimada Golaha Wakiillada", "ten": "Loss of Membership of the House of Representatives", "so": ["1. Xubinta oo lumisa, mid ama ka badan, shuruudihii lagu soo doortay.", "2. Xubinta oo geeriyoota.", "3. Xubinta oo ay lasoo gudboonaato xaalad xil gudasho la’aaneed oo joogto ah.", "4. Xubinta oo soo gudbisa is casilaad, lagana oggolaado.", "5. Ka maqnaanshaha labo kal fadhi oo caadi ah iskuna xiga iyada oo aanay jirin sabab maangal ah.", "6. Xubinta oo qabata xil kale oo dawladeed.", "7. Marka maxkamad awood u leh ku riddo xukun ciqaabeed kama dambays ah", "8. Marka ay xubin bannayso booskeeda waxaa lagu soo buuxinayaa habraacii hore ee doorashada xubnaha Golaha Wakiillada, waana in lagu dhaariyaa soddon (30) maalmood gudahahood laga bilaabo maalintii xildhibaanku baneeyey xubinnimada."], "en": ["1. The member loses one or more of the requirements on which they were elected.", "2. The member dies.", "3. The member suffers a permanent incapacity to perform their duties.", "4. The member submits a resignation and it is accepted.", "5. Absence from two consecutive ordinary sessions without reasonable cause.", "6. The member takes up another government office.", "7. When a competent court passes a final criminal judgment.", "8. When a member vacates their seat, it shall be filled by the same election procedure used for members of the House of Representatives, and the new member must be sworn in within thirty (30) days of the day the member vacated the seat."], "ch": 6, "pg": 22}, {"id": "a52", "k": "art", "n": 52, "lab": "Article 52", "labso": "Qodobka 52aad", "tso": "Doorashada Guddoonka Golaha Wakiillada", "ten": "Election of the Speakership of the House", "so": ["1. Fadhiga koowaad ee Golaha Wakiillada, waxaa guddoominaya xubinta ugu da’da weyn.", "2. Golaha Wakiilladu waa in uu fadhigiisa koowaad iska dhex doortaa guddoommiye iyo labo (2) ku xigeen.", "3. Marka ay xubinta ugu da`da wayn musharrax tahay, fadhiga koowaad waxaa shir guddoominaya xubinta da`ahaan ku xigta.", "4. Guddoomiyaha iyo labada (2) Guddoomiye ku Xigeen waxaa lagu dooranayaa cod qarsoodi ah, oo hal dheeri ah (50%+1) xubnaha Golaha Wakiillada.", "5. Guddoomiyaha iyo labada (2) Guddoomiye ku Xigeen ka hor inta aan la dhaarin, waa in ay iska casilaan xil kasta oo ay ka hayaan xisbi siyaasadeed, una hoggaansamaan dastuurka iyo shuruucda kale ee Dawladda Waqooyi Bari."], "en": ["1. The first sitting of the House of Representatives is chaired by its oldest member.", "2. At its first sitting the House of Representatives must elect from among its members a Speaker and two (2) Deputy Speakers.", "3. If the oldest member is a candidate, the first sitting is chaired by the next oldest member.", "4. The Speaker and the two (2) Deputy Speakers are elected by secret ballot by a majority of one more than half (50%+1) of the members of the House of Representatives.", "5. Before being sworn in, the Speaker and the two (2) Deputy Speakers must resign from any office they hold in a political party, and abide by the Constitution and the other laws of the North East State."], "ch": 6, "pg": 23}, {"id": "a53", "k": "art", "n": 53, "lab": "Article 53", "labso": "Qodobka 53aad", "tso": "Xil Waayidda Guddoonka Golaha Wakiillada", "ten": "Removal of the Speakership of the House", "so": ["1. Guddoomiyaha iyo labada Guddoomiye ku Xigeen ee Golaha Wakiilladu waxa ay xilka ku waayi karaan;", "(b) Geeri ku timaadda;", "(t) Iscasilaad qoraal ah oo uu soo gudbiyey, Goluhuna ka aqbalo;", "(j) Maqnaansho cudurdaar la’aan ah oo gaadhaya lixdan (60) maalmood oo isku xiga;", "(x) Ku xadgudub Shareecada Islaamka, Dastuurka, Xeer Hoosaadka iyo shuruucda kale ee Dawladda Waqooyi Bari;", "(kh) Xil gudasho la’aan joogto ah;", "(d) Marka maxkamad awood u leh ku riddo xukun ciqaabeed kama dambays ah;", "(d) Xubinta oo isu sharaxda ama qabto xil kale oo dawladeed.", "2. Marka ay dhacaan mid ama ka badan arrimaha ku xusan Xarfaha (j), (x), (kh), (d), ee Qodobkan, Guddoomiyaha iyo labada (2) Guddoomiye ku Xigeen waxaa xilka looga qaadi karaa Saddex meelood laba (2/3) xubnaha Golaha Wakiillada."], "en": ["1. The Speaker and the two Deputy Speakers of the House of Representatives may lose office through:", "(a) Death;", "(b) A written resignation they have submitted and the House has accepted;", "(c) Absence without excuse for sixty (60) consecutive days;", "(d) Violation of Islamic Sharia, the Constitution, the Rules of Procedure or the other laws of the North East State;", "(e) Permanent incapacity to perform their duties;", "(f) A final criminal judgment passed by a competent court;", "(f) The member standing for or taking up another government office.", "2. When one or more of the matters in letters (c), (d), (e) and (f) of this Article occur, the Speaker and the two (2) Deputy Speakers may be removed from office by two thirds (2/3) of the members of the House of Representatives."], "ch": 6, "pg": 23}, {"id": "a54", "k": "art", "n": 54, "lab": "Article 54", "labso": "Qodobka 54aad", "tso": "Muddada Xil Haynta Golaha Wakiillada", "ten": "Term of Office of the House of Representatives", "so": ["Muddada xil haynta Golaha Wakiilladu waa shan (5) sano oo ka bilaabata maalinta xilka loo dhaariyo."], "en": ["The term of office of the House of Representatives is five (5) years, starting from the day it is sworn in."], "ch": 6, "pg": 23}, {"id": "a55", "k": "art", "n": 55, "lab": "Article 55", "labso": "Qodobka 55aad", "tso": "Awoodaha Iyo Waajibaadka Golaha Wakiillada", "ten": "Powers and Duties of the House of Representatives", "so": ["Golaha Wakiilladu waxa uu metelayaa dhammaan shacabka Dawladda Waqooyi Bari, waxa uuna leeyahay awoodahan:", "1. Dib u eegidda, ansixinta, wax ka beddelka, diidmada, iyo baabi’inta sharci qabyo ah iyo mid jirayba ee Dawladda Waqooyi Bari, si waafaqsan shareecada Islaamka.", "2. Curinta Sharci ama xeer cusub, si waafaqsan shareecada Islaamka.", "3. Hubinta meel marinta sharciyada iyo xeerarka goluhu ansixiyey.", "4. Ansixinta iyo diidmada xaaladaha degdegga ah, taasoo lagu ansixiyo ama lagu diido cod saddex meelood labo meelood (2/3) ah xubnaha Golaha Wakiillada.", "5. Ansixinta iyo diidmada heshiisyada hay’adda fulintu gasho, oo lagu ansixinayo ama lagu diidayo cod hal dheeri ah (50%+1) xubnaha Golaha Wakiillada.", "6. Xasaanad siinta iyo ansixinta xasaanad ka qaadista Golaha Adeegga Garsoorka.", "7. Ansixinta ama diidmada:", "(b) Wasiirrada iyo Wasiir ku Xigeennada;", "(t) Mas’uuliyiinta hay’adaha iyo xafiisyada madaxa bannaan, xubnaha guddiyada madaxa bannaan, iyo garsooreyaasha maxkamadda sare;", "(j) Qorshayaasha Golaha Fullinta;", "(x) Miisaaniyadda guud ee Golaha Fulintu soo gudbiyo sannad walba iyo wax ka beddelkeeda;", "(kh) Degmooyin ama gobollo cusub oo Golaha Fulintu soo jeediyo;", "(d) Hindiseyaasha Golaha Fulintu ku aasaasayso ama ku kala dirayso hay’adaha dawladda;", "(r) Xisaab xidhka miisaaniyad sannadeedkii hore;", "(s) Deymaha lacageed ee Dawladdu heshiis kula gasho, Dawladda Federaalka, hay’ado waddani ah ama hay’ado shisheeye, si waafaqsan xeerarka Dawladda Waqooyi Bari Soomaaliya iyo heer Federaal;", "(sh) Dhammaan Xarfaha (b), (t), (j), (x), (kh), (d), (r), iyo (s) ee faqradan, waxa ay ku ansaxayaan cod hal dheeri ah (50%+1) guntanka fadhiga Golaha Wakiillada;", "8. Xasaanad kala noqoshada mas’uuliyiinta, iyo xilalka Golaha Wakiilladu hore u ansixiyeen iyo baabi’inta hay’adaha.", "9. Oggolaanshaha xasaanad kala noqoshada iyo dacwad ku oogista mas’uul xasaanad leh marka uu codsado Xeer Ilaaliyaha Guud.", "10. Goluhu waxa uu leeyahay Awoodaha la xisaabtanka, qiimaynta, iyo talo-bixinta:", "(b) Waxa uu korjoogteeyaa, ka doodaa, ka aragti dhiibtaa siyaasadda iyo qorsheyaasha waxqabadka Golaha Fulinta;", "(t) Goluhu waxa uu u soo gudbiyaa Golaha Fulinta aragtidooda miisaaniyadda iyo habaynta arrimaha maaliyadda, marka ay warbixin ka helaan Hanti Dhawraha Guud;", "(j) Waxa uu u yeedhaa mas’uuliyiinta sare ee Golaha Fulinta si ay ugala xisaabtamaan siyaasadaha Golaha Fulinta, maaliyadda iyo go’aannada maamul ee Golaha Fulinta;", "(x) Goluhu waxa uu tallaabo dastuurka waafaqsan ka qaadayaa, marka mas’uul Goluhu u yeedhay soo xaadiri waayo cudurdaar la’aan;", "(kh) Goluhu waxa uu u yeedhaa Madaxweynaha si uu uga jawaabo su’aalaha ay qabaan goluhu, markii loo baahdo.", "(d) Xubinta golaha Wakiilladu waxa ay meteshaa danaha Dawladda Waqooyi Bari, shacabka Dawladda Waqooyi Bari, iyo deegaan doorashadiisa.", "(r) Ka qaybgalka wax ka beddelka Dastuurka, si waafaqsan Cutubka 21aad ee Dastuurka.", "11. Golaha Wakiilladu waxa uu yeelanaya xeer hoosaad uu hawlihiisa ku nidaamiyo."], "en": ["The House of Representatives represents all the people of the North East State and has these powers:", "1. Reviewing, approving, amending, rejecting and repealing draft and existing laws of the North East State, in accordance with Islamic Sharia.", "2. Initiating new laws or regulations, in accordance with Islamic Sharia.", "3. Ensuring the implementation of the laws and regulations the House has approved.", "4. Approving or rejecting states of emergency, by a vote of two thirds (2/3) of the members of the House of Representatives.", "5. Approving or rejecting agreements entered into by the executive, by a vote of one more than half (50%+1) of the members of the House of Representatives.", "6. Granting immunity to, and approving the lifting of immunity of, the Judicial Service Council.", "7. Approving or rejecting:", "(a) Ministers and Deputy Ministers;", "(b) The heads of independent institutions and offices, members of independent commissions, and judges of the Supreme Court;", "(c) The plans of the Executive Council;", "(d) The general budget the Executive Council submits each year, and amendments to it;", "(e) New districts or regions proposed by the Executive Council;", "(f) Proposals by the Executive Council to establish or dissolve State institutions;", "(g) The closing accounts of the previous year's budget;", "(h) Financial loans the State agrees with the Federal Government, national institutions or foreign institutions, in accordance with the laws of the North East State of Somalia and at federal level;", "(i) All of letters (a) to (h) of this clause are approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives;", "8. Withdrawing the confidence of officials and offices the House previously approved, and abolishing institutions.", "9. Approving the lifting of immunity and the prosecution of an official with immunity when requested by the Attorney General.", "10. The House has powers of oversight, evaluation and advice:", "(a) It monitors, debates and gives its view on the policies and work plans of the Executive Council;", "(b) It submits its views on the budget and the organisation of financial matters to the Executive Council after receiving a report from the Auditor General;", "(c) It summons senior officials of the Executive Council to hold them accountable for the Council's policies, finances and administrative decisions;", "(d) It takes constitutional action when an official summoned by the House fails to appear without excuse;", "(e) It summons the President to answer the House's questions when necessary.", "(f) A member of the House of Representatives represents the interests of the North East State, its people and their constituency.", "(g) Taking part in amending the Constitution, in accordance with Chapter 21 of the Constitution.", "11. The House of Representatives shall have Rules of Procedure to organise its work."], "ch": 6, "pg": 24}, {"id": "a56", "k": "art", "n": 56, "lab": "Article 56", "labso": "Qodobka 56aad", "tso": "Awoodaha Guddoonka Golaha Wakiillada", "ten": "Powers of the Speakership of the House", "so": ["1. Awoodda Guddoomiyaha Golaha Wakiillada waxaa ka mid ah:", "(b) Guddoominta fadhiyada Golaha Wakiillada", "(t) Hagidda hawlaha Golaha Wakiillada;", "(j) Metelaadda Golaha Wakiillada;", "(x) Ku Simaha Madaxweynaha marka Madaxweynaha iyo Madaxweyne ku Xigeenku ka maqan yihiin dhulka Dawladda Waqooyi Bari;", "(kh) Sii hayaha xilka Madaxweynaha marka ay bannaanaadaan xilalka Madaxweynaha iyo Madaxweyne ku Xigeenka.", "2. Awoodaha Guddoomiye ku Xigeenka Koowaad iyo Labaad waxaa ka mid ah:", "(b) Guddoomiye ku Xigeenka Koowaad waxa uu qabtaa xilka Guddoomiyaha marka uu ka maqan yahay dhulka Dawladda Waqooyi Bari;", "(t) Guddoomiye ku Xigeenka Labaad wuxuu qabtaa xilka Guddoomiyaha marka Guddoomiyaha iyo ku Xigeenka Koowaad ka maqan yahay dhulka Waqooyi Bari.", "3. Awoodaha iyo waajibaadka Guddoonka Golaha Wakiiillada waxaa faahfaahinaya xeer hoosaadka golaha."], "en": ["1. The powers of the Speaker of the House of Representatives include:", "(a) Chairing the sittings of the House of Representatives;", "(b) Directing the work of the House of Representatives;", "(c) Representing the House of Representatives;", "(d) Acting for the President when both the President and the Vice President are absent from the territory of the North East State;", "(e) Holding the office of President in an interim capacity when the offices of both President and Vice President become vacant.", "2. The powers of the First and Second Deputy Speakers include:", "(a) The First Deputy Speaker performs the Speaker's duties when the Speaker is absent from the territory of the North East State;", "(b) The Second Deputy Speaker performs the Speaker's duties when the Speaker and the First Deputy are absent from the territory of the North East.", "3. The powers and duties of the Speakership of the House of Representatives are detailed in the House's Rules of Procedure."], "ch": 6, "pg": 25}, {"id": "a57", "k": "art", "n": 57, "lab": "Article 57", "labso": "Qodobka 57aad", "tso": "Kal Fadhiyada Golaha Wakiillada", "ten": "Sessions of the House of Representatives", "so": ["1. Fadhiga koowaad ee Golaha Wakiilladu waa in uu ku qabsoomaa toban (10) maalmood gudahood, dhaarinta kadib.", "2. Fadhiga koowaad waxa isugu yeedhaya guddiga madaxa bannaan ee doorashooyinka.", "3. Fadhiga Golaha Wakiilladu waxa uu qabsoomayaa marka la helo guntanka saxda ah oo ahaanaya hal dheeri (50%+1) xubnaha Golaha Wakiillada.", "4. Golaha Wakiilladu waxa uu yeelanayaa labo (2) kal fadhi oo caadi ah sannadkii oo midkiiba soconayo afar (4) bilood.", "5. Golaha Wakiilladu waxa uu yeelan karaa fadhiyo aan caadi ahayn marka:", "(b) Madaxwaynuhu codsado;", "(t) Guddiga joogtada ahi codsadaan;", "(j) Xubnaha Golaha Wakiillada boqolkiiba shan iyo labaatan (25%) ka mid ah codsadaan.", "6. Fadhiyada Goluhu waa in ay u furan yihiin dhegeysiga dadweynaha.", "7. Xeer Hoosaadka Golaha ayaa qeexaya marka ay lagama maarmaan tahay in Goluhu yeesho fadhiyo albaabbadu u xidhan yihiin."], "en": ["1. The first sitting of the House of Representatives must be held within ten (10) days of the swearing-in.", "2. The first sitting is convened by the independent electoral commission.", "3. A sitting of the House of Representatives takes place when the correct quorum is present, being one more than half (50%+1) of the members of the House.", "4. The House of Representatives shall have two (2) ordinary sessions a year, each lasting four (4) months.", "5. The House of Representatives may hold extraordinary sittings when:", "(a) The President requests it;", "(b) The standing committee requests it;", "(c) Twenty-five per cent (25%) of the members of the House of Representatives request it.", "6. Sittings of the House must be open to the public.", "7. The Rules of Procedure of the House define when it is necessary for the House to sit behind closed doors."], "ch": 6, "pg": 26}, {"id": "a58", "k": "art", "n": 58, "lab": "Article 58", "labso": "Qodobka 58aad", "tso": "Xasaanadda Xubnaha Golaha Wakiillada", "ten": "Immunity of Members of the House", "so": ["1. Xubnaha Golaha Wakiilladu waxa ay leeyihiin xasaanad si ay u gutaan waajibaadkooda dastuuriga ah.", "2. Xubnaha Golaha Wakiillada lama baadhi karo, lama xidhi karo, laguma soo oogi karo dacwad ciqaabeed, looma ciqaabi karo hadallada, ra’yiga, ama codka ay dhiibtaan inta ay ku guda jiraan waajibaadkooda shaqo ee Golaha Wakiillada, haddii aanay fal dembiyeed gacmaha kula jirin.", "3. Xasaanadda Xubnaha Golaha Wakiilladu ma reebayso dembiyada shareecada Islaamku si cad u tilmaantay.", "4. Xubnaha Golaha Wakiillada dacwad madani ah oo aan la xidhiidhin waajibaadkooda xil gudasho waa lagu furi karaa iyadoo aan loo baahnayn oggolaanshaha Golaha Wakiillada."], "en": ["1. Members of the House of Representatives have immunity so that they can carry out their constitutional duties.", "2. Members of the House of Representatives may not be searched, detained, criminally charged or punished for statements, opinions or votes given while carrying out their duties in the House, unless caught in the act of a crime.", "3. The immunity of members of the House does not cover crimes explicitly specified by Islamic Sharia.", "4. A civil case unrelated to the performance of their duties may be brought against members of the House without the consent of the House."], "ch": 6, "pg": 26}, {"id": "a59", "k": "art", "n": 59, "lab": "Article 59", "labso": "Qodobka 59aad", "tso": "Kala Diridda Golaha Wakiillada", "ten": "Dissolution of the House of Representatives", "so": ["1. Golaha Wakiillada waxa la kala diri karaa:", "(b) Marka ay is casilaan tiro hal dheeri (50%+1) xubnaha Golaha Wakiilladu;", "(t) Marka goluhu fadhiisan waayo hal (1) kal fadhi oo caadi ah duruuf la’aan;", "(j) Marka ay soo gudbiyaan saddex meelood hal meel (1/3) xubnaha Golaha Wakiillada, iskuna raacaan saddex meelood labo meelood (2/3) xubnaha Golaha Wakiillada.", "2. Marka ay dhacaan mid ama ka badan arrimaha ku xusan xarfaha (b), (t), iyo (j) ee qodobkan, Madaxweynuhu waxa uu Maxkamadda Sare u gudbinayaa qoraal uu ku dalbanayo sugnaanshaha arrimaha ku xusan qodobkan.", "3. Madaxweynuhu, marka uu helo caddaynta Maxkamadda Sare, waxa uu soo saarayaa go'aanka kala dirista Golaha, waxa uuna ku dhawaaqayaa in Gole cusub lagu soo doorto muddo lixdan (60) maalmood gudohood ah."], "en": ["1. The House of Representatives may be dissolved:", "(a) When a number equal to one more than half (50%+1) of the members of the House resign;", "(b) When the House fails to sit for one (1) ordinary session without cause;", "(c) When one third (1/3) of the members of the House submit a motion and two thirds (2/3) of the members agree to it.", "2. When one or more of the matters in letters (a), (b) and (c) of this Article occur, the President shall submit a written request to the Supreme Court to confirm them.", "3. On receiving the Supreme Court's confirmation, the President shall issue the decision dissolving the House and announce that a new House be elected within sixty (60) days."], "ch": 6, "pg": 27}, {"id": "a60", "k": "art", "n": 60, "lab": "Article 60", "labso": "Qodobka 60aad", "tso": "Hindisaha Sharciyada", "ten": "Legislative Bills", "so": ["1. Hindise sharciyeed waxa golaha horgeyn kara oo kali ah:", "(b) Shan (5) xubnood oo ka tirsan Golaha Wakiillada Dawladda Waqooyi Bari;", "(t) Golaha Fulinta; (J) Saxeexa ugu yaraan 1000 (Kun) muwaaddin oo diiwaangashan."], "en": ["1. A bill may be introduced to the House only by:", "(a) Five (5) members of the House of Representatives of the North East State;", "(b) The Executive Council; (c) The signatures of at least 1,000 (one thousand) registered citizens."], "ch": 7, "pg": 27}, {"id": "a61", "k": "art", "n": 61, "lab": "Article 61", "labso": "Qodobka 61aad", "tso": "Soo Gudbinta Hindise Sharciyeed ee Muwaaddiniinta", "ten": "Submission of Citizens' Bills", "so": ["1. Waa in lagu lifaaqo Lambarka aqoonsiga muwaaddiniinta iyo saxeexooda, si waafaqsan Qodobka 60, Faqrada 1, Xarafka (J).", "2. Waxaa reebban soo gudbinta hindise sharciyeed ku saabsan maaliyadda."], "en": ["1. The citizens' identity numbers and signatures must be attached, in accordance with Article 60, Clause 1, letter (c).", "2. Submitting a bill concerning public finance is prohibited."], "ch": 7, "pg": 27}, {"id": "a62", "k": "art", "n": 62, "lab": "Article 62", "labso": "Qodobka 62aad", "tso": "Ansixinta Hindise Sharciyeedka", "ten": "Passing a Bill", "so": ["1. Hindise sharciyeedyada waa in Golaha Wakiilladu qodob-qodob uga doodo.", "2. Marka laga reebo sharciyada dastuurku u asteeyo ansixintooda codbixin cayiman, dhammaan sharciyada kale waxa ay ku ansaxayaan cod hal dheeri ah (50%+1) guntanka fadhiga Golaha Wakiillada.", "3. Goluhu marka uu ansixiyo hindise sharciyeed waa in uu muddo shan iyo toban (15) maalmood gudahood ah ugu gudbiyo Madaxwaynaha.", "4. Hindise sharciyeed kasta oo goluhu diido, laguma soo celin karo inta lagu jiro isla kal fadhigaas."], "en": ["1. The House of Representatives must debate bills article by article.", "2. Except for laws whose passage the Constitution reserves to a specified vote, all other laws are passed by a vote of one more than half (50%+1) of the quorum of the sitting of the House.", "3. Once the House passes a bill, it must send it to the President within fifteen (15) days.", "4. A bill the House rejects may not be brought back during the same session."], "ch": 7, "pg": 28}, {"id": "a63", "k": "art", "n": 63, "lab": "Article 63", "labso": "Qodobka 63aad", "tso": "Saxeexa iyo Dib u Celinta Hindise Sharciyeed ee Madaxweynaha", "ten": "Presidential Signature and Return of a Bill", "so": ["1. Madaxweynuhu waa in uu ku saxeexo muddo soddon (30) maalmood gudohood ah, faafinta rasmiga ahna lagu soo saaro hindise sharciyeed kasta oo Golaha Wakiilladu ansixiyo.", "2. Madaxweynuhu waxa uu awood u leeyahay in uu dib u celiyo muddo soddon (30) maalmood gudohood ah, hindise sharciyeed uu Golaha Wakiilladu meel mariyay, waana in uu raaciyaa qoraal sharci ahaan sababaysan."], "en": ["1. The President must sign every bill the House of Representatives passes within thirty (30) days, and it must be published in the Official Gazette.", "2. The President has the power to return, within thirty (30) days, a bill the House of Representatives has passed, and must attach a written legal statement of reasons."], "ch": 7, "pg": 28}, {"id": "a64", "k": "art", "n": 64, "lab": "Article 64", "labso": "Qodobka 64aad", "tso": "Ka Jawaabidda Dib u Celinta Hindise Sharciyeed ee Madaxweynaha", "ten": "Responding to a Presidential Return of a Bill", "so": ["1. Goluhu waa in uu dib u eegis ku sameeyo hindise sharciyeed madaxwaynuhu dib ugu soo celiyey golaha, iyaga oo tixgelinaya sababaynta Madaxwaynaha.", "2. Dib u celinta hindise sharciyeed ee Madaxweynaha, waxaa Golaha Wakiilladu ku jebin karaan marka ay mar labaad u codeeyaan kuna meelmariyaan cod saddex meelood laba meelood (2/3) xubnaha Golaha Wakiil lada, Waana in Madaxweynuhu ku saxeexo, faafinta rasmiga ahna lagu soo saaro soddon (30) maalmood gudohood ah."], "en": ["1. The House must review a bill the President has returned, taking into account the President's reasons.", "2. The House of Representatives may override the President's return of a bill by voting on it again and passing it with two thirds (2/3) of the members of the House, and the President must then sign it and have it published in the Official Gazette within thirty (30) days."], "ch": 7, "pg": 28}, {"id": "a65", "k": "art", "n": 65, "lab": "Article 65", "labso": "Qodobka 65aad", "tso": "Faafinta Rasmiga ah iyo Dhaqangalka Sharciyada", "ten": "Official Publication and Entry into Force of Laws", "so": ["Sharciyada iyo xeerarku waxa ay dhaqangelayaan marka uu Madaxweynuhu saxiixo, laguna soo saaro faafinta rasmiga ah."], "en": ["Laws and regulations enter into force when the President signs them and they are published in the Official Gazette."], "ch": 7, "pg": 29}, {"id": "a66", "k": "art", "n": 66, "lab": "Article 66", "labso": "Qodobka 66aad", "tso": "Duridda Sharci la Ansixiyey", "ten": "Challenging an Enacted Law", "so": ["1. Sharci la ansixiyey waxaa la duri karaa marka uu ka horyimaado:", "(b) Shareecada Islaamka;", "(t) Dastuurka Dawladda Waqooyi Bari ama Dastuurka Federaalka;", "(j) Habraaca ansixinta hindise sharciyeedka.", "2. Marka la durayo sharci la ansixiyey waxaa la raacayaa:", "(b) Garyaqaanka Guud ayaa bilaabaya habraaca durista ee sharci la ansixiyey isagoo caddaymaha durista u gudbinaya Maxkamadda Sare;", "(t) Kun (1000) muwaaddin oo diiwaangashan ayaa u gudbinaya Maxkamadda Sare durista sharci la ansixiyey."], "en": ["1. An enacted law may be challenged when it conflicts with:", "(a) Islamic Sharia;", "(b) The Constitution of the North East State or the Federal Constitution;", "(c) The procedure for passing bills.", "2. A challenge to an enacted law follows this course:", "(a) The Attorney General begins the challenge procedure by submitting the grounds for the challenge to the Supreme Court;", "(b) One thousand (1,000) registered citizens submit a challenge to the enacted law to the Supreme Court."], "ch": 7, "pg": 29}, {"id": "a67", "k": "art", "n": 67, "lab": "Article 67", "labso": "Qodobka 67aad", "tso": "Qaab Dhismeedka Golaha Fulinta", "ten": "Structure of the Executive Council", "so": ["1. Qaab dhismeedka Golaha Fulinta ee Dawladda Waqooyi Bari waa:", "(b) Madaxweynaha;", "(t) Madaxweyne ku Xigeenka;", "(j) Wasiirrada iyo wasiirro ku xigeennada."], "en": ["1. The structure of the Executive Council of the North East State is:", "(a) The President;", "(b) The Vice President;", "(c) Ministers and Deputy Ministers."], "ch": 8, "pg": 29}, {"id": "a68", "k": "art", "n": 68, "lab": "Article 68", "labso": "Qodobka 68aad", "tso": "Awoodaha iyo Waajibaadka Golaha Fulinta", "ten": "Powers and Duties of the Executive Council", "so": ["1. Golaha Fulintu waxa uu leeyahay awoodaha iyo mas’uuliyadaha soo socda:", "(b) Ilaalinta Shareecada Islaamka iyo sugidda masiirka, jiritaanka, midnimada iyo amniga Dawladda Waqooyi Bari.", "(t) Dejinta iyo dhaqangalinta siyaasadda guud iyo qorsheyaasha Dawladda Waqooyi Bari.", "(j) Kala nidaaminta awoodaha hay'adaha fulinta.", "(x) Oggolaanshaha iyo fulinta shuruucda iyo xeerarka Dawladda Waqooyi Bari, si waafaqsan Dastuurka iyo shuruucda kale.", "(kh) Curinta hindise sharciyeed iyo u gudbinta Golaha Wakiillada.", "(d) Diyaarinta miisaaniyad sannadeedka iyo xisaabxidhkeeda.", "(r) Dejinta qorshaha guud ee lagu horumarinayo Dawladda Waqooyi Bari.", "(s) Oggolaanshaha soo jeedinta Madaxweynaha ee xaaladda degdegga ah.", "(sh) Oggolaanshaha soo jeedinta samaynta hay’ado madax bannaan iyo kuwo ay Dawladdu qayb ka tahay, islamarkaana xeerkooda loo gudbinayo Golaha Wakiillada;", "(dh) Ka baaraandegidda iyo go’aan ka gaadhidda dhammaan arrimaha uu Madaxweynuhu Golaha soo hordhigo.", "2. Madaxweynaha iyo Madaxweyne ku Xigeenka waxay leeyihiin xasaanad sharci muddada Xilka ay hayaan.", "3. Wasiirka iyo Wasiir ku Xigeenku waxay leeyihiin xasaanad shaqo muddada Xilka ay hayaan."], "en": ["1. The Executive Council has the following powers and responsibilities:", "(a) Protecting Islamic Sharia and securing the destiny, existence, unity and security of the North East State.", "(b) Setting and implementing the general policy and plans of the North East State.", "(c) Organising the distribution of powers among executive institutions.", "(d) Approving and implementing the laws and regulations of the North East State, in accordance with the Constitution and other laws.", "(e) Drafting bills and submitting them to the House of Representatives.", "(f) Preparing the annual budget and its closing accounts.", "(g) Setting the general development plan of the North East State.", "(h) Approving the President's proposal of a state of emergency.", "(i) Approving proposals to create independent institutions and institutions in which the State takes part, and submitting their laws to the House of Representatives;", "(j) Considering and deciding all matters the President puts before the Council.", "2. The President and the Vice President have legal immunity for the period they hold office.", "3. Ministers and Deputy Ministers have functional immunity for the period they hold office."], "ch": 8, "pg": 30}, {"id": "a69", "k": "art", "n": 69, "lab": "Article 69", "labso": "Qodobka 69aad", "tso": "Habraaca Xil Gudashada Golaha Fulinta", "ten": "Conduct of Office of the Executive Council", "so": ["1. Madaxweynaha, Madaxweyne ku Xigeenka, Wasiirrada iyo dhammaan hawlwadeennada sare ee Dawladdu ma qaadan karaan qandaraas mashruuc dawladeed ama mid bulsheed, inta ay xilka hayaan.", "2. Madaxweynaha, Madaxweyne ku Xigeenka, Wasiirrada iyo hawlwadeennada sare ee Golaha Fulintu waa in ay Hanti Dhawraha Guud u gudbiyaan hantidooda ka hor inta aanay xafiiska la wareegin.", "3. Dhammaan go’aannada ay qaataan Golaha Fulinta si aqlabiyad ah waa mas’uuliyad wadareed.", "4. Xubnaha Golaha Fulinta muddada ay xilka hayaan, waxaa ka reebban:", "(b) In ay qabtaan xilal kale oo dawladeed;", "(t) In ay qabtaan meherad madax bannaan, hawl ganacsi, maaliyadeed ama warshadeed oo u gaar ah;", "(j) In ay iibsadaan ama kireystaan hanti Dawladeed;", "(x) In ay hantidooda ka gadaan ama ka kireeyaan Dawladda.", "5. Xubnaha Golaha Fulintu waa in ay ku diyaariyaan xil wareejinta muddo shan iyo toban (15) maalmood guduhood ah, marka muddada xil hayntoodu dhamaato."], "en": ["1. The President, the Vice President, Ministers and all senior officials of the State may not take a government or public project contract while they hold office.", "2. The President, the Vice President, Ministers and senior officials of the Executive Council must declare their assets to the Auditor General before taking office.", "3. All decisions the Executive Council takes by majority are a collective responsibility.", "4. Members of the Executive Council, while in office, are prohibited from:", "(a) Holding other government offices;", "(b) Running a private independent profession, or a business, financial or industrial activity of their own;", "(c) Buying or leasing State property;", "(d) Selling or leasing their own property to the State.", "5. Members of the Executive Council must prepare the handover of office within fifteen (15) days when their term ends."], "ch": 8, "pg": 30}, {"id": "a70", "k": "art", "n": 70, "lab": "Article 70", "labso": "Qodobka 70aad", "tso": "Shuruudaha Madaxweynaha iyo Madaxweyne ku Xigeenka", "ten": "Requirements for President and Vice President", "so": ["1. Shuruudaha laga doonayo in uu buuxiyo muwaaddinka u tartamaya xilka Madaxwaynaha ama Madaxwayne ku Xigeenka:", "(b) Waa in uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) Waa in uu yahay Muslim, ku dhaqma Diinta Islaamka, anshax wanaagsan, xilkas ah, maskax ahaanna fayow;", "(j) Waa in uu daacad u yahay mabaadi’da aasaasiga ah ee Dawladda Waqooyi Bari.", "(x) Waa in uu u diiwaangashan yahay cod bixiye;", "(kh) Waa in uu haysto shahaado heerka labaad ee jaamacadda, isla markaana leeyahay waayo aragnimo maamul oo aan ka yarayn toban (10) sano;", "(d) Waa in uu aqoon u leeyahay dhaqanka, taariikhda, iyo hiddaha Soomaaliyeed;", "(r) Waa in aan da’diisu ka yarayn afartan (40) sano;", "(d) Waa in uu ka tanaasulo xil kasta oo uu hayey ka hor inta aanu ku dhawaaqin musharaxnimadiisa", "(s) Waa in aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin."], "en": ["1. The requirements a citizen running for the office of President or Vice President must meet:", "(a) They must be a citizen who is a member of the people of the North East State;", "(b) They must be a Muslim who practises Islam, of good character, responsible and of sound mind;", "(c) They must be loyal to the fundamental principles of the North East State.", "(d) They must be registered as a voter;", "(e) They must hold a second-level (master's) university degree and have at least ten (10) years of administrative experience;", "(f) They must have knowledge of Somali culture, history and heritage;", "(g) They must be at least forty (40) years old;", "(f) They must resign from any office they held before announcing their candidacy;", "(h) They must not have been convicted of a crime by a final judgment of a competent court."], "ch": 8, "pg": 31}, {"id": "a71", "k": "art", "n": 71, "lab": "Article 71", "labso": "Qodobka 71aad", "tso": "Muddada Xilka Madaxweynaha iyo Madaxweyne ku Xigeenka.", "ten": "Term of Office of President and Vice President", "so": ["1. Muddada xil haynta Madaxweynaha iyo Madaxweye ku Xigeenku waa shan (5) sano, laga bilaabo maalinta xilka loo dhaariyo.", "2. Laba (2) jeer oo isku xiga ama waqti u dhexeeyo oo keliya ayaa la dooran karaa Madaxweynaha iyo madaxweyne ku Xigeenka."], "en": ["1. The term of office of the President and Vice President is five (5) years, starting from the day they are sworn in.", "2. The President and Vice President may be elected only twice, whether consecutively or with an interval."], "ch": 8, "pg": 31}, {"id": "a72", "k": "art", "n": 72, "lab": "Article 72", "labso": "Qodobka 72aad", "tso": "Awoodaha Madaxweynaha", "ten": "Powers of the President", "so": ["1. Madaxweynuhu waa astaanta Dawladda Waqooyi Bari, madaxa ugu sarreeya Dawladda, Guddoomiyaha Golaha Fulinta, waxa uuna metelaa midnimada shacabka.", "2. Waxa uu u xil saaran yahay ilaalinta Diinta Islaamka, dastuurka iyo shuruucda heer Dawladdeed iyo heer Federaal.", "3. Madaxweynuhu waa Taliyaha Guud ee ciidamada qalabka sida ee Dawladda Waqooyi Bari.", "4. Waxa uu magacaabaa Wasiirrada iyo Wasiir ku Xigeennada, isaga oo la tashanaya Madaxweyne ku Xigeenka, muddo soddon (30) maalmood gudahood ah oo ka bilaabata maalinta xilka loo dhaariyo.", "5. Waxa uu magacaabaa, isaga oo la tashanaya Madaxweyne ku Xigeenka, madaxda hay’adaha madaxa bannaan, saraakiisha ciidammada, iyo madaxda kale ee dastuurku awood u siinaayo magacaabistooda.", "6. Waxa uu xilka ka qaadaa, isagoo la tashanaya Madaxweyne ku Xigeenka, xubnaha Wasiirrada iyo Wasiir ku Xigeennada, hay’adaha madaxa bannaan, saraakiisha ciidamada, iyo madaxda kale ee dastuurku awood u siinaayo xilka qaadistooda.", "7. Waxa uu curiyaa, oggolaadaa si dastuurka iyo sharciga waafaqsan, siyaasadda Golaha Fulinta, islamarkaana kormeeraa fulinteeda.", "8. Waxa uu u xilsaaran yahay wada xaajoodka, hagidda iyo horumarinta xidhiidhka Dawladda Federaalka iyo dawladaha xubinta ka ah.", "9. Waxa uu saxeexaa heshiisyada u dhexeeya Dawladda Waqooyi Bari, Dawladda Federaalka Soomaaliya, iyo Dawladaha xubnaha ka ah Dawladda Federaalka. Isla markaana, waxa uu meel mariyaa heshiiskaas marka Golaha Wakiilladu ansixiyaan.", "10. Waxa uu qaabilaa wufuudda caalamiga ah, Dawladda Federaalka iyo Dawladaha xubnaha ka ah Dawladda Federaalka ee martida u ah Dawladda Waqooyi Bari.", "11. Waxa uu billado iyo shahaado sharafyo guddoonsiiyaa muwaaddiniinta iyo kuwa ajnabiga ah ee loo garto in ay mutaysteen.", "12. Waxa uu leeyahay u fidinta cafiska dambiyada siyaasadda iyo kuwa kale marka uu helo soo jeedinta Golaha Adeegga Garsoorka marka laga reebo qisaasta iyo xuduudaha Diinta Islaamku jideysay.", "13. Waxa uu furaa kal fadhiyada Golaha Wakiillada.", "14. Waxa uu ku dhawaaqaa xaalada degdegga ah, marka uu helo oggolaanshaha Golaha Fulinta iyo Golaha Wakiillada.", "15. Waxa uu saxeexaa sharciyada Golaha Wakiilladu u gudbiyaan, si faafinta rasmiga ah loogu soo saaro.", "16. Waxa uu dib ugu celiyaa Golaha Wakiil lada, sharciyada iyo xeerarka isaga oo sababaynaya.", "17. Madaxweynaha muddo xileed rasmi ah dhamaysta, waxa uu noqonayaa xubin sharafeed Golaha Wakiillada, mana laha wax cod ah."], "en": ["1. The President is the symbol of the North East State, the highest head of the State and Chair of the Executive Council, and represents the unity of the people.", "2. The President is responsible for protecting Islam, the Constitution and the laws at state and federal level.", "3. The President is the Commander-in-Chief of the armed forces of the North East State.", "4. The President appoints Ministers and Deputy Ministers, in consultation with the Vice President, within thirty (30) days of the day of swearing-in.", "5. The President appoints, in consultation with the Vice President, the heads of independent institutions, officers of the forces, and other officials whose appointment the Constitution gives the President power over.", "6. The President removes from office, in consultation with the Vice President, Ministers and Deputy Ministers, heads of independent institutions, officers of the forces, and other officials whose removal the Constitution gives the President power over.", "7. The President drafts and approves, in accordance with the Constitution and the law, the policy of the Executive Council, and oversees its implementation.", "8. The President is responsible for negotiating, guiding and developing relations with the Federal Government and the member states.", "9. The President signs agreements between the North East State, the Federal Government of Somalia and the member states of the Federal Government, and implements such an agreement once the House of Representatives approves it.", "10. The President receives international delegations and delegations of the Federal Government and member states visiting the North East State.", "11. The President awards medals and certificates of honour to citizens and foreigners found to have earned them.", "12. The President may grant pardons for political and other offences on the recommendation of the Judicial Service Council, except for qisas and the hudud prescribed by Islam.", "13. The President opens the sessions of the House of Representatives.", "14. The President declares a state of emergency once the approval of the Executive Council and the House of Representatives has been obtained.", "15. The President signs the laws the House of Representatives sends, so that they are published in the Official Gazette.", "16. The President returns laws and regulations to the House of Representatives with reasons.", "17. A President who completes a full official term becomes an honorary member of the House of Representatives, without a vote."], "ch": 8, "pg": 32}, {"id": "a73", "k": "art", "n": 73, "lab": "Article 73", "labso": "Qodobka 73aad", "tso": "Awoodaha Madaxweyne ku Xigeenka", "ten": "Powers of the Vice President", "so": ["2. Mas’uuliyadda Madaxweyne ku Xigeenku waa:", "(b) Gudashada hawlaha uu Madaxweynuhu u igmado.", "(t) La-talinta Madaxwaynaha.", "(j) Ku simaha xilka Madaxweynaha marka uu Madaxweynuhu ka maqan yahay dhulka Dawladda Waqooyi Bari.", "(x) Qabashada xilka Madaxweynaha marka uu bannaanaado si waafaqsan dastuurka."], "en": ["2. The responsibilities of the Vice President are:", "(a) Carrying out the tasks the President delegates.", "(b) Advising the President.", "(c) Acting as President when the President is absent from the territory of the North East State.", "(d) Assuming the office of President when it becomes vacant, in accordance with the Constitution."], "ch": 8, "pg": 33}, {"id": "a74", "k": "art", "n": 74, "lab": "Article 74", "labso": "Qodobka 74aad", "tso": "Bannaanaanta Xafiiska Madaxweynaha iyo Madaxweyne ku Xigeenka", "ten": "Vacancy in the Office of President and Vice President", "so": ["1. Xafiiska Madaxweynaha ama Madaxweyne ku Xigeenka waxa uu bannaanaanayaa marka ay yimaadaan xaaladahan:", "(b) Geeri ku timaada Madaxweynaha ama Madaxweyne ku Xigeenka;", "(t) Iscasilaadda Madaxweynaha ama Madaxweyne ku Xigeenka;", "(j) Marka uu Dawladda Waqooyi Bari ka maqnaado lixdan (60) maalmood oo xidhiidh ah, marka laga reebo xaalad caafimaad oo soo kabasho leh;", "(x) Marka Madaxweynaha ama Madaxweyne ku Xigeenka xilka lagaga xayuubiyo si waafaqsan qodobka 76aad ama iscasilo si waafaqsan qodobka 77aad ee Dastuurka;", "(kh) Marka Madaxweynaha ama Madaxweyne ku Xigeenka uu ku dhaco xanuun joogto ah oo sababa xil gudasho la’aan muddo ka badan sadddex bilood, ayna caddeeyeen xeeldheereyaal caafimaad;", "(d) Marka Madaxweynaha ama Madaxweyne ku Xigeenku isu sharraxo xil kale."], "en": ["1. The office of President or Vice President becomes vacant in these circumstances:", "(a) Death of the President or Vice President;", "(b) Resignation of the President or Vice President;", "(c) Absence from the North East State for sixty (60) consecutive days, except for a medical condition with recovery;", "(d) When the President or Vice President is removed from office under Article 76 or resigns under Article 77 of the Constitution;", "(e) When the President or Vice President suffers a permanent illness causing incapacity for more than three months, as confirmed by medical experts;", "(f) When the President or Vice President stands for another office."], "ch": 8, "pg": 33}, {"id": "a75", "k": "art", "n": 75, "lab": "Article 75", "labso": "Qodobka 75aad", "tso": "Buuxinta Xafiiska Madaxweynaha iyo Madaxweyne ku Xigeenka", "ten": "Filling the Office of President and Vice President", "so": ["1. Marka uu bannaanaado xafiiska Madaxweynaha, si waafaqsan Qodobka 7 4aad, xilka Madaxweynaha waxaa qabanaya Madaxweyne ku Xigeenka inta ka hadhsan muddo xileedka Dawladda.", "2. Marka uu bannaanaado xafiiska Madaxweyne ku Xigeenka, xaaladaha ku xusan Qodobka 7 4aad, waxaa Madaxweyne ku Xigeen si toos ah u soo dooranaya Golaha Wakiillada soddon maalmood (30) gudahood, waxa uuna xilka haynayaa inta ka hadhsan muddo xileedka Dawladda.", "3. Marka ay isku mar bannaanaadaan xafiisyada Madaxweynaha iyo Madaxweyne ku Xigeenka, waxaa xilka sii haynaya Guddoomiyaha Golaha Wakiillada, waana in doorasho lagu qabto muddo lixdan (60) maalmood gudahood ah."], "en": ["1. When the office of President becomes vacant under Article 74, the Vice President assumes the office of President for the remainder of the State's term.", "2. When the office of Vice President becomes vacant in the circumstances in Article 74, the House of Representatives shall directly elect a Vice President within thirty (30) days, who holds office for the remainder of the State's term.", "3. When the offices of President and Vice President become vacant at the same time, the Speaker of the House of Representatives holds the office in the interim, and an election must be held within sixty (60) days."], "ch": 8, "pg": 34}, {"id": "a76", "k": "art", "n": 76, "lab": "Article 76", "labso": "Qodobka 76aad", "tso": "Xil ka Qaadista Madaxweynaha iyo Madaxweyne ku Xigeenka", "ten": "Removal of the President and Vice President", "so": ["1. Marka Madaxweynaha iyo Madaxweyne Ku Xigeenka, mid ama labadaba, lagu eedeeyo ku xadgudub Dastuur, khiyaano qaran, iyo xil gudasho la'aan waxaa loo marayaa labada habraac ee hoos ku cad midkood:", "(b) In ugu yaraan saddex meelood hal meel (1/3) xubnaha Golaha Wakiilladu soo-jeediyaan xil ka qaadista Madaxweynaha ama Madaxweyne ku Xigeenka, iyagoo guddoonka u gudbinaya caddaymaha eedeynta;", "(t) In Xeer Ilaaliyaha Guud bilaabo habraaca eedeynta Madaxweynaha iyo Madaxweyne ku Xigeenka, isagoo caddaymaha eedaynta u gudbinaya Golaha Wakiillada.", "2. Golaha Wakiilladu waxa uu ka doodayaa soo jeedinta iyo caddaymaha la soo hor dhigay, waxaana la siinayaa fursad is-difaac.", "3. Madaxweynaha iyo Madaxweyne ku Xigeenka waxaa xil ka qaadis lagu samayn karaa marka Golaha Wakiilladu ugu codeeyo, cod gacan taag ah saddex meelood labo (2/3) Xubnaha Golaha Wakiillada."], "en": ["1. When the President or the Vice President, or both, are accused of violating the Constitution, treason, or failure to perform their duties, one of the two procedures below is followed:", "(a) At least one third (1/3) of the members of the House of Representatives propose the removal of the President or Vice President, submitting the evidence of the accusation to the Speakership;", "(b) The Attorney General begins the procedure of accusing the President or Vice President, submitting the evidence of the accusation to the House of Representatives.", "2. The House of Representatives debates the proposal and the evidence presented, and the accused is given an opportunity to defend themselves.", "3. The President and Vice President may be removed when the House of Representatives votes for it by a show of hands of two thirds (2/3) of its members."], "ch": 8, "pg": 34}, {"id": "a77", "k": "art", "n": 77, "lab": "Article 77", "labso": "Qodobka 77aad", "tso": "Iscasilaadda Madaxweynaha iyo Madaxweyne ku Xigeenka", "ten": "Resignation of the President and Vice President", "so": ["1. Iscasilaadda Madaxweynaha iyo Madaxweyne ku Xigeenku waxa ay ku ansaxaysaa:", "(b) Marka uu qoraal ahaan ugu gudbiyo iscasilaaddiisa Golaha Wakiillada isaga oo marsiinaya Guddoomiyaha Golaha Wakiillada.", "(t) Marka uu iscasilaaddiisa shaaciyo hadal ahaan ama qoraal ahaan isaga oo marsiinaya warbaahin furan."], "en": ["1. The resignation of the President or Vice President is valid:", "(a) When they submit their resignation in writing to the House of Representatives through the Speaker of the House.", "(b) When they announce their resignation orally or in writing through open media."], "ch": 8, "pg": 35}, {"id": "a78", "k": "art", "n": 78, "lab": "Article 78", "labso": "Qodobka 78aad", "tso": "Shuruudaha Wasiiradda iyo Wasiir ku Xigeenka", "ten": "Requirements for Ministers and Deputy Ministers", "so": ["1. Shuruudaha laga doonayo in uu buuxiyo xubinta loo magacaabayo Wasiir iyo Wasiir ku Xigeen:", "(b) Waa in uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari.", "(t) Waa in uu yahay Muslim, ku dhaqma Diinta Islaamka, anshax wanaagsan, xilkas ah, maskax ahaanna fayow.", "(j) Waa in uu daacad u yahay mabaadi’da aasaasiga ah ee Dawladda Waqooyi Bari.", "(x) Waa in uu u diiwaangashan yahay cod bixiye.", "(kh) Waa in uu haysto shahaado heerka koowaad ee jaamacadda ah, isla markaana leeyahay ugu yaraan khibrad shan (5) sano ah.", "(d) Waa In uu ka tanaasulo haddii uu hayo xil kale.", "(r) Waa in aan da’diisu ka yarayn soddon (30) sano.", "(s) Waa in aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin."], "en": ["1. The requirements a person appointed as Minister or Deputy Minister must meet:", "(a) They must be a citizen who is a member of the people of the North East State.", "(b) They must be a Muslim who practises Islam, of good character, responsible and of sound mind.", "(c) They must be loyal to the fundamental principles of the North East State.", "(d) They must be registered as a voter.", "(e) They must hold a first-level (bachelor's) university degree and have at least five (5) years of experience.", "(f) They must resign if they hold another office.", "(g) They must be at least thirty (30) years old.", "(h) They must not have been convicted of a crime by a final judgment of a competent court."], "ch": 8, "pg": 35}, {"id": "a79", "k": "art", "n": 79, "lab": "Article 79", "labso": "Qodobka 79aad", "tso": "Xilka Wasiirka iyo Wasiir ku Xigeenka", "ten": "Office of Minister and Deputy Minister", "so": ["1. Xilka wasiirku waa:", "(b) Mas’uulka ugu sarreeya wasaaradda loo magacaabay, siyaasad ahaan iyo hagidda maamulka;", "(t) Fulinta siyaasadda Dawladda ee la xidhiidha wasaaradda;", "(j) Go’aaminta siyaasadda iyo hawl fulinta wasaaradda iyo shaqaalaheeda isaga oo la tashanaya Wasiir ku Xigeenka.", "2. Xilka wasiir ku Xigeenku waa:", "(b) La talinta Wasiirka ee hawlaha wasaaradda;", "(t) Qabashada xilka iyo waajibaadka Wasiirka marka uu maqan yahay ama uusan si ku meelgaadh ah xilka u gudan karin;", "(j) Fulinta hawlaha uu u igmado Wasiirku."], "en": ["1. The office of Minister is:", "(a) The highest official of the ministry to which they are appointed, politically and in directing its administration;", "(b) Implementing the State's policy relating to the ministry;", "(c) Determining the policy and operations of the ministry and its staff, in consultation with the Deputy Minister.", "2. The office of Deputy Minister is:", "(a) Advising the Minister on the work of the ministry;", "(b) Assuming the Minister's office and duties when the Minister is absent or temporarily unable to perform them;", "(c) Carrying out the tasks the Minister delegates."], "ch": 8, "pg": 35}, {"id": "a80", "k": "art", "n": 80, "lab": "Article 80", "labso": "Qodobka 80aad", "tso": "Kalsooni Kala Noqoshada Wasiirrada", "ten": "Vote of No Confidence in Ministers", "so": ["1. Golaha Wakiilladu waxa uu kalsoonida kala noqon karaan xubnaha wasiirrada.", "2. Kalsooni kala noqoshada wasiirrada waxaa soo jeedinaya:", "(b) Saddex meelood hal meel (1/3) xubnaha Golaha Wakiillada;", "(t) Xeer Ilaaliyaha Guud waxa uu soo jeedin karaa kalsooni kala noqoshada mid ama ka badan oo wasiirada ka mid ah.", "3. Kalsooni kala noqoshadu waxa ay ansaxaysaa, marka ay u codeeyaan kala badh in ka badan (50%+1) guntanka fadhiga Golaha Wakiillada.", "4. Marka codka kalsooni kala noqoshadu ansaxo, Madaxweynuhu waa in uu magacaabaa wasiirro cusub oo lagu beddelo wasiirada kalsoonida lagala noqday, uuna ku horgeeyo Golaha Wakiillada muddo soddon (30) maalmood gudahood ah.", "5. Marka Wasiirrada kalsoonida lagala noqdo, waxa ay sii wadanayaan hawshooda mudadda xil gaadhsiinta, mana hindisi karaan wax cusub."], "en": ["1. The House of Representatives may withdraw confidence from members of the Council of Ministers.", "2. A vote of no confidence in ministers may be proposed by:", "(a) One third (1/3) of the members of the House of Representatives;", "(b) The Attorney General, who may propose a vote of no confidence in one or more ministers.", "3. A vote of no confidence passes when more than half (50%+1) of the quorum of the sitting of the House of Representatives votes for it.", "4. When a vote of no confidence passes, the President must appoint new ministers to replace those who lost confidence, and present them to the House of Representatives within thirty (30) days.", "5. Ministers who lose a vote of confidence continue their work during the handover period, but may not initiate anything new."], "ch": 8, "pg": 36}, {"id": "a81", "k": "art", "n": 81, "lab": "Article 81", "labso": "Qodobka 81aad", "tso": "Xil Waayidda Wasiirrada", "ten": "Loss of Office of Ministers", "so": ["1. Wasiiradu waxa ay xilka waayayaan mid ama wadar ahaan:", "(b) Marka Madaxweynuhu xilka ka qaado;", "(t) Marka uu iscasilaad qoraal ah u gudbiyo Madaxweynaha, isla markaana ka aqbalo;", "(j) Marka Golaha Wakiilladu kalsoonida kala noqdo;", "(x) Marka uu isu sharaxo ama qabto xil kale oo dawladeed;", "(kh) Marka uu lumiyo shuruudihii lagu magacaabay ee ku xusan qodobka 78aad.", "2. Wasiiradu waxa ay sii wadanayaan hawshooda mudadda xil gaadhsiinta, mana hindisi karaan wax cusub."], "en": ["1. Ministers lose office, individually or collectively:", "(a) When the President removes them;", "(b) When they submit a written resignation to the President and it is accepted;", "(c) When the House of Representatives withdraws its confidence;", "(d) When they stand for or take up another government office;", "(e) When they lose the requirements for appointment set out in Article 78.", "2. Ministers continue their work during the handover period, but may not initiate anything new."], "ch": 8, "pg": 36}, {"id": "a82", "k": "art", "n": 82, "lab": "Article 82", "labso": "Qodobka 82aad", "tso": "Qaab Dhismeedka Garsoorka", "ten": "Structure of the Judiciary", "so": ["1. Hay’adaha Garsoorka Dawladda Waqooyi Bari waxa ay ka kooban tahay:", "(b) Golaha Adeegga Garsoorka;", "(t) Maxkamadaha;", "(j) Iyo Xeer-ilaalinta.", "2. Maxkamadaha Dawladda Waqooyi Bari waxa ay ka kooban yihiin:", "(b) Maxkamadda Sare;", "(t) Maxkamadda Racfaanka ee Gobollada;", "(j) Maxkamadda Derejeda Koowaad;", "(x) Maxkamadaha Ciidammada;", "3. Golaha Adeegga Garsoorku waa ka madax bannaan yahay goleyaasha kale ee Dawladda, iyaga oo ilaalinaya Dastuurka iyo shuruucda kale ee dalka u yaala."], "en": ["1. The judicial institutions of the North East State consist of:", "(a) The Judicial Service Council;", "(b) The courts;", "(c) And the prosecution service.", "2. The courts of the North East State consist of:", "(a) The Supreme Court;", "(b) The Regional Courts of Appeal;", "(c) The Courts of First Instance;", "(d) The Military Courts;", "3. The Judicial Service Council is independent of the other organs of the State, and upholds the Constitution and the other laws in force in the country."], "ch": 9, "pg": 37}, {"id": "a83", "k": "art", "n": 83, "lab": "Article 83", "labso": "Qodobka 83aad", "tso": "Awoodaha iyo Waajibaadka Garsoorka", "ten": "Powers and Duties of the Judiciary", "so": ["1. Awoodaha garsoorku waa dhageysiga iyo go’aaminta dacwadaha.", "2. Xukunnada garsoorku soo saaro waa in lagu saleeyo Shareecada Islaamka, dastuurka Dawladda Waqooyi Bari, Dastuurka Jamhuuriyadda Federalka ee Soomaaliya, shuruucda caalamiga ah iyo qawaaniinta kale ee u yaalla dalka.", "3. Garsoorayaashu iyo xeer ilaaliyayaashu waxay leeyihiin xasaanad marka ay xilkoodda gudanayaan.", "4. Xeerka Golaha Adeegga Garsoorka ayaa nidaaminaya awoodaha iyo mas’uuliyadaha Hay’adaha Garsoorka."], "en": ["1. The powers of the judiciary are to hear and decide cases.", "2. Judgments issued by the judiciary must be based on Islamic Sharia, the Constitution of the North East State, the Constitution of the Federal Republic of Somalia, international law and the other laws in force in the country.", "3. Judges and prosecutors have immunity while carrying out their duties.", "4. The Judicial Service Council Law shall regulate the powers and responsibilities of the judicial institutions."], "ch": 9, "pg": 37}, {"id": "a84", "k": "art", "n": 84, "lab": "Article 84", "labso": "Qodobka 84aad", "tso": "Golaha Adeegga Garsoorka", "ten": "The Judicial Service Council", "so": ["1. Golaha Adeegga Garsoorku waa golaha ugu sarreeya maamulka Garsoorka waana mid madax bannaan, waana in uu ahaadaa:", "(b) Xor, dhexdhexaad, aan dhinacna raacsanayn;", "(t) Waa in uu hubiyaa in garsoorku xor yahay;", "(j) Waxa uu talo bixin ka siiyaa Golaha Fulinta arrimaha garsoorka;", "(x) Xubnaha Golaha Adeegga Garsoorka waxa xasaanad siinaya ama kala noqonaya Golaha Wakiillada.", "2. Golaha Adeegga Garsoorku waxa uu ka kooban yahay toddoba (7) xubnood oo kala ah:", "(b) Guddoomiyaha Maxkamadda Sare;", "(t) Xeer Ilaaliyaha Guud;", "(j) Ilaaliyaha Xuquuqda Aadamaha;", "(x) Laba (2) xubnood oo culimo ah;", "(kh) Laba (2) xubnood oo qareenno ah.", "3. Xubnaha Golaha Addeega Garsoorku waxa ay dhexdooda ka dooranayaan guddoonka golaha oo ka kooban Guddoomiye, Guddoomiye ku Xigeen Koowaad iyo Guddoomiye ku Xigeen Labaad.", "4. Guddoomiyaha Maxkamadda Sare iyo Xeer Ilaaliyaha Guud ma noqonayaan guddoonka Golaha Adeegga Garsoorka.", "5. Shuruudaha laga doonayo xubnaha Golaha Adeegga Garsoorka waxa ay la mid yihiin garsooreyaasha Maxakamada Sare.", "6. Sababaha waayidda xubinimada Golaha Adeegga Garsoorka waxa ay la mid yihiin kuwa garsooreyaasha Maxakamada Sare.", "7. Madaxweynaha ayaa digreeto ku soo saaraya xubnaha Golaha Adeegga Garsoorka, ka dib marka uu helo soo jeedinta Wasiirka Caddaaladda oo raacaya qaab dhismeedka Golaha Adeegga Garsoorka sida ku cad faqrada 2aad ee qodobkan, waxaana cod hal dheeri ah (50%+1) ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "8. Xil ka qaadista Golaha Adeegga Garsoorka waxaa soo jeedinaya Madaxweynaha, waxaana cod hal dheeri (50%+1) ah ku ansixinaya xubnaha Golaha Wakiillada.", "9. Golaha Adeegga Garsoorka waxa uu leeyahay xasaanad shaqo muddada ay xilka hayaan.", "10. Xeerka Adeegga Garsoorka ayaa nidaaminaya waajibaadka iyo hawlaha Golaha Adeegga Garsoorka."], "en": ["1. The Judicial Service Council is the highest body of judicial administration and is independent; it must be:", "(a) Free, neutral and impartial;", "(b) It must ensure that the judiciary is free;", "(c) It advises the Executive Council on judicial matters;", "(d) The members of the Judicial Service Council are granted immunity, or have it withdrawn, by the House of Representatives.", "2. The Judicial Service Council consists of seven (7) members:", "(a) The Chief Justice of the Supreme Court;", "(b) The Attorney General;", "(c) The Human Rights Defender;", "(d) Two (2) members who are Islamic scholars;", "(e) Two (2) members who are lawyers.", "3. The members of the Judicial Service Council elect from among themselves the leadership of the Council, consisting of a Chair, a First Deputy Chair and a Second Deputy Chair.", "4. The Chief Justice of the Supreme Court and the Attorney General may not form part of the leadership of the Judicial Service Council.", "5. The requirements for members of the Judicial Service Council are the same as for judges of the Supreme Court.", "6. The grounds for losing membership of the Judicial Service Council are the same as for judges of the Supreme Court.", "7. The President issues a decree appointing the members of the Judicial Service Council after receiving the proposal of the Minister of Justice, following the composition in Clause 2 of this Article, and they are approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "8. The removal of the Judicial Service Council is proposed by the President and approved by a vote of one more than half (50%+1) of the members of the House of Representatives.", "9. The Judicial Service Council has functional immunity for the period its members hold office.", "10. The Judicial Service Law shall regulate the duties and functions of the Judicial Service Council."], "ch": 9, "pg": 38}, {"id": "a85", "k": "art", "n": 85, "lab": "Article 85", "labso": "Qodobka 85aad", "tso": "Awoodaha iyo Waajibaadka Golaha Adeegga Garsoorka", "ten": "Powers and Duties of the Judicial Service Council", "so": ["1. Xubnaha Golaha Addeega Garsoorku waxa ay dhexdooda ka dooranayaan guddonka golaha oo ka kooban Guddoomiye, Guddoomiye ku Xigeen Koowaad iyo Guddoomiye ku Xigeen Labaad.", "2. Golaha Adeegga Garsoorku waxa uu leeyahay waajibaadkan:", "(b) Dejinta shuruudaha shaqo ee garsoorka;", "(t) Magacaabista, dallacsiinta, beddelaadda iyo xil ka qaadista garsooreyaasha iyo xeer ilaaliyeyaasha maxkamadaha rafcaanka iyo derejada koowaad;", "(j) Astaynta awoodaha iyo ikhtisaaska hay’adaha garsoorka;", "(x) Kormeerka iyo anshax marinta xubnaha garsoorka;", "(kh) Qoondaynta mushahaarka, gunnooyinka iyo hawlgabka garsooreyaasha, xeerilaaliyeyaasha iyo kaaliyayaasha;", "(d) Goluhu waxa uu mas’uul ka yahay maamulka shaqaalaha garsoorka.", "(r) Goluhu waxa uu aasaasaa, isla markaana maamulaa goobaha tababarka garsooryaasha, xeer-ilaaliyayaasha, iyo kaaliyayaasha.", "3. Xubinta Golaha Adeegga Garsoorka waxa ay xilka haynaysaa toddoba (7) sano, oo la cusboonaysiin karo mar keliya.", "4. Xeerka Adeegga Garsoorka ayaa lagu qeexayaa qaab dhismeedka iyo habraacyada hay’adaha Garsoorka."], "en": ["1. The members of the Judicial Service Council elect from among themselves the leadership of the Council, consisting of a Chair, a First Deputy Chair and a Second Deputy Chair.", "2. The Judicial Service Council has these duties:", "(a) Setting the conditions of service of the judiciary;", "(b) Appointing, promoting, transferring and removing judges and prosecutors of the courts of appeal and of first instance;", "(c) Defining the powers and jurisdiction of the judicial institutions;", "(d) Supervising and disciplining members of the judiciary;", "(e) Allocating the salaries, allowances and pensions of judges, prosecutors and assistants;", "(f) The Council is responsible for managing judicial staff.", "(g) The Council establishes and manages training centres for judges, prosecutors and assistants.", "3. A member of the Judicial Service Council holds office for seven (7) years, renewable once only.", "4. The Judicial Service Law shall define the structure and procedures of the judicial institutions."], "ch": 9, "pg": 39}, {"id": "a86", "k": "art", "n": 86, "lab": "Article 86", "labso": "Qodobka 86aad", "tso": "Maxkamadda Sare", "ten": "The Supreme Court", "so": ["1. Maxkamadda Sare ayaa ah tan ugu sarraysa maxkamaddaha Dawladda Waqooyi Bari.", "2. Maxkamadda Sare waxa ay ku shaqaysaa go'aan wadareed, waxayna ka kooban tahay Shan (5) xubnood oo kala ah: Guddoomiye, Guddoomiye ku Xigeen, iyo saddex (3) garsoore.", "3. Maxkamadda Sare waxa ay yeelanaysaa laba (2) garsoore oo kayd ah, buuxiyayna shuruudaha Garsoorayaasha rasmiga ah, kuna imanaya habraaca garsoorayaasha Maxkamadda Sare.", "4. Guddoomiyaha Maxkamadda Sare waxa uu u yeedhi karaa Garsooreyaasha Kaydka ah, si ay dacwad ula qaadaan, marka garsoorayaasha qaarkood fasax galaan, la duro, ama garsoore si gaar ah uga cudurdaarto in uu wax ka galo qaadista dacwadaha qaarkood.", "5. Xarunta Maxkamadda Sare waa caasimadda Dawladda Waqooyi Bari, hase ahaatee dacwadaha waxa ay ku qaadi kartaa meel kasta oo Deegaanka ah.", "6. Go'aannada Maxkamadda Sare, waxa ay ku ansaxaan aqlabiyadda Xubnaha Maxkamadda, Garsooraha ama Garsoorayaasha aan ogoleyn go'aanka la gaadhay, waxa ay muujisan karaan codkooda diidmada ah.", "7. Kaaliyaha Maxkamadda Sare waa in uu la socodsiiyaa go'aannada maxkamadda dhinacyada ay khusayso.", "8. Garsooreyaasha Maxkamadda Sare Madaxweynaha ayaa magacaabaya marka uu helo soo jeedinta Golaha Adeegga Garsoorka, waxaana cod hal dheeri ah (50%+1) ku ansixinaya xubnaha Golaha Wakiillada.", "9. Garsoorayaasha Maxkamadda Sare waxaa xilka looga qaadi karaa cod hal dheeri ah (50%+1) guntanka fadhiga Golaha Wakiillada marka Golaha Adeegga Garsoorku soo gudbiyo, iyadoo loo cuskanayo sababaha uu dhigayo qodobka 89aad ee Dastuurka."], "en": ["1. The Supreme Court is the highest court of the North East State.", "2. The Supreme Court works by collective decision and consists of five (5) members: a Chief Justice, a Deputy Chief Justice and three (3) judges.", "3. The Supreme Court shall have two (2) reserve judges, who meet the requirements of the regular judges and are appointed through the procedure for Supreme Court judges.", "4. The Chief Justice of the Supreme Court may call on the reserve judges to hear a case when some judges are on leave, have been challenged, or a judge recuses themselves from hearing particular cases.", "5. The seat of the Supreme Court is the capital of the North East State, but it may hear cases anywhere in the State.", "6. Decisions of the Supreme Court are passed by a majority of its members; a judge or judges who disagree with the decision reached may record their dissenting vote.", "7. The Registrar of the Supreme Court must notify the parties concerned of the court's decisions.", "8. Supreme Court judges are appointed by the President on the proposal of the Judicial Service Council, and approved by a vote of one more than half (50%+1) of the members of the House of Representatives.", "9. Supreme Court judges may be removed from office by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives when the Judicial Service Council submits it, on the grounds set out in Article 89 of the Constitution."], "ch": 9, "pg": 39}, {"id": "a87", "k": "art", "n": 87, "lab": "Article 87", "labso": "Qodobka 87aad", "tso": "Awoodaha iyo Waajibaadka Maxkamadda Sare", "ten": "Powers and Duties of the Supreme Court", "so": ["1. Maxkamadda Sare:", "(b) Waa maxkamadda ugu sarreysa Dawladda Waqooyi Bari, lehna awoodda Maxkamada Dastuuriga ah;", "(t) Maxkamadda Sare waxa ay xallisaa khilaafaadka arimaha qawaaniinta ee maxkamadaha hoose aanay awoodda u lahayn;", "(j) Maxkamadda Sare waxa ay xukun kama dambays ah ka soo saartaa cabashada laga qaato xukunka Maxkamadda racfaanka;", "(x) Maxkamadda Sare waxa ay xukuntaa qaab sharciyeedka la raacay ee dacwadaha lagu go’aamiyey heerarka kala duwan ee maxkamadaha dalka iyo dibeddiisa ee laga fulinayo gudaha Dawladda Waqooyi Bari.", "(kh) Maxkamadda Sare waxa ay kormeertaa maxkamadaha rafcaanka iyo derejada koowaad;", "(d) Maxkamadda Sare waxa ay dhegeysataa dacwadaha mas’uuliyiinta Sare.", "(r) Maxkamadda Sare waxa ay ku dhawaaqdaa sugnaanta aftida wax ka bedelka Dastuurka.", "(s) Maxkamadda Sare waxa ay ku dhawaaqdaa sugnaanta natiijada doorashooyinka.", "(t) Maxkamadda Sare waxa ay ku dhawaaqdaa sugnaanta xil ka qaadista iyo bannaanaanta xilka Madaxweynaha iyo Madaxweyne ku Xigeenka.", "(sh) Xeerka Adeegga Garsoorka ayaa nidaaminaya awoodaha iyo waajibaadka Maxkamadda Sare."], "en": ["1. The Supreme Court:", "(a) Is the highest court of the North East State, with the powers of a Constitutional Court;", "(b) The Supreme Court resolves disputes on questions of law over which the lower courts have no jurisdiction;", "(c) The Supreme Court issues the final judgment on appeals against judgments of the Court of Appeal;", "(d) The Supreme Court rules on the legal form followed in cases decided at the various levels of courts, inside and outside the country, that are to be enforced within the North East State.", "(e) The Supreme Court supervises the courts of appeal and of first instance;", "(f) The Supreme Court hears cases against senior officials.", "(g) The Supreme Court declares the validity of a referendum amending the Constitution.", "(h) The Supreme Court declares the validity of election results.", "(b) The Supreme Court declares the validity of the removal from office, and of a vacancy in the office, of the President and Vice President.", "(i) The Judicial Service Law shall regulate the powers and duties of the Supreme Court."], "ch": 9, "pg": 40}, {"id": "a88", "k": "art", "n": 88, "lab": "Article 88", "labso": "Qodobka 88aad", "tso": "Shuruudaha Garsoorayaasha Maxkamadda Sare", "ten": "Requirements for Supreme Court Judges", "so": ["1. Garsooraha maxkamadda sare waa in uu buuxiyaa shuruudahan:", "(b) Waa in uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) Waa in uu Muslim yahay, ku dhaqma Diinta Islaamka, leeyahay anshax wanaagsan, maskax ahaanna fayow yahay;", "(j) Waa in uu daacad u yahay mabaadi’da asaasiga ah ee Dawladda Waqooyi Bari;", "(x) Waa In aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin;", "(kh) Waa in aan da’diisu ka yarayn afartan (40) sano;", "(d) Waa in uu haystaa ugu yaraan shahaado heerka kowaad ee jaamacadda oo ah shareecada ama qaanuunka;", "(r) Waa in uu leeyahay ugu yaraan toddoba (7) sano oo khibrad la xidhiidha Shareecada iyo Qaanuunka ah."], "en": ["1. A Supreme Court judge must meet these requirements:", "(a) They must be a citizen who is a member of the people of the North East State;", "(b) They must be a Muslim who practises Islam, of good character and of sound mind;", "(c) They must be loyal to the fundamental principles of the North East State;", "(d) They must not have been convicted of a crime by a final judgment of a competent court;", "(e) They must be at least forty (40) years old;", "(f) They must hold at least a first-level university degree in Sharia or law;", "(g) They must have at least seven (7) years of experience related to Sharia and law."], "ch": 9, "pg": 41}, {"id": "a89", "k": "art", "n": 89, "lab": "Article 89", "labso": "Qodobka 89aad", "tso": "Waayidda Xubinnimada Maxkamadda Sare", "ten": "Loss of Membership of the Supreme Court", "so": ["1. Xubinnimada Maxkamadda Sare waxaa lagu waayi karaa marka ay sugnaato mid ka mid ah sababaha hoos ku qoran:", "(b) Geeri ama xanuun ku yimaadda xubinta oo sababa in ay xilkeeda gudan kari waydo;", "(t) Marka xubintu lumiso shuruudihii lagu soo doortay mid ka mid ah, ugu yaraan;", "(j) Marka ay caddaato in ay ku xadgudubtay Shareecada Islaamka iyo Dastuurka;", "(x) Marka ay iscasilaad soo gudbiso lagana aqbalo;", "(kh) Marka xubintu isu sharraxdo ama qabto xil kale oo dawladeed.", "(kh) Marka maxkamad awood u leh ku riddo xukun ciqaabeed kama dambays ah."], "en": ["1. Membership of the Supreme Court may be lost when one of the following grounds is established:", "(a) Death, or an illness that leaves the member unable to perform their duties;", "(b) When the member loses at least one of the requirements on which they were selected;", "(c) When it is proven that they have violated Islamic Sharia and the Constitution;", "(d) When they submit a resignation and it is accepted;", "(e) When the member stands for or takes up another government office.", "(e) When a competent court passes a final criminal judgment."], "ch": 9, "pg": 41}, {"id": "a90", "k": "art", "n": 90, "lab": "Article 90", "labso": "Qodobka 90aad", "tso": "Maxkamadda Rafcaanka", "ten": "The Court of Appeal", "so": ["1. Maxkamadda Rafcaanka ee Goballada waxaa fadhigoodu yahay xarumaha gobollada.", "2. Maxkamaddu waxa ay dhegaysataa dacwadaha rafcaanka laga qaato go’aannada maxkamadaha darajada koowaad.", "3. Maxkamadda Rafcaanka ee gobolladdu waxa ay awood u leedahay oo keliya gobolka ay ka hawlgasho.", "4. Maxkamadda Rafcaanku waa in ay yeelataa ugu yaraan saddex (3) garsoore.", "5. Shuruudaha garsooreyaasha Maxkamadda Rafcaanka waxa ay la mid yihiin shuruudaha u yaalla garsooreyaasha Maxkamadda Sare sida ku xusan qodobka 88aad ee dastuurka marka laga reebo khibradda oo noqonaysa shan (5) sano."], "en": ["1. The Regional Courts of Appeal sit in the regional capitals.", "2. The court hears appeals against decisions of the courts of first instance.", "3. A Regional Court of Appeal has jurisdiction only in the region where it operates.", "4. A Court of Appeal must have at least three (3) judges.", "5. The requirements for judges of the Court of Appeal are the same as those for Supreme Court judges in Article 88 of the Constitution, except that the experience required is five (5) years."], "ch": 9, "pg": 41}, {"id": "a91", "k": "art", "n": 91, "lab": "Article 91", "labso": "Qodobka 91aad", "tso": "Maxkamadda Derejada Koowaad", "ten": "The Court of First Instance", "so": ["1. Maxkamadda derejada koowaad ayey ka bilowdaan dhammaan dacwaduhu, marka laga reebo kuwa la xidhiidha maamulka iyo dastuurka oo ay dhegeysato Maxkamadda Sare.", "2. Tirada garsoorayaasha maxkamadaha derejada koowaad waxa lagu go’aamin doona Xeerka Adeegga Garsoorka."], "en": ["1. All cases begin at the Court of First Instance, except those relating to administration and the Constitution, which the Supreme Court hears.", "2. The number of judges of the courts of first instance shall be determined by the Judicial Service Law."], "ch": 9, "pg": 42}, {"id": "a92", "k": "art", "n": 92, "lab": "Article 92", "labso": "Qodobka 92aad", "tso": "Maxkamadaha Ciidamada", "ten": "Military Courts", "so": ["1. Maxkamadaha ciidammadu waxa ay gaar u yihiin qaadista dembiyada ay galaan xubnaha ciidammada iyo ciddii isu ekeysiisa oo keli ah, marka laga reebo sida ku xusan faqrada 2 ee qodobkan.", "2. Gaboodfallada xubno ka tirsan ciidamada ay ka galaan dad rayid ah, waa in dacwaddooda lagu qaadaa Maxkamadaha rayidka ah.", "3. Xeer gaar ah ayaa nidaaminaya maxkamadaha ciidammada iyo xeer ilaaliyayaashooda."], "en": ["1. Military courts are exclusively for trying offences committed by members of the forces and anyone impersonating them, except as provided in Clause 2 of this Article.", "2. Abuses committed by members of the forces against civilians must be tried in the civilian courts.", "3. A specific law shall regulate the military courts and their prosecutors."], "ch": 9, "pg": 42}, {"id": "a93", "k": "art", "n": 93, "lab": "Article 93", "labso": "Qodobka 93aad", "tso": "Xeer-ilaaliyaha Guud", "ten": "The Attorney General", "so": ["1. Xafiiska Xeer-ilaaliyaha Guud:", "(b) Waxa uu u hoggaansamaa sharciga oo keliya;", "(t) Waxa uu ka jawaabaa arrimaha sharciga;", "(j) Xarunta Xafiiska Xeer-ilaaliyaha Guud waa magaalo madaxda Waqooyi Bari;", "2. Awoodda Xeer-ilaaliyaha Guud waxa ay ku baahsan tahay Dawladda Waqooyi Bari oo dhan.", "3. Xafiiska Xeer-laalinta Guud waxa uu ka kooban yahay:", "(b) Xeer-ilaaliyaha Guud ee Dawladda Waqooyi Bari;", "(t) Ku Xigeenka Xeer-ilaaliyaha Guud;", "(j) Xeer-ilaaliyeyaasha Gobollada.", "(x) Xeer-ilaaliyaha Guud iyo ku xigeenkiisu waxa ay derejo ahaan la siman yihiin garsooreyaasha Maxkamadda Sare.", "(kh) Xeer Ilaaliyayaasha Gobolladu waxa ay la mid yihiin xagga derejada garsoorayaasha maxkamadaha racfaanka.", "4. Xeer-ilaaliyayaashu waxa ay leeyihiin xuquuq iyo xasaanad la mid ah tan garsooreyaasha.", "5. Xeer-ilaaliyaha Guud waxa uu xilka haynayaa toddoba (7) sano, oo la cusboonaysiin karo mar keliya."], "en": ["1. The Office of the Attorney General:", "(a) Is subject to the law alone;", "(b) Responds on legal matters;", "(c) The seat of the Office of the Attorney General is the capital of the North East;", "2. The authority of the Attorney General extends across the whole North East State.", "3. The Office of the Attorney General consists of:", "(a) The Attorney General of the North East State;", "(b) The Deputy Attorney General;", "(c) The Regional Prosecutors.", "(d) The Attorney General and Deputy rank equally with Supreme Court judges.", "(e) The Regional Prosecutors rank equally with judges of the courts of appeal.", "4. Prosecutors have rights and immunity equal to those of judges.", "5. The Attorney General holds office for seven (7) years, renewable once only."], "ch": 9, "pg": 42}, {"id": "a94", "k": "art", "n": 94, "lab": "Article 94", "labso": "Qodobka 94aad", "tso": "Magacaabista Xeer-ilaalinta Guud", "ten": "Appointment of the Attorney General", "so": ["1. Xeer Ilaaliyaha Guud waxa magacaabaya Madaxweynaha marka uu helo soo jeedinaya Wasiirka Wasaaradda Caddaaladda, waxaana cod hal dheeri ah (50%+1) ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "2. Shuruudaha Xeer-ilaaliyaha Guud iyo ku Xigeenkiisa:", "(b) Waa in uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) Waa in uu Muslim yahay, ku dhaqma Diinta Islaamka, leeyahay anshax wanaagsan, maskax ahaanna fayow yahay;", "(j) Waa in uu daacad u yahay mabaadi’da aasaasiga ah ee Dawladda Waqooyi Bari;", "(x) Waa in aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin;", "(kh) Waa in aan da’diisu ka yarayn afartan (40) sano;", "(d) Waa in uu aqoon u leeyahay shareecada iyo qanuunka, isla markaana haysto shahaado heerka labaad ee jaamacadda oo ah shareecada iyo qaanuunka;", "(r) Waa in uu leeyahay ugu yaraan shan (5) sano oo khibrad la xidhiidha Shareecada ama Qaanuunka;", "(s) Waa in uu ahaadaa xor, dhexdhexaad ah, aan dhinacna raacsanayn."], "en": ["1. The Attorney General is appointed by the President on the proposal of the Minister of Justice, and approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "2. Requirements for the Attorney General and Deputy:", "(a) They must be a citizen who is a member of the people of the North East State;", "(b) They must be a Muslim who practises Islam, of good character and of sound mind;", "(c) They must be loyal to the fundamental principles of the North East State;", "(d) They must not have been convicted of a crime by a final judgment of a competent court;", "(e) They must be at least forty (40) years old;", "(f) They must have knowledge of Sharia and law and hold a second-level (master's) university degree in Sharia and law;", "(g) They must have at least five (5) years of experience related to Sharia or law;", "(h) They must be free, neutral and impartial."], "ch": 9, "pg": 43}, {"id": "a95", "k": "art", "n": 95, "lab": "Article 95", "labso": "Qodobka 95aad", "tso": "Awoodaha iyo Waajibaadka Xeer-ilaaliyaha Guud", "ten": "Powers and Duties of the Attorney General", "so": ["1. Xeer-ilaaliyaha Guud waxa uu awood u leeyahay in uu dacwad ku oogo saraakiisha sare ee Dawladda iyo kuwa xasaanadda leh maxkamadda horteeda isaga oo u maraya shuruucda Dawladda Waqooyi Bari u taal.", "2. Waajibaadka Xeer-ilaaliyaha Guud waxaa ka mid ah:", "(b) Ilaalinta iyo ku dhaqanka shuruucda Dawladda Waqooyi Bari;", "(t) Waa hagaha iyo kormeeraha baadhitaanadda fal dambiyeedyada;", "(j) Waxa uu oogaa dacwadaha fal dembiyeedyada maxkamadaha hortooda; si waafaqsan shareecada islaamka;", "(x) Waxa uu hubiyaa in dacwad oogistu u dhacdo si waafaqsan habraacyada sharciga, xorna ah;", "(kh) Waxa uu la talin sharci siiyaa laamaha nabadgelyada iyo baadhista;", "(d) Waxa uu soo jeediyaa xeer-ilaaliyayaasha gobolladda, si ay u oggolaadaan Guddiga Adeegga Garsoorku;", "(r) Waxa uu kormeeraa xaaladaha xabsiyada iyo goobaha dhaqancelinta;", "(s) Waxa uu kaydiyaa shuruucda, go’aannada iyo heshiisyada Dawladda Waqooyi Bari qayb ka tahay;", "(sh) Waxa uu gutaa xilalka iyo waajibaadka kale ee uu siiyo sharcigu.", "(dh) Xeer gaar ah ayaa nidaam
