a, iyaga oo aan ku milmin siyaasadda."], "en": ["1. Civil servants are the employees of the State, recruited through open, fair competition based on knowledge and ability, for which the Civil Service Agency is responsible.", "2. State institutions are responsible for administering and managing their staff in accordance with the Civil Service Law.", "3. The State's civil servants carry out their duties in accordance with the Constitution and the laws, without becoming entangled in politics."], "ch": 17, "pg": 66}, {"id": "a139", "k": "art", "n": 139, "lab": "Article 139", "labso": "Qodobka 139aad", "tso": "Xuquuqda Shaqaalaha Rayidka ah", "ten": "Rights of Civil Servants", "so": ["1. Shaqadu waa xuquuq dastuuri ah oo uu leeyahay muwaaddin kasta oo awooda shaqada.", "2. Dawladdu waxa ay u xil saaran tahay horumarinta shaqo abuurka iyo tababarka shaqaalaha.", "3. Dawladdu waa in ay si joogto ah u hubisaa daryeelka shaqaalaha rayidka ah, iyada oo diiradda saaraysa caafimaadka, bedqabka iyo daryeelkooda.", "4. Waxaa reebban shaqo khasab ah marka laga reebo xaaladaha degdegga ah ee ku cad shuruucda.", "5. Shaqaale kasta waxa uu xaq u leeyahay mushahar u dhigma shaqada uu qabto iyo heerkiisa aqooneed, si waafaqsan nidaamyada iyo xeerarka shaqaalaha Dawladda.", "6. Shaqaale kasta waxa uu xaq u leeyahay nasasho toddobaadkiiba hal maalin, fasax sannadeed, fasaxyada ciidaha Islaamka, maalmaha u astaysan Qaranka Soomaaliyeed iyo Dawladda Waqooyi Bari.", "7. Haweenku waxa ay xaq u leeyihiin fasaxa dhalmada iyo naasnuujinta, iyada oo aan waxba laga dhimayn xuquuqdooda.", "8. Shaqaalaha rayidka ah waxa ay xaq u leeyihiin in ay cabashadooda ku muujiyaan si nabad ah, oo waafaqsan xeerarka iyo shuruucda Dawladda.", "9. Xeerarka shaqaalaha Rayidka ah ayaa nidaaminaya daryeelka shaqaalaha."], "en": ["1. Work is a constitutional right of every citizen able to work.", "2. The State is responsible for developing job creation and staff training.", "3. The State must continually ensure the welfare of civil servants, with a focus on their health, safety and care.", "4. Forced labour is prohibited except in the emergencies set out in law.", "5. Every worker has the right to a wage commensurate with the work they do and their level of education, in accordance with the systems and regulations for State employees.", "6. Every worker has the right to one day of rest a week, annual leave, leave for the Islamic Eids, and the days designated by the Somali nation and the North East State.", "7. Women have the right to maternity and breastfeeding leave, without any reduction in their entitlements.", "8. Civil servants have the right to express their grievances peacefully, in accordance with the regulations and laws of the State.", "9. The Civil Service regulations shall govern the welfare of staff."], "ch": 17, "pg": 66}, {"id": "a140", "k": "art", "n": 140, "lab": "Article 140", "labso": "Qodobka 140aad", "tso": "Kormeerka iyo La Xisaabtanka Shaqaalaha", "ten": "Supervision and Accountability of Staff", "so": ["1. Hay’ad kasta waxa ay u xilsaaran tahay la socodka, gudashada waajibaadka iyo la xisaabtanka shaqaalaha ka hawlgala.", "2. Nidaamka cabashada shaqaalaha iyo sida wax looga qabanayo tabashooyinka waa in uu ahaadaa mid furan oo waafaqsan Xeerka Shaqaalaha Rayidka ah."], "en": ["1. Every institution is responsible for monitoring, the performance of duties and the accountability of the staff working in it.", "2. The system for staff complaints and for addressing grievances must be open and consistent with the Civil Service Law."], "ch": 17, "pg": 67}, {"id": "a141", "k": "art", "n": 141, "lab": "Article 141", "labso": "Qodobka 141aad", "tso": "Shaqaalaha Gaarka ah", "ten": "Private-Sector Workers", "so": ["1. Shaqaalaha gaarka ah waa shaqaalaha aan u shaqayn ha’yaddaha Dawladda.", "2. Xeerka Shaqaalaha Gaarka ah ayaa nidaaminaya xuquuqda arrimaha Shaqaalaha Gaarka ah."], "en": ["1. Private-sector workers are workers who do not work for State institutions.", "2. The Private Sector Labour Law shall regulate the rights and affairs of private-sector workers."], "ch": 17, "pg": 67}, {"id": "a142", "k": "art", "n": 142, "lab": "Article 142", "labso": "Qodobka 142aad", "tso": "Ururrada Shaqaalaha", "ten": "Workers' Associations", "so": ["1. Shaqaalaha iyo loo shaqeeyuhuba waxa ay xaq u leeyihiin in ay yeeshaan ururro si sharci ah u maareeya danahooda shaqo.", "2. Xeerarka shaqaalaha ayaa nidaaminaya dhismaha, doorka iyo waajibaadka ururrada shaqaalaha."], "en": ["1. Workers and employers have the right to form associations that lawfully manage their work interests.", "2. Labour regulations shall govern the establishment, role and duties of workers' associations."], "ch": 17, "pg": 67}, {"id": "a143", "k": "art", "n": 143, "lab": "Article 143", "labso": "Qodobka 143aad", "tso": "Adeegsiga Tignoolajiyada", "ten": "Use of Technology", "so": ["Hay’adaha Dawladdu waa in ay hirgeliyaan adeegsiga tiknoolajiyada casriga ah, si loo hormariyo waxqabadka iyo saxnaanta shaqada, iyada oo la xaqiijinayo bedqabka xogta."], "en": ["State institutions must put modern technology to use to improve the performance and accuracy of their work, while ensuring data security."], "ch": 17, "pg": 67}, {"id": "a144", "k": "art", "n": 144, "lab": "Article 144", "labso": "Qodobka 144aad", "tso": "Ciidamada iyo Sugidda Amniga", "ten": "The Forces and Maintaining Security", "so": ["1. Dawladdu waxa ay dammaanad qaadaysaa sugidda amniga, nabadda, madax bannaanida, difaaca soohdimaha, xasilloonida shacabka iyo deegaannada Waqooyi Bari.", "2. Sugidda amniga waxaa u xilsaaran qaybaha kala duwan ee ciidamada.", "3. Ciidamada Dawladda Waqooyi Bari waxa ay ka booban yihiin", "(b) Ciidanka Daraawiishta;", "(t) Ciidanka Booliska;", "(j) Ciidanka Asluubta;", "(x) Ciidanka Nabad Sugidda;", "(kh) Cidanka Ilaalada Xeebaha.", "4. Ciidamada Dawladda Waqooyi Bari waxa ay u xil saaran yihiin ilaalinta amniga, madax bannaanida iyo difaaca midnimada dhuleed ee Waqooyi Bari.", "5. Ciidanka Booliska xilkiisu waa ilaalinta nolosha iyo hantida, ammaanka iyo nabadgelyada muwaaddiniinta iyo dadka kale ee deggan dhulka Waqooyi Bari.", "6. Ciidamada Dawladda Waqooyi Bari waxaa kormeeraya hay’adaha rayidka ah ee khuseeya.", "7. Xeerka Ciidamada ayaa lagu nidaaminayaa, qaab dhismeedka iyo waajibaadka ciidamada."], "en": ["1. The State guarantees security, peace, independence, the defence of borders, and the stability of the people and areas of the North East.", "2. Maintaining security is the responsibility of the various branches of the forces.", "3. The forces of the North East State consist of:", "(a) The Dervish Force;", "(b) The Police Force;", "(c) The Custodial Corps;", "(d) The Security Service;", "(e) The Coast Guard.", "4. The forces of the North East State are responsible for protecting the security and independence, and defending the territorial unity, of the North East.", "5. The duty of the Police Force is to protect the life and property, safety and security of citizens and other persons residing in the territory of the North East.", "6. The forces of the North East State are overseen by the relevant civilian institutions.", "7. The Armed Forces Law shall regulate the structure and duties of the forces."], "ch": 18, "pg": 68}, {"id": "a145", "k": "art", "n": 145, "lab": "Article 145", "labso": "Qodobka 145aad", "tso": "Mabaadi’da Ciidamada Dawladda Waqooyi Bari", "ten": "Principles of the Forces of the North East State", "so": ["1. Muwaaddin kasta oo ka mid ah shacabka Dawlada Waqooyi Bari, karti ahaan iyo caafimaad ahaanna awooda, waxa uu xaq u leeyahay in uu ka mid noqdo ciidamada iyadoo aan lagu kala soocin jinsi, qabiil, ama aragti siyaasadeed.", "2. Ciidamada Dawladda Waqooyi Bari waxa lagu dhisayaa, isla markaana ay ku dhaqmayaan mabaadi’da hoos ku cad:", "(b) Ciidan leh xirfad, karti iyo asluub;", "(t) Daacadnimo iyo waddaniyad;", "(j) Difaaca madax banaanida, midnimada iyo jiritaanka dhulka Waqooyi Bari;", "(x) Ku dhaqanka Shareecada Islaamka iyo dhaqanka suubban;", "(kh) Ilaalinta dastuurka, iyo shuruucda Dawladda Waqooyi Bari;", "(d) Ixtiraamka iyo difaaca xuquuqda aadanaha iyo xorriyaadka aasaasiga ah;", "(r) Ixtiraamka sharafta iyo karaamada muwaaddiniinta;", "(s) Ka madax bannaanida siyaasadda."], "en": ["1. Every citizen who is a member of the people of the North East State and is able in ability and health has the right to join the forces, without distinction by sex, clan or political opinion.", "2. The forces of the North East State are built on, and operate by, the principles below:", "(a) A force with professionalism, ability and discipline;", "(b) Loyalty and patriotism;", "(c) Defending the independence, unity and existence of the territory of the North East;", "(d) Practising Islamic Sharia and good culture;", "(e) Upholding the Constitution and the laws of the North East State;", "(f) Respecting and defending human rights and fundamental freedoms;", "(g) Respecting the honour and dignity of citizens;", "(h) Independence from politics."], "ch": 18, "pg": 69}, {"id": "a146", "k": "art", "n": 146, "lab": "Article 146", "labso": "Qodobka 146aad", "tso": "Xaaladaha Degdegga ah", "ten": "States of Emergency", "so": ["1. Xaalad degdeg ah waxaa la soo rogi karaa keliya marka ay lagama maarmaan u tahay wax ka qabashada xaalad ba’an oo ka dhalatay dagaal, kacdoon hubeysan, kala dambayn la’aan ama masiibo dabiici ah.", "2. Xaalad degdeg ah waxaa loogu dhawaaqi karaa guud ahaan ama qayb ahaan Dawladda Waqooyi Bari.", "3. Madaxweynuhu, marka uu helo soo jeedinta Golaha Fulinta waxa uu ku dhawaaqi karaa xaalad degdeg ah, sida ku xusan faqradaha 1 iyo 2 ee qodobkan.", "4. Golaha Wakiillada ayaa ansixinaya ama diidaya, islamarkaana muddaynaya xaaladda degdegga ah muddo toddoba (7) maalmood gudahood ah, ka dib marka lagu dhawaaqo xaaladda.", "5. Golaha Wakiilladu waxa ay xaaladaha degdegga ah ku ansixiyaan cod saddex meelood labo meelood (2/3) ah xubnaha Golaha Wakiillada.", "6. Golaha Wakiilladu waa uu kordhin karaa muddada xaaladda degdegga ah marka ay lagama maarmaan noqoto.", "7. Marka Golaha Wakiilladu diido ansixinta ama kordhinta xaaladda degdegga ah, ma jirayso xaalad degdeg ah.", "8. Xaaladda degdegga ah waa in aanay jebin xuquuqda aasaasiga ah ee Dastuuriga ah, marka laga reebo haddii ay jirto baahi sharci ah oo si cad loo qeexay.", "9. Xuquuqaha aan la xaddidi karin waxaa ka mid ah in qofku helo maxkamad cadaalad ah, in aan loo geysan jidh dil, sharaf dil, iyo xadhig sabab la’aan ah.", "10. Qofka ama hay’adda dambi lagu eedeeyo intii ay jirtay xaaladda degdegga ah darteed, waxa uu xaq u leeyahay in uu helo caddaalad maxkamadeed.", "11. Marka lagu dhawaaqo xaaladda degdegga ah, sharciga ayaa siinaya Golaha Fulinta awoodo iyo waajibaadyo loogu baahan yahay wax ka qabashada xaaladda oo keliya.", "12. Maxkamadda Sare ayaa leh awoodda qaaddida dacwada ka dhanka ah saxnaanta ku dhawaaqidda xalaadda degdegga ah."], "en": ["1. A state of emergency may be imposed only when it is necessary to deal with a grave situation arising from war, armed insurrection, breakdown of order or natural disaster.", "2. A state of emergency may be declared for the whole or part of the North East State.", "3. The President, on receiving the proposal of the Executive Council, may declare a state of emergency as set out in clauses 1 and 2 of this Article.", "4. The House of Representatives approves or rejects, and sets the duration of, the state of emergency within seven (7) days after it is declared.", "5. The House of Representatives approves states of emergency by a vote of two thirds (2/3) of its members.", "6. The House of Representatives may extend the duration of the state of emergency when it becomes necessary.", "7. When the House of Representatives refuses to approve or extend the state of emergency, there shall be no state of emergency.", "8. A state of emergency must not breach fundamental constitutional rights, unless there is a clearly defined legal need.", "9. Rights that may not be limited include the right to a fair trial, and not to be subjected to torture, degradation or arbitrary detention.", "10. A person or institution accused of an offence because of the state of emergency has the right to judicial justice.", "11. When a state of emergency is declared, the law gives the Executive Council only the powers and duties needed to deal with the situation.", "12. The Supreme Court has the power to hear cases against the validity of a declaration of a state of emergency."], "ch": 18, "pg": 69}, {"id": "a147", "k": "art", "n": 147, "lab": "Article 147", "labso": "Qodobka 147aad", "tso": "Halgankii Daraawiishta", "ten": "The Dervish Struggle", "so": ["1. Dawladdu waxa ay samaynaysa guddi madax bannaan oo u xilsaaran:", "(b) Ururrinta xogta halgankii daraawiishta;", "(t) Matxaf lagu kaydiyo, lagana dheegto taariikhdii Daraawiishta;", "(j) Diiwaangelinta gaboodfalladii iyo tacaddiyadii gumeysigu geystey xiligii gumeysiga iyo muddadii ka dambeysey."], "en": ["1. The State shall create an independent commission responsible for:", "(a) Collecting information on the Dervish struggle;", "(b) A museum to preserve and draw lessons from the history of the Dervishes;", "(c) Documenting the abuses and atrocities the colonisers committed during the colonial period and the period after it."], "ch": 19, "pg": 70}, {"id": "a148", "k": "art", "n": 148, "lab": "Article 148", "labso": "Qodobka 148aad", "tso": "Gaboodfalladii Gumaysiga", "ten": "Colonial Abuses", "so": ["1. Dawladda Waqooyi Bari waxa ay ogsoon tahay gaboodfalladii gumaystuhu u geystay shacabka Soomaaliyeed, gaar ahaan dadka deegaannada Waqooyi Bari, xiligii halgankii Daraawiishta iyo mudaddii ka dambeysey.", "2. Dowladda Waqooyi Bari waxa ay dejinaysaa siyaasado iyo sharciyo u oggolaanaya dadka Dawladda Waqooyi Bari in ay ka dalbadaan garawshiiyo iyo magdhaw gumeystihii mas’uulka ka ahaa gaboodfallada iyo tacaddiyada."], "en": ["1. The North East State recognises the abuses the colonisers committed against the Somali people, in particular the people of the areas of the North East, during the Dervish struggle and the period after it.", "2. The North East State shall set policies and laws allowing the people of the North East State to claim recognition and compensation from the coloniser responsible for the abuses and atrocities."], "ch": 19, "pg": 70}, {"id": "a149", "k": "art", "n": 149, "lab": "Article 149", "labso": "Qodobka 149aad", "tso": "Asbaabaha Wax Ka Beddelka Dastuurka", "ten": "Grounds for Amending the Constitution", "so": ["1. Sababaha wax ka beddelka Dastuurka:", "(b) Waafajinta Xaaladaha Cusub;", "(t) Sixidda khaladaad ku jira Dastuurka iyo fasiraad;", "(j) Xoojinta Xuquuqda Muwaaddiniinta;", "(x) Dib-u-habaynta Qaab dhismeedka Dawladda;", "(kh) Hagaajinta Habraaca Maamulka iyo Garsoorka;", "(d) Ka hortagga takrifalka Awoodaha;", "2. Waxaa reebban wax ka beddel kasta oo wax u dhimaya mabaadi’da aasaasiga ah ee Dawladda Waqooyi Bari, gaar ahaan:", "(b) Mabaadi’da Shareecada Islaamka;", "(t) Midnimada ummaddeed, dhuleed, iyo siyaasaddeed ee Dawladda Waqooyi Bari;", "(j) Talo wadaagga, daah furnaanta iyo hannaanka axsaabta badan;", "(x) Xuquuqda asaasiga ah iyo xorriyadaha muwaaddiniinta;", "(kh) Kala madax bannaanida hay’adaha Dawladda iyo ilaalinta caddaaladda;", "(d) Dhawrista iyo ku dhaqanka muddo xileedka Dastuuriga ah;", "(r) Qodobbada 2aad, 71aad, iyo 148aad ee Dastuurka.", "3. Qodobkan 149aad ee dhigaya wax ka bedelka Dastuurka waxba lagama bedeli karo.", "4. Sannadka ugu dambeeya ee muddo xilleedka golayaasha Dawladda, waxaa reebban wax ka beddelka Dastuurka."], "en": ["1. Grounds for amending the Constitution:", "(a) Adapting to new circumstances;", "(b) Correcting errors in the Constitution, and interpretation;", "(c) Strengthening citizens' rights;", "(d) Reforming the structure of the State;", "(e) Improving administrative and judicial procedure;", "(f) Preventing the abuse of power;", "2. Any amendment that undermines the fundamental principles of the North East State is prohibited, in particular:", "(a) The principles of Islamic Sharia;", "(b) The national, territorial and political unity of the North East State;", "(c) Consultation, transparency and the multi-party system;", "(d) The fundamental rights and freedoms of citizens;", "(e) The independence of State institutions from one another and the protection of justice;", "(f) Respecting and observing constitutional terms of office;", "(g) Articles 2, 71 and 148 of the Constitution.", "3. This Article 149, which governs amendment of the Constitution, may not be amended in any way.", "4. Amending the Constitution is prohibited in the final year of the term of office of the organs of the State."], "ch": 20, "pg": 71}, {"id": "a150", "k": "art", "n": 150, "lab": "Article 150", "labso": "Qodobka 150aad", "tso": "Habraaca Wax ka Beddelka Dastuurka", "ten": "Procedure for Amending the Constitution", "so": ["1. Hindisaha wax ka beddelka Dastuurka waxaa soo jeedinaya:", "(b) Saddex meelood hal meel (1/3) xubnaha Golaha Wakiillada;", "(t) Golaha Fulinta;", "(j) Muwaaddiniin cod bixiyayaal diiwaangashan ah, tiradooduna ka yarayn kun (1000).", "2. Wax ka beddelka Dastuurka waxaa la guda gelayaa, marka Golaha Wakiilladu ku oggolaado soo jeedinta saddex meelood labo meel (2/3) xubnaha Golaha Wakiillada.", "3. Marka Golaha Wakiilladu oggolaado wax ka beddelka Dastuurka, Madaxweynaha ayaa magacaabaya Guddiga Wax ka beddelka, waxaana ansixinaya Golaha Wakiillada.", "4. Guddiga wax ka beddelka Dastuurka oo la tashanaya bulshada, ayaa diyaarinaya qabyo qoraalka wax ka beddelka Dastuurka lixdan (60) maalmood gudahood."], "en": ["1. A proposal to amend the Constitution may be put forward by:", "(a) One third (1/3) of the members of the House of Representatives;", "(b) The Executive Council;", "(c) Registered voters numbering no fewer than one thousand (1,000).", "2. An amendment to the Constitution proceeds when the House of Representatives agrees to the proposal by two thirds (2/3) of its members.", "3. When the House of Representatives agrees to amend the Constitution, the President appoints the Amendment Committee, which is approved by the House of Representatives.", "4. The Constitutional Amendment Committee, consulting the public, prepares the draft amendment within sixty (60) days."], "ch": 20, "pg": 72}, {"id": "a151", "k": "art", "n": 151, "lab": "Article 151", "labso": "Qodobka 151aad", "tso": "Ansixinta Dastuurka", "ten": "Adoption of the Constitution", "so": ["1. Dastuurka Dawladda Waqooyi Bari Soomaaliya waxaa si rasmi ah u ansixinaya:", "(b) Saddex meelood laba meel (2/3) tirada guud ee ergada Shirweynaha Dhamaystirka Dawladda Waqooyi Bari oo ka kooban afar boqol soddon iyo laba (432) ergey.", "(t) Marka ay haboonaato Dastuurka waxaa loo bandhigayaa afti dadweyne oo baahsan si ay ugu oggolaadaan cod, Maxkamadda Sare ayaana ku dhawaaqaysa sugnaanta aftida dadweynaha.", "2. Ergada Shirweynaha ee ansixinaysa Dastuurka waxaa soo xulaya cuqaasha deegaannada Dowlad Waqooyi Bari, waxaana la raacayaa hab lagu xaqiijinayo matalaadda qaybaha bulshada.", "3. Guddiga Farsamada ee Dawladda Federaalka iyo Guddiga Diyaarinta Dastuurka oo wada shaqaynaya ayaa marka ergada Shirweynuhu u codeyso Dastuurka hubinaya guntanka (kooramka) ergada iyo saxsanaanta tirinta codadka, shir -guddoonka Shirweynaha ergada ayaana ku dhawaaqaya natiijada codbixinta ansixinta Dastuurka.", "4. Ansixinta wax ka beddelka Dastuurka waxaa loo marayaa afti baahsan ama kooban, Maxkamadda Sare ayaana ku dhawaaqaysa sugnaanta aftida dadweynaha."], "en": ["1. The Constitution of the North East State of Somalia is formally adopted by:", "(a) Two thirds (2/3) of the total delegates of the North East State Completion Conference, consisting of four hundred and thirty-two (432) delegates.", "(b) When appropriate, the Constitution shall be put to a broad public referendum for approval by vote, and the Supreme Court shall declare the validity of the referendum.", "2. The Conference delegates adopting the Constitution are selected by the traditional elders (cuqaal) of the areas of the North East State, following a method that ensures the representation of the sections of society.", "3. The Technical Committee of the Federal Government and the Constitution Drafting Committee, working together, verify the quorum of delegates and the accuracy of the vote count when the Conference delegates vote on the Constitution, and the presiding committee of the Conference announces the result of the vote adopting the Constitution.", "4. The adoption of amendments to the Constitution goes through a broad or limited referendum, and the Supreme Court declares the validity of the referendum."], "ch": 21, "pg": 72}, {"id": "a152", "k": "art", "n": 152, "lab": "Article 152", "labso": "Qodobka 152aad", "tso": "Dhaqangalka Dastuurka", "ten": "Entry into Force of the Constitution", "so": ["1. Dastuurka Dawladda Waqooyi Bari waxa uu dhaqangelayaa:", "(b) arka lagu ansixiyo sida uu dhigayo Qodobka 151aad, Faqrada 1, Xarafka (b) isla markaana Hogaamiyaha saxeexo, laguna soo saaro faafinta rasmiga ah.", "(t) Marka lagu ansixiyo sida uu dhigayo qodobka 151aad, faqrada 1, Xarafka (t) isla markaana Madaxweynaha markaas xilka haya uu saxeexo, laguna soo saaro faafinta rasmiga ah.", "2. Dastuurka Dawladda Waqooyi Bari Soomaaliya waxa uu baabi’inayaa Axdiyada iyo Dastuurrada ka horreeyey, marka laga reebo Dastuurka Jamhuuriyada Federaalka Soomaaliya.", "3. Dhammaan sharciyada iyo xeerarka Dawladda Waqooyi Bari ee hore u jiray waa in ay waafajiyo Dastuurkan."], "en": ["1. The Constitution of the North East State enters into force:", "(a) When it is adopted as provided in Article 151, Clause 1, letter (a), and signed by the Leader, and published in the Official Gazette.", "(b) When it is adopted as provided in Article 151, Clause 1, letter (b), and signed by the President then in office, and published in the Official Gazette.", "2. The Constitution of the North East State of Somalia repeals the Charters and Constitutions that preceded it, except the Constitution of the Federal Republic of Somalia.", "3. All existing laws and regulations of the North East State must be brought into line with this Constitution."], "ch": 21, "pg": 73}, {"id": "annex1", "k": "ann", "n": 1, "lab": "Annex 1", "labso": "Lifaaqa 1aad", "tso": "Calanka Dawladda Waqooyi Bari", "ten": "The Flag of the North East State", "ch": 99, "pg": 74, "so": [], "en": []}, {"id": "annex2", "k": "ann", "n": 2, "lab": "Annex 2", "labso": "Lifaaqa 2aad", "tso": "Astaanta Dawladda Waqooyi Bari", "ten": "The Emblem of the North East State", "ch": 99, "pg": 75, "so": [], "en": []}, {"id": "annex3", "k": "ann", "n": 3, "lab": "Annex 3", "labso": "Lifaaqa 3aad", "tso": "Xeerarka Hortebinta leh", "ten": "Priority Laws", "ch": 99, "pg": 76, "tbl_so": [["1", "Xeerka Adeegga Garsoorka", "Cut. 9, Qod. 85", "Kal fadhiga 1"], ["2", "Xeerka Shaqaalaha Rayidka ah", "Cut. 13, Qod. 119", "Kal fadhiga 1"], ["3", "Xeerka Xafiiska Xisaabiyaha Guud", "Cut. 13, Qod. 125", "Kal fadhiga 1"], ["4", "Xeerka Hay’adda Dakhliga", "Cut. 13, Qod. 120", "Kal fadhiga 1"], ["5", "Xeerka Xafiiska Garyaqaanka Guud", "Cut. 13, Qod. 126", "Kal fadhiga 1"], ["6", "Xeerka Xafiiska Hanti Dhawraha Guud", "Cut. 13, Qod. 123", "Kal fadhiga 1"], ["7", "Xeerka Guddiga Iibka iyo Qandaraasyada", "Cut. 12, Qod. 115", "Kal fadhiga 2"], ["8", "Xeerka Bangiga", "Cut. 13, Qod. 124", "Kal fadhiga 2"], ["9", "Xeerka Doorashada iyo Soohdimaha", "Cut. 12, Qod. 117", "Kal fadhiga 2"], ["10", "Xeerka Guud ee Maamulka Maaliyadda", "Cut. 15, Qod. 133", "Kal fadhiga 2"], ["11", "Xeerka La Dagaalanka Musuqmaasuqa", "Cut. 12, Qod. 116", "Kal fadhiga 3"], ["12", "Xeerka Shaqaalaha Gaarka ah", "Cut. 17, Qod. 141", "Kal fadhiga 3"], ["13", "Xeerka Ciidamada", "Cut. 18, Qod. 144", "Kal fadhiga 3"], ["14", "Xeerka Magaalada Ganacsiga", "Cut. 1, Qod. 9", "Kal fadhiga 3"], ["15", "Xeerka Gobollada iyo Degmooyinka", "Cut. 10, Qod. 101", "Kal fadhiga 3"], ["16", "Xeerka Magaalo Madaxda", "Cut. 1, Qod. 9", "Kal fadhiga 3"], ["17", "Xeerka La Wareegidda Hantida Gaarka ah", "Cut. 2, Qod. 25", "Kal fadhiga 4"], ["18", "Xeerka Qaxootiga iyo Magangelyodoonka", "Cut. 2, Qod. 37", "Kal fadhiga 4"], ["19", "Xeerka Dhowrista Xogta", "Cut. 2, Qod. 31", "Kal fadhiga 4"], ["20", "Xeerka Isucelinta Eedaysaneyaasha iyo Dembiileyaasha", "Cut. 2, Qod. 36", "Kal fadhiga 4"], ["21", "Xeerka Sekada", "Cut. 17, Qod. 137", "Kal fadhiga 4"], ["22", "Xeerka Dhowrista Tayada", "Cut. 13, Qod. 121", "Kal fadhiga 4"]], "tbl_en": [["1", "Judicial Service Law", "Ch. 9, Art. 85", "Session 1"], ["2", "Civil Service Law", "Ch. 13, Art. 119", "Session 1"], ["3", "Office of the Accountant General Law", "Ch. 13, Art. 125", "Session 1"], ["4", "Revenue Authority Law", "Ch. 13, Art. 120", "Session 1"], ["5", "Office of the Solicitor General Law", "Ch. 13, Art. 126", "Session 1"], ["6", "Office of the Auditor General Law", "Ch. 13, Art. 123", "Session 1"], ["7", "Procurement and Contracts Commission Law", "Ch. 12, Art. 115", "Session 2"], ["8", "Bank Law", "Ch. 13, Art. 124", "Session 2"], ["9", "Electoral and Boundaries Law", "Ch. 12, Art. 117", "Session 2"], ["10", "General Public Financial Management Law", "Ch. 15, Art. 133", "Session 2"], ["11", "Anti-Corruption Law", "Ch. 12, Art. 116", "Session 3"], ["12", "Private Sector Labour Law", "Ch. 17, Art. 141", "Session 3"], ["13", "Armed Forces Law", "Ch. 18, Art. 144", "Session 3"], ["14", "Commercial City Law", "Ch. 1, Art. 9", "Session 3"], ["15", "Regions and Districts Law", "Ch. 10, Art. 101", "Session 3"], ["16", "Capital City Law", "Ch. 1, Art. 9", "Session 3"], ["17", "Acquisition of Private Property Law", "Ch. 2, Art. 25", "Session 4"], ["18", "Refugees and Asylum Seekers Law", "Ch. 2, Art. 37", "Session 4"], ["19", "Data Protection Law", "Ch. 2, Art. 31", "Session 4"], ["20", "Extradition of Accused and Convicted Persons Law", "Ch. 2, Art. 36", "Session 4"], ["21", "Zakat Law", "Ch. 17, Art. 137", "Session 4"], ["22", "Quality Standards Law", "Ch. 13, Art. 121", "Session 4"]], "so": [], "en": []}, {"id": "annex4", "k": "ann", "n": 4, "lab": "Annex 4", "labso": "Lifaaqa 4aad", "tso": "Maaraynta Xilliga Kala Guurka", "ten": "Management of the Transition Period", "ch": 99, "pg": 77, "so": ["1. Tixraaca Axdiga Maamulka SSC-Khaatumo iyo Qaraarradda Dawladda Federaalka Soomaaliya:", "(b) Axdiga Maamulka SSC-Khaatumo Qodobka 1.9 waxa uu dhigayaa in muddo xileedka Maamulka SSC-Khaatumo yahay “ugu badnaan laba (2) sano oo ka bilaabanaysa maalinta la dhaariyo”, Qodobka 6.1 waxa uu dhigayaa in la qabto “shirweyne lagaga tashanayo masiirka iyo aayaha deegaanada SSC-Khaatumo”, “ergooyinka shirweynaha waxaa soo xulaya beelaha qaybta ka ah shirweynaha”, Qodobka 1.11 waxa uu dhigayaa “maamulka SSC-Khaatumo wuxuu soo dhawaynayaa cid kasta oo danaynaysa in ay wax ka dhisato SSC-Khaatumo”.", "(t) Dawladda Federaalka Soomaaliya: waxa ay 19-kii Oktoobar 2023 aqbashay go’aannadii dadka SSC-Khaatumo gaadheen 06 Feebaraayo 2023; sidoo kale Qodobka 7aad go’aannadii Madasha Wadatashiga Qaranka ee 7-dii May 2025, waxa uu dhigayaa “Goluhu waxa uu isla aqoonsaday in SSC-Khaatumo tahay xubin ka mid ah Dawladaha xubinta ka ah DFS, laguna soo dhamaystiro shirweynaha loo ballansan yahay…”. Sidoo kale Qodobka 8 aad waxa uu dhigayaa “In Wasaaradda Arrimaha Gudaha, Federaalka iyo Dib u Heshiisiinta iyo SSC-Khaatumo iska kaashadaan qabashada shirweynaha iyo dhamaystirka SSC-Khaatumo”.", "2. Tallaabooyinka Dhamaystirka Dawladda Waqooyi Bari", "(b) Iyadoo la raacayo sida ay tilmaamayaan qodobbada Axdiga ee kor ku xusan, iyo qaraarrada Dawladda Federaalka ee kor ku xusan, Golaha Fulinta waxa waajib ku ah muddaynta iyo qabashada shirweynaha lagu dhamaystirayo Dawladda;", "(t) Dastuurka waxaa ansixinaya ergooyinka shirweynaha dhamaystirka Dawladda Waqooyi Bari iyadoo la raacayo Qodobka 23aad ee Xeerka Dhisidda Guddida Diyaarinta Dastuurka;", "(j) Xubnaha Golaha Wakiillada waxaa soo xulaya madaxda dhaqanka beelaha wada dhistay Dawladda Waqooyi Bari;", "(x) Shuruudaha xubnaha Golaha Wakiillada waxaa la raacayaa sida uu dhigayo Qodobka 50aad ee Dastuurka Dawladda Waqooyi Bari.", "3. Kaltanka Madaxweynaha iyo Madaxweyne ku Xigeenka Ilaa laga gaadhayo doorasho qof iyo cod ah, Xilka Madaxweynaha iyo Madaxweyne ku Xigeenka waxaa ku kaltamaya deegaannada Khaatumo iyo Maakhir ee Dawladda Waqooyi Bari.", "4. Doorashada Madaxweynaha iyo Madaxweyne ku Xigeenka Xilliga Kala Guurka.", "4.1 Madaxweynaha iyo Madaxweyne ku Xigeenka Dawladda Waqooyi Bari waxa dooranaya Golaha Wakiillada.", "4.2 Ugu yaraan saddex meelood labo (2/3) xubnaha Golaha Wakiillada waa in ay fadhiyaan u codaynta doorashada Madaxweynaha iyo Madaxweyne ku Xigeenka.", "4.3 Musharaxnimada Madaxweynaha iyo Madaxweyne ku Xigeenka waa in ay waafaqsan tahay shuruudaha uu dhigayo Qodobka 70aad ee Dastuurka.", "4.4 Xubnaha Golaha Wakiillada markii ay u codeynayaan doorashada Madaxweynaha iyo Madaxweyne ku Xigeenka, xubin kasta waxa ay leeyahay hal cod.", "4.5 Murashax kasta waa in uu murashaxnimadiisa iyo barnaamijkiisa doorashada gaarsiiyaa Golaha Wakiillada.", "4.6 Codaynta doorashada Madaxweynaha iyo Madaxweyne ku Xigeenka waxaa la raacaya habraacan:", "(b) Codeynta doorashadu waa qarsoodi;", "(t) Doorashada Madaxweynaha iyo Madaxweyne ku Xigeenka way kala madax bannaan tahay (midba waxaa loo dooranayaa si gaar ah)", "(j) Xilka Madaxweynaha ama Madaxweyne ku xigeenka waxaa ku guulaysanaya musharaxa hela saddex meelood laba (2/3) xubnaha Golaha Wakiillada;", "(x) Marka murashax ku guulaysan waayo codbixinta wareega koowaad, waxaa wareega labaad u gudbaya labada (2) murashax ee ugu cod badan;", "(kh) Xilka Madaxweynaha ama Madaxweyne ku Xigeenka waxaa ku guulaysanaya musharaxa hela wareega labaad codka hal dheeriga ah (50+1) xubnaha Golaha Wakiillada.", "5. Doorashada Guddoonka Golaha Wakiillbaada Xilliga Kala Guurka. Doorashada Guddoonka Golaha Wakiillada ee xilliga kala guurka waxa la raacayaa habraac la mid ah doorashada Madaxweynaha.", "6. Fadhiyada Golaha Wakiillada Xilliga Kala Guurka Fadhiyada Golaha Wakiillada xilliga kala guurka waxa ay u qabsoomayaan sida uu dhigayo Qodobka 57aad ee Dastuurka."], "en": ["1. Reference to the Charter of the SSC-Khaatumo Administration and the resolutions of the Federal Government of Somalia:", "(a) Article 1.9 of the Charter of the SSC-Khaatumo Administration provides that the term of office of the SSC-Khaatumo Administration is \"at most two (2) years starting from the day of swearing-in\"; Article 6.1 provides for holding \"a grand conference to consult on the destiny and future of the SSC-Khaatumo areas\", with \"the conference delegates selected by the clans taking part in the conference\"; Article 1.11 provides that \"the SSC-Khaatumo administration welcomes anyone interested in building SSC-Khaatumo\".", "(b) The Federal Government of Somalia, on 19 October 2023, accepted the decisions the people of SSC-Khaatumo reached on 6 February 2023. Likewise, Article 7 of the decisions of the National Consultative Forum of 7 May 2025 provides that \"the Council agreed that SSC-Khaatumo is a member among the member states of the FGS, to be completed through the planned conference…\". Article 8 provides \"that the Ministry of Interior, Federal Affairs and Reconciliation and SSC-Khaatumo cooperate in holding the conference and completing SSC-Khaatumo\".", "2. Steps to complete the North East State", "(a) Following the provisions of the Charter and the Federal Government resolutions cited above, the Executive Council has the duty to schedule and hold the conference that will complete the State;", "(b) The Constitution is adopted by the delegates of the North East State Completion Conference, following Article 23 of the Law Establishing the Constitution Drafting Committee;", "(c) The members of the House of Representatives are selected by the traditional leaders of the clans that jointly founded the North East State;", "(d) The requirements for members of the House of Representatives follow Article 50 of the Constitution of the North East State.", "3. Rotation of the President and Vice President. Until a one-person-one-vote election is reached, the offices of President and Vice President rotate between the Khaatumo and Maakhir areas of the North East State.", "4. Election of the President and Vice President during the Transition", "4.1 The President and Vice President of the North East State are elected by the House of Representatives.", "4.2 At least two thirds (2/3) of the members of the House of Representatives must be present for the vote electing the President and Vice President.", "4.3 Candidacy for President and Vice President must meet the requirements set out in Article 70 of the Constitution.", "4.4 When members of the House of Representatives vote to elect the President and Vice President, each member has one vote.", "4.5 Every candidate must deliver their candidacy and election programme to the House of Representatives.", "4.6 Voting in the election of the President and Vice President follows this procedure:", "(a) The vote is secret;", "(b) The elections of the President and Vice President are separate (each is elected on its own);", "(c) The office of President or Vice President is won by the candidate who obtains two thirds (2/3) of the members of the House of Representatives;", "(d) When no candidate wins in the first round, the two (2) candidates with the most votes go to a second round;", "(e) The office of President or Vice President is won by the candidate who obtains, in the second round, a majority of one more than half (50+1) of the members of the House of Representatives.", "5. Election of the Speakership of the House during the Transition. The election of the Speakership of the House of Representatives during the transition follows a procedure like that for the election of the President.", "6. Sittings of the House of Representatives during the Transition. Sittings of the House of Representatives during the transition take place as set out in Article 57 of the Constitution."]}], "committees": [{"title": "Magacyada Guddiga Maamulka SSC-Khaatumo ee Diyaarinta Dastuurka", "m": [["Dr. Cabdinaasir Maxamed Barre", "Guddoomiye"], ["Xildhibaan Maxamed Maxamuud Cali", "Gudoomiye ku Xigeen"], ["Jaamac Cismaan Saleebaan", "Xoghayn"], ["Garyaqaan Kayse Siciid Cartan", "Xubin"], ["Axmed Cabdi Calishire (Keyse)", "”"], ["Dr. Axmed Jaamac Ismaaciil Mire", "”"], ["Sheekh Axmed Maxamed Saleebaan", "”"], ["Xildhibaan Cali Axmed Xali", "”"], ["Aamina Yuusuf Guhaad", "”"], ["Xildhibaan Maxamuud Cismaan Nuur (Budeeye)", "”"], ["Xamse Cabdiraxmaan Axmed", "”"], ["Zamzam Abshir Cilmi", "”"], ["Nimco Cabdi Ciise", "”"], ["Eng. Cabdiraxmaan Cismaan Ismaaciil", "”"]]}, {"title": "Magacyada Guddiga Diyaarinta Dastuurka Maakhir", "m": [["Dr. Cabdillaahi Cabdi Shabeele", "Guddoomiye"], ["Sheekh Cali Maax Siciid Aadan", "Gudoomiye ku Xigeen"], ["Cabdiraxmaan Maxamuud Maxamed", "Xoghayn"], ["Xasan Cumar Hoori", "”"], ["Axmed Siciid Cabdiraxmaan", "”"], ["Cabdiraxmaan Maxamed Ibraahim", "”"], ["Cabdiraxmaan Nadiif Xasan", "”"], ["Sheekh Axmed Maxamed Saleebaan", "”"]]}], "flag": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAEtAggDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiI   {en:"Children & family",so:"Carruurta & qoyska",ids:[27,28,29]},
  {en:"Land & resources",so:"Dhulka & khayraadka",ids:[7,24,25,132]},
  {en:"Money & budget",so:"Maaliyadda",ids:[120,123,124,125,131,133,134,135,136,137]},
  {en:"Federal relations",so:"Federaalka",ids:[1,108,109,110,111,112]},
  {en:"Security & emergencies",so:"Amniga & xaaladda degdegga",ids:[39,144,145,146]},
  {en:"Amending the Constitution",so:"Wax ka beddelka",ids:[149,150,151,152]},
  {en:"Transition",so:"Kala guurka",ids:[],ann:[4]}
];
function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r}

let lang="en", q="", topic=-1, mode="light";
try{lang=localStorage.getItem("nes-lang")||"en";mode=localStorage.getItem("nes-mode")||"light"}catch(e){}
const $=(id)=>document.getElementById(id);
const esc=(s)=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=(s)=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘`ʼ]/g,"'").replace(/[“”]/g,'"');

/* index */
const CH={};D.chapters.forEach(c=>CH[c.n]=c);
D.items.forEach(it=>{
  const parts=[it.lab,it.labso,it.tso,it.ten].concat(it.so||[],it.en||[]);
  (it.tbl_so||[]).forEach(r=>parts.push(r.join(" ")));(it.tbl_en||[]).forEach(r=>parts.push(r.join(" ")));
  it.hay=norm(parts.join(" \n "));
});

function terms(){
  const t=[];const re=/"([^"]+)"|(\S+)/g;let m;const s=norm(q.trim());
  while((m=re.exec(s)))t.push((m[1]||m[2]).trim());
  return t.filter(x=>x.length>0);
}
function matches(it,ts){
  if(topic>=0){const T=TOPICS[topic];
    if(it.k==="art"&&!T.ids.includes(it.n))return false;
    if(it.k==="ann"&&!(T.ann||[]).includes(it.n))return false;
    if(it.k==="pre")return false;}
  if(!ts.length)return true;
  const num=q.trim().match(/^(?:art(?:icle)?\.?|qodob(?:ka)?)?\s*(\d{1,3})(?:aad)?$/i);
  if(num)return it.k==="art"&&it.n===+num[1];
  return ts.every(t=>it.hay.includes(t));
}

/* rendering */
const MK=/^(\d+(?:\.\d+)*\.?|\([a-zA-Z]{1,2}\))\s*/;
function hl(html,ts){
  if(!ts.length)return html;
  const pats=ts.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/'/g,"['’]")).sort((a,b)=>b.length-a.length);
  const re=new RegExp("("+pats.join("|")+")","gi");
  return html.split(/(<[^>]+>)/).map(seg=>seg.startsWith("<")?seg:seg.replace(re,"<mark>$1</mark>")).join("");
}
function xref(html){
  return html.replace(/\b(Articles?|Qodobka|qodobka|Qodobbada|qodobbada)\s+(\d{1,3})(aad)?\b/g,(m,w,n,a)=>(+n>=1&&+n<=152)?`<a class="xref" href="#a${n}">${m}</a>`:m)
             .replace(/\bChapter\s+21\b/,m=>`<a class="xref" href="#ch20">${m}</a>`);
}
function clause(text,ts){
  const m=text.match(MK);let mark="",rest=text,cls="cl";
  if(m){mark=m[1];rest=text.slice(m[0].length);if(mark.startsWith("("))cls+=" sub";}
  else cls+=" nomark";
  const body=hl(xref(esc(rest)),ts);
  return `<div class="${cls}">${m?`<span class="m">${esc(mark)}</span>`:""}<span>${body}</span></div>`;
}
function lines(arr,ts){return arr.map(l=>clause(l,ts)).join("")}
function bodyHTML(it,ts){
  if(it.tbl_en){
    const rows=lang==="so"?it.tbl_so:it.tbl_en; const th=UI[lang==="so"?"so":"en"].th;
    let h=`<div class="tbl"><table><thead><tr>${th.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>`;
    rows.forEach((r,i)=>{const alt=lang==="both"?`<div class="so" style="color:var(--ink-3)">${hl(esc(it.tbl_so[i][1]),ts)}</div>`:"";
      const ref=r[2].replace(/(Art\.|Qod\.)\s*(\d+)/,(m,a,n)=>`<a class="xref" href="#a${n}">${m}</a>`);
      h+=`<tr><td class="n">${r[0]}</td><td>${hl(esc(r[1]),ts)}${alt}</td><td>${hl(ref,ts)}</td><td class="sess">${hl(esc(r[3]),ts)}</td></tr>`});
    return h+"</tbody></table></div>";
  }
  let h="";
  if(it.id==="annex1")h+=`<div class="symbols"><img class="flag" src="${D.flag}" alt="Flag of the North East State"></div>`;
  if(it.id==="annex2")h+=`<div class="symbols"><img class="emb" src="${D.emblem}" alt="Emblem of the North East State"></div>`;
  if(!it.so.length&&!it.en.length)return h;
  if(lang==="en")return h+`<div class="body">${lines(it.en,ts)}</div>`;
  if(lang==="so")return h+`<div class="body">${lines(it.so,ts)}</div>`;
  if(it.so.length===it.en.length){
    let g=`<div class="both"><div class="colhead">Soomaali</div><div class="colhead">English</div>`;
    it.so.forEach((s,i)=>{g+=`<div class="so">${clause(s,ts)}</div><div class="en">${clause(it.en[i],ts)}</div>`});
    return h+g+"</div>";
  }
  return h+`<div class="both"><div class="colhead">Soomaali</div><div class="colhead">English</div><div class="so body">${lines(it.so,ts)}</div><div class="en body">${lines(it.en,ts)}</div></div>`;
}
function card(it,ts){
  const L=lang==="so"?"so":"en";
  const lab=L==="so"?it.labso:it.lab;
  const t1=lang==="so"?it.tso:it.ten, t2=lang==="both"?it.tso:"";
  const pg=it.pg?`<span class="pg">${UI[L].page} ${it.pg}</span>`:"";
  const cls=it.k==="pre"?"card pre":(it.id==="annex4"?"card trans":"card");
  return `<article class="${cls}" id="${it.id}"><div class="c-head"><div><div class="lab">${lab}${pg}</div>
    <h3 class="c-title">${hl(esc(t1),ts)}${t2?`<span class="alt">${hl(esc(t2),ts)}</span>`:""}</h3></div>
    <button class="pill copy" type="button" data-copy="${it.id}">${UI[L].copy}</button></div>${bodyHTML(it,ts)}${otherHits(it,ts)}</article>`;
}
/* when reading one language and the match sits only in the other, show the matching clauses from the other one */
function otherHits(it,ts){
  if(!ts.length||lang==="both"||it.tbl_en)return "";
  const shownTxt=norm([lang==="so"?it.tso:it.ten].concat(lang==="so"?it.so:it.en).join(" "));
  if(ts.every(t=>shownTxt.includes(t)))return "";
  const other=lang==="so"?it.en:it.so, ot=lang==="so"?it.ten:it.tso;
  const hits=other.filter(l=>ts.some(t=>norm(l).includes(t)));
  if(!hits.length&&!ts.some(t=>norm(ot).includes(t)))return "";
  const head=lang==="so"?"Waxa laga helay qoraalka Ingiriisiga":"Found in the Somali text";
  return `<div class="other"><div class="eyebrow">${head}</div><div class="body">${hits.length?lines(hits,ts):`<div class="cl nomark"><span>${hl(esc(ot),ts)}</span></div>`}</div></div>`;
}
function chHead(c){
  const L=lang==="so"?"so":"en";const p=D.parts[c.part-1];
  const t1=lang==="so"?c.so:c.en, t2=lang==="both"?c.so:"";
  return `<div class="ch-head" id="ch${c.n}"><div class="eyebrow">${UI[L].part} ${c.part} · ${esc(lang==="so"?p.so:p.en)} · ${UI[L].chapter} ${c.n}</div>
    <h2 class="t">${esc(t1)}${t2?` <span class="t2">· ${esc(t2)}</span>`:""}</h2></div>`;
}
function committees(){
  const L=lang==="so"?"so":"en";
  return `<article class="card" id="committees"><div class="lab">${UI[L].committees}</div>
   <p class="note" style="margin:4px 0 0">${UI[L].committeesNote}</p><div class="people">${D.committees.map(c=>`<div><h4>${esc(c.title)}</h4><ol>${c.m.map(([n,r])=>{
     let role=r.replace(/^[”"]$/,"Xubin");const en=ROLE[role]||role;
     return `<li>${esc(n)}<span>${esc(L==="so"?role:en)}</span></li>`}).join("")}</ol></div>`).join("")}</div></article>`;
}

function render(){
  const ts=terms(), L=lang==="so"?"so":"en";
  const shown=D.items.filter(it=>matches(it,ts));
  const showSet=new Set(shown.map(i=>i.id));
  let h="",lastCh=-1;
  for(const it of shown){
    if(it.k==="art"&&it.ch!==lastCh){h+=chHead(CH[it.ch]);lastCh=it.ch}
    if(it.k==="ann"&&lastCh!==99){h+=`<div class="ch-head" id="annexes"><div class="eyebrow">${UI[L].annexes}</div></div>`;lastCh=99}
    h+=card(it,ts);
  }
  if(!ts.length&&topic<0)h+=committees();
  if(!shown.length)h=`<div class="empty">${UI[L].none}</div>`;
  $("main").innerHTML=h;
  const active=ts.length||topic>=0;
  $("status").innerHTML=active?UI[L].res(shown.length):UI[L].idle;
  $("status").classList.toggle("idle",!active);
  $("clear").hidden=!q;
  // toc dimming
  document.querySelectorAll("#toc li[data-id]").forEach(li=>li.classList.toggle("dim",active&&!showSet.has(li.dataset.id)));
  document.querySelectorAll("#toc details[data-ch]").forEach(d=>{
    const n=d.querySelectorAll("li[data-id]:not(.dim)").length;d.querySelector(".ct").textContent=n;
    if(active)d.open=n>0;
  });
}
function renderChrome(){
  const L=lang==="so"?"so":"en";const U=UI[L];
  document.documentElement.lang=L==="so"?"so":"en";
  $("eyebrow").textContent=U.eyebrow;$("h1").textContent=U.h1;$("sub").textContent=U.sub;
  $("facts").innerHTML=U.facts.map(f=>`<span class="chip">${f}</span>`).join("");
  $("q").placeholder=U.q;$("bothBtn").textContent=U.both;$("tocBtn").textContent=U.toc;
  $("mode").textContent=mode==="dark"?U.light:U.dark;
  $("note").textContent=U.note;
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("topics").innerHTML=TOPICS.map((t,i)=>`<button type="button" class="topic" data-t="${i}" aria-pressed="${i===topic}">${esc(L==="so"?t.so:t.en)}</button>`).join("");
  // toc
  let t=`<a class="solo" href="#preamble">${L==="so"?"Gogoldhig":"Preamble"}</a>`,lp=0;
  D.chapters.forEach(c=>{
    if(c.part!==lp){lp=c.part;t+=`<div class="toc-part">${U.part} ${c.part} · ${esc(L==="so"?D.parts[c.part-1].so:D.parts[c.part-1].en)}</div>`}
    const arts=D.items.filter(i=>i.k==="art"&&i.ch===c.n);
    t+=`<details data-ch="${c.n}"><summary><span>${c.n}. ${esc(L==="so"?c.so:c.en)}</span><span class="ct">${arts.length}</span></summary><ol>${
      arts.map(a=>`<li data-id="${a.id}"><a href="#${a.id}"><span class="no">${a.n}</span><span>${esc(L==="so"?a.tso:a.ten)}</span></a></li>`).join("")}</ol></details>`;
  });
  const anns=D.items.filter(i=>i.k==="ann");
  t+=`<div class="toc-part">${U.annexes}</div><details data-ch="99"><summary><span>${U.annexes}</span><span class="ct">${anns.length}</span></summary><ol>${
    anns.map(a=>`<li data-id="${a.id}"><a href="#${a.id}"><span class="no">${a.n}</span><span>${esc(L==="so"?a.tso:a.ten)}</span></a></li>`).join("")}</ol></details>`;
  $("toc").innerHTML=t;
}
function applyMode(){document.documentElement.setAttribute("data-mode",mode)}
function full(){applyMode();renderChrome();render()}

/* events */
let tmr;
$("q").addEventListener("input",e=>{q=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{render();window.scrollTo({top:0})},120)});
$("clear").addEventListener("click",()=>{q="";$("q").value="";render();$("q").focus()});
$("lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("nes-lang",lang)}catch(e){};const y=window.scrollY;full();window.scrollTo({top:y})});
$("topics").addEventListener("click",e=>{const b=e.target.closest(".topic");if(!b)return;const i=+b.dataset.t;topic=topic===i?-1:i;
  document.querySelectorAll(".topic").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.t===topic));render();window.scrollTo({top:0})});
$("mode").addEventListener("click",()=>{mode=mode==="dark"?"light":"dark";try{localStorage.setItem("nes-mode",mode)}catch(e){};applyMode();$("mode").textContent=mode==="dark"?UI[lang==="so"?"so":"en"].light:UI[lang==="so"?"so":"en"].dark});
$("tocBtn").addEventListener("click",()=>$("toc").classList.toggle("open"));
$("toc").addEventListener("click",e=>{if(e.target.closest("a")&&window.innerWidth<=900)$("toc").classList.remove("open")});
document.addEventListener("click",e=>{
  const x=e.target.closest("a.xref");
  if(x){const id=x.getAttribute("href").slice(1);if(!document.getElementById(id)){q="";topic=-1;$("q").value="";full()}}
  const c=e.target.closest("[data-copy]");if(!c)return;
  const it=D.items.find(i=>i.id===c.dataset.copy);const L=lang==="so"?"so":"en";
  const blk=(l)=>{const lab=l==="so"?it.labso:it.lab,t=l==="so"?it.tso:it.ten;
    const body=it.tbl_en?(l==="so"?it.tbl_so:it.tbl_en).map(r=>r.join("  ")).join("\n"):(l==="so"?it.so:it.en).join("\n");return lab+": "+t+"\n"+body};
  const txt=lang==="both"?blk("so")+"\n\n"+blk("en"):blk(L);
  const done=()=>{const t=$("toast");t.textContent=UI[L].copied;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)};
  try{navigator.clipboard.writeText(txt).then(done).catch(()=>{fallback(txt);done()})}catch(err){fallback(txt);done()}
});
function fallback(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus()}});

$("emblem").src=D.emblem;
full();
if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView()}
</script>
