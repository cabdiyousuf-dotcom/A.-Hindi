inaya shuruudaha, awoodaha iyo mas’uuliyadaha Xeer Ilaaliyaha Guud."], "en": ["1. The Attorney General has the power to prosecute senior State officials and those with immunity before the court, through the laws in force in the North East State.", "2. The duties of the Attorney General include:", "(a) Protecting and applying the laws of the North East State;", "(b) Directing and supervising criminal investigations;", "(c) Prosecuting criminal cases before the courts, in accordance with Islamic Sharia;", "(d) Ensuring that prosecution is conducted freely and in accordance with legal procedures;", "(e) Giving legal advice to the security and investigation services;", "(f) Proposing regional prosecutors for approval by the Judicial Service Council;", "(g) Monitoring conditions in prisons and rehabilitation centres;", "(h) Keeping the laws, decisions and agreements to which the North East State is a party;", "(i) Carrying out the other offices and duties the law assigns.", "(j) A specific law shall regulate the requirements, powers and responsibilities of the Attorney General."], "ch": 9, "pg": 43}, {"id": "a96", "k": "art", "n": 96, "lab": "Article 96", "labso": "Qodobka 96aad", "tso": "Awoodaha iyo Waajibaadka ku Xigeenka Xeer-ilaaliyaha Guud", "ten": "Powers and Duties of the Deputy Attorney General", "so": ["1. Waxa uu qabtaa mas’uuliyadaha Xeer -ilaaliyaha Guud marka uu maqan yahay ama uu si ku meelgaadh ah xilkiisa u gudan kari waayo.", "2. Waxa uu kala taliyaa Xeer-ilaaliyaha Guud arrimaha Xeer-ilaalinta.", "3. Waxa uu qabtaa shaqada uu Xeer -ilaaliyaha Guud u igmado, isaga oo gudanaya waajibaadka xafiiska Xeer-ilaaliyaha Guud."], "en": ["1. Assumes the responsibilities of the Attorney General when the Attorney General is absent or temporarily unable to perform their duties.", "2. Advises the Attorney General on prosecution matters.", "3. Carries out work the Attorney General delegates, in performing the duties of the Office of the Attorney General."], "ch": 9, "pg": 44}, {"id": "a97", "k": "art", "n": 97, "lab": "Article 97", "labso": "Qodobka 97aad", "tso": "Xil Waayidda Xeer-ilaalinta Guud", "ten": "Loss of Office of the Attorney General", "so": ["1. Xeer Ilaaliyaha Guud iyo ku Xigeenka Xeer-ilaaliyaha Guud waxa ay xilka ku waayi karaan:", "(b) Geeri ama xanuun ku yimaadda xubinta oo sababa in ay xilkeeda gudan kari waydo;", "(t) Marka xubintu lumiso shuruudihii lagu soo doortay mid ka mid ah, ugu yaraan;", "(j) Marka ay caddaato in ay xubintu ku xadgudubtay Shareecada Islaamka iyo Dastuurka Dawladda Waqooyi Bari;", "(x) Marka uu iscasilaad soo gudbiyo lagana aqbalo;", "(kh) Marka maxkamad awood u leh ku riddo xukun ciqaabeed kama dambays ah;", "(d) Marka lagu qabto isaga oo faraha kula jira fal dembiyeed;", "(r) Marka uu isu sharraxo ama qabto xil kale oo dawladeed.", "2. Xeer-ilaaliyaha Guud waxaa xilka looga qaadi karaa cod hal dheeri (50%+1) guntanka fadhiga Golaha Wakiillada marka Golaha Adeegga Garsoorku soo gudbiyo."], "en": ["1. The Attorney General and the Deputy Attorney General may lose office through:", "(a) Death, or an illness that leaves them unable to perform their duties;", "(b) When they lose at least one of the requirements on which they were selected;", "(c) When it is proven that they have violated Islamic Sharia and the Constitution of the North East State;", "(d) When they submit a resignation and it is accepted;", "(e) When a competent court passes a final criminal judgment;", "(f) When caught in the act of a crime;", "(g) When they stand for or take up another government office.", "2. The Attorney General may be removed from office by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives when the Judicial Service Council submits it."], "ch": 9, "pg": 44}, {"id": "a98", "k": "art", "n": 98, "lab": "Article 98", "labso": "Qodobka 98aad", "tso": "Habka Dacwad Qaadista", "ten": "Court Procedure", "so": ["1. Dacwad qaadistu waa mid u furan dhegeysiga dadweynaha, Marka laga reebo xaaladaha sharcigu oggol yahay in maxkamaddu go’aamiso in ay dhegaysiyadu noqdaan kuwo xidhan sababo la xidhiidha anshaxa, dhaqanka suuban, nabadgelyada deegaanka, badbaadinta markhaatiga.", "2. Go’aan maxkamadeed lama gaadhi karo haddii aan la siin dhinacyada fursado isku mid ah oo ay ku soo bandhigaan doodahooda, iskuna difaacaan.", "3. Go’aan kasta oo maxkamaddu gaadho, waa in uu waafaqsan yahay sharciga."], "en": ["1. Trials are open to the public, except in cases where the law allows the court to decide that hearings be closed for reasons of morals, good culture, local security or witness protection.", "2. No court decision may be reached unless the parties are given equal opportunities to present their arguments and defend themselves.", "3. Every decision the court reaches must be consistent with the law."], "ch": 9, "pg": 45}, {"id": "a99", "k": "art", "n": 99, "lab": "Article 99", "labso": "Qodobka 99aad", "tso": "Xeer Dhaqameedka", "ten": "Customary Law", "so": ["Dastuurku waxa uu aqoonsan yahay xeer dhaqameedka aan ka hor imaanayn Shareecada Islaamka, Dastuurka iyo xeerarka kale ee Dawladda Waqooyi Bari."], "en": ["The Constitution recognises customary law (xeer) that does not conflict with Islamic Sharia, the Constitution and the other laws of the North East State."], "ch": 9, "pg": 45}, {"id": "a100", "k": "art", "n": 100, "lab": "Article 100", "labso": "Qodobka 100aad", "tso": "Dhaarta Dastuuriga ah", "ten": "The Constitutional Oath", "so": ["1. Madaxweynaha, Madaxweyne ku Xigeenka, Guddoonka Golaha Wakiillada, xubnaha Golaha Wakiillada iyo dhammaan saraakiisha sare ee Dawladda waxaa Golaha Wakiillada hortooda ku dhaarinaya Guddoomiyaha Maxkamadda Sare.", "2. Dhaarta Dastuuriga ah ee Dawladda Waqooyi Bari waa: “Waxaan ku dhaaranayaa magaca Ilaahay, in aan dhowro Diinta Islaamka, Dastuurka iyo shuruucda kale ee dalka u yaalla; xilka la ii igmadayna u guto si daacadnimo ah, kana fogaado laaluush, eex, musuqmaasuq iyo wax isdabamarin; diinta, dalka iyo dadkana lillaahi ugu adeego”."], "en": ["1. The President, the Vice President, the Speakership and members of the House of Representatives and all senior officials of the State are sworn in before the House of Representatives by the Chief Justice of the Supreme Court.", "2. The Constitutional Oath of the North East State is: \"I swear in the name of God to uphold the religion of Islam, the Constitution and the other laws in force in the country; to carry out the duty entrusted to me honestly, and to keep away from bribery, favouritism, corruption and deceit; and to serve the religion, the country and the people for the sake of God.\""], "ch": 9, "pg": 45}, {"id": "a101", "k": "art", "n": 101, "lab": "Article 101", "labso": "Qodobka 101aad", "tso": "Hannaanka Maamulka Gobollada iyo Degmooyinka", "ten": "Administration of Regions and Districts", "so": ["1. Dawladda Waqooyi Bari waxa ay raacaysaa habka iyo mabaadi’da maamul daadejinta.", "2. Golaha Fulintu wuxuu soo jeedin karaa gobollo iyo degmooyin cusub, waxaana ansixinaya Golaha Wakiillada.", "3. Xeerka Gobollada iyo Degmooyinka ayaa nidaaminaya awoodaha maamulka gobollada, degmooyinka, derejada degmooyinka iyo soohdimahooda."], "en": ["1. The North East State follows the system and principles of decentralised administration.", "2. The Executive Council may propose new regions and districts, which are approved by the House of Representatives.", "3. The Regions and Districts Law shall regulate the administrative powers of regions and districts, the grades of districts and their boundaries."], "ch": 10, "pg": 46}, {"id": "a102", "k": "art", "n": 102, "lab": "Article 102", "labso": "Qodobka 102aad", "tso": "Guddoomiyaha Gobolka", "ten": "The Regional Governor", "so": ["1. Guddoomiyaha Gobolka waa in uu yahay;", "(b) Muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) Muslim ku dhaqma diinta Islaamka, anshax wanaagsan, maskax ahaanna fayow;", "(j) Daacad u ah mabaadi’da aasaasiga ah ee Dawladda Waqooyi Bari;", "(x) Waa in uu haystaa shahaado heerka koowaad ee jaamacadda leeyahay aqoon iyo waayo aragnimo maamul;", "(kh) Da'diisu ka yarayn 40 sano;", "(d) In aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin;", "2. Guddoomiyaha Gobolka waxaa magacaabaya Madaxwaynaha.", "3. Guddoomiyaha Gobolku waxa uu mas’uul ka yahay Maamulka Gobolka, waxa uu isku xidhaa maamulka dhexe iyo degmooyinka gobolka.", "4. Waxa uu guddoomiyaa shirarka guddiyada nabadgelyada iyo horumarinta ee gobolka.", "5. Waxa uu kormeeraa adeegyada iyo hawlgallada Dawladda iyo hay’adaha samafalka ee Gobolka uu mas’uulka ka yahay."], "en": ["1. The Regional Governor must be:", "(a) A citizen who is a member of the people of the North East State;", "(b) A Muslim who practises Islam, of good character and of sound mind;", "(c) Loyal to the fundamental principles of the North East State;", "(d) They must hold a first-level university degree and have administrative knowledge and experience;", "(e) At least 40 years old;", "(f) Not convicted of a crime by a final judgment of a competent court;", "2. The Regional Governor is appointed by the President.", "3. The Regional Governor is responsible for the administration of the region, and links the central administration with the districts of the region.", "4. The Governor chairs the meetings of the region's security and development committees.", "5. The Governor oversees the services and operations of the State and of charitable organisations in the region for which they are responsible."], "ch": 10, "pg": 46}, {"id": "a103", "k": "art", "n": 103, "lab": "Article 103", "labso": "Qodobka 103aad", "tso": "Golayaasha Deegaanka", "ten": "Local Councils", "so": ["1. Degmo kasta waxa ay yeelaneysaa Gole deegaan oo ay doorteen shacabka degmada iyo dadka kale ee sifo sharci ah ku deggan.", "2. Degmo kasta waxa ay yeelanaysaa madax bannaani dhaqaale iyo maamul waxaana maamulaya Golaha Deegaanka.", "3. Golaha Deegaanku waa u madax bannaan yahay bixinta adeegyada degmada, nidaamka canshuuraha heer degmo si waafaqsan shuruucda iyo nidaamka Dawladda.", "4. Golayaasha Deegaanka mudo xiloodkoodu waa (5) Sano.", "5. Golaha Deegaanka waa la kala diri karaa iyaga oo aan muddadooda dhammaysan, xaaladda ay ku iman karto iyo qaabka loo kala dirayo Xeerka Gobollada iyo Degmooyinka ayaa tilmaamaya.", "6. Marka ay dhacdo xaaladda ku xusan faqrada 5 ee qodobkan, Xoghayaha degmada iyo madaxda waaxyaha ama laamaha ayaa xil -gaadhsiin ah, iyagoo raacaya shuruucdoodii hore inta laga soo dooranayo gole cusub.", "7. Xeerka Gobollada iyo Degmooyinka ayaa nidaaminaya mas’uuliyadaha iyo awoodaha, Golaha Deegaanka."], "en": ["1. Every district shall have a local council elected by the people of the district and other persons lawfully residing there.", "2. Every district shall have economic and administrative autonomy and shall be governed by the Local Council.", "3. The Local Council is autonomous in providing district services and in the district tax system, in accordance with the laws and system of the State.", "4. The term of office of Local Councils is (5) years.", "5. A Local Council may be dissolved before completing its term; the circumstances in which this may happen and the manner of dissolution are set out in the Regions and Districts Law.", "6. When the situation in Clause 5 of this Article occurs, the District Secretary and the heads of departments or branches act as caretakers, following their previous rules, until a new council is elected.", "7. The Regions and Districts Law shall regulate the responsibilities and powers of the Local Council."], "ch": 10, "pg": 47}, {"id": "a104", "k": "art", "n": 104, "lab": "Article 104", "labso": "Qodobka 104aad", "tso": "Habraaca Golayaasha Deegaanka", "ten": "Procedure of Local Councils", "so": ["1. Xubnaha Golaha Deegaanka fadhigooda ugu horeeya waxa ay iska dhex dooranayaan Guddoomiye iyo Guddoomiye ku Xigeen.", "2. Guddoomiyaha Degmada waa madaxa fulinta iyo xidhiidhiyaha Golaha Deegaanka iyo Maamulka Gobolka.", "3. Guddoomiyaha Degmada waxa uu Golaha hordhigayaa soo jeedintiisa xubnaha Guddiga Joogtada ah, si looga doodo, loona ansixiyo.", "4. Xubnaha Guddiga joogtada ahi kama badan karaan saddex meelood hal meel (1/3) tirada Golaha, waxaana guddoomiye u ah Guddoomiyaha Degmada.", "5. Guddiga joogtada ah ee Degmada ayaa mas’uul ka ah meelmarinta go'aannada Golaha Deegaanka, iyo fulinta hawl maalmeedka maamulka degmada."], "en": ["1. At their first sitting, the members of the Local Council elect from among themselves a Chair and a Deputy Chair.", "2. The District Commissioner is the executive head and the link between the Local Council and the Regional Administration.", "3. The District Commissioner presents to the Council a proposal for the members of the Standing Committee, for debate and approval.", "4. The members of the Standing Committee may not exceed one third (1/3) of the number of the Council, and it is chaired by the District Commissioner.", "5. The district's Standing Committee is responsible for implementing the decisions of the Local Council and for the day-to-day administration of the district."], "ch": 10, "pg": 47}, {"id": "a105", "k": "art", "n": 105, "lab": "Article 105", "labso": "Qodobka 105aad", "tso": "Doorashada Golaha Deegaanka", "ten": "Election of the Local Council", "so": ["1. Muwaaddin kasta oo ka mid shacabka Dawladda Waqooyi Bari, Muslim ah, guta waajibaadka diiniga ah, anshax wanaagsan, xilkas ah, garaadkiisu dhan yahay, deggan Degmada, da'diisuna aanay ka yarayn shan iyo labaatan (25) sano waa loo dooran karaa Golayaasha Deegaanka.", "2. Waa in uu leeyahay ugu yaraan aqoon dugsi sare iyo waaya aragnimo aan ka yarayn saddex (3) sano oo maamulka iyo arrimaha bulshada ah.", "3. In aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin.", "4. Xeerka Doorashada iyo Soohdimaha ayaa nidaaminaya habraaca doorashadda."], "en": ["1. Every citizen who is a member of the people of the North East State, Muslim, who fulfils religious obligations, is of good character, responsible and of full capacity, resides in the district and is at least twenty-five (25) years old may be elected to the Local Councils.", "2. They must have at least a secondary school education and no less than three (3) years of experience in administration and social affairs.", "3. They must not have been convicted of a crime by a final judgment of a competent court.", "4. The Electoral and Boundaries Law shall regulate the election procedure."], "ch": 10, "pg": 48}, {"id": "a106", "k": "art", "n": 106, "lab": "Article 106", "labso": "Qodobka 106aad", "tso": "Awoodaha Golaha Deegaanka", "ten": "Powers of the Local Council", "so": ["1. Golaha Deegaanku waxa uu dejiyaa, fuliyaana qorsheyaasha horumarinta iyo adeegyada heer degmo ee ku wajahan adeegyada bulshada.", "2. Golaha Deegaanku waxa uu masuul ka yahay:", "(b) Maamulka xafiisyada wasaaradaha adeegyada bulshada ee Dawladda heer degmo;", "(t) Diyaarinta, ansixinta iyo kormeerka qorshayaasha horumarrineed iyo waxqabadka xafiisyada wasaaradaha ee heer degmo.", "(j) Dejinta miisaaniyada, khidmadaha heer degmo, waxa uuna xisaab celin u gudbiyaa xafiisyada ku haboon ee xeerku tilmaamayo.", "3. Waxa ay qorsheeyaan, maamulaan isticmaalka dhulka Degmada sida wadooyinka, adeegga bulshada iyo deegaamaynta.", "4. Xeerka Gobollada iyo Degmooyinka ayaa nidaaminaya mas’uuliyadaha, soohdimaha, wadashaqaynta hay’adaha Dawladda iyo derejada ay yeelanayaan degmooyinku."], "en": ["1. The Local Council sets and implements district-level development and service plans directed at social services.", "2. The Local Council is responsible for:", "(a) Managing the district-level offices of the State's social service ministries;", "(b) Preparing, approving and overseeing the development plans and performance of the ministries' district-level offices.", "(c) Setting the budget and district-level fees, and reporting its accounts to the appropriate offices indicated by law.", "3. Councils plan and manage the use of district land, such as roads, social services and settlement.", "4. The Regions and Districts Law shall regulate the responsibilities, boundaries, cooperation with State institutions and grade of districts."], "ch": 10, "pg": 48}, {"id": "a107", "k": "art", "n": 107, "lab": "Article 107", "labso": "Qodobka 107aad", "tso": "Awoodaha Guddoomiyaha Degmada", "ten": "Powers of the District Commissioner", "so": ["1. Guddoomiyaha Degmadu waa madaxa fulinta ee degmada, waxa uuna isku xidhaa maamulka degmada iyo Gobolka.", "2. Waxa uu meel mariyaa go’aannada iyo siyaasadaha uu dejiyo Golaha Deegaanku.", "3. Waxa uu guddoomiyaa shirarka Golaha Deegaanka, guddiga joogtada ah, guddiyada horumarinta iyo nabadgelyada ee heer degmo.", "4. Waxa uu saxeexaa xeer hoosaadyada ay ansixiyaan Golaha Deegaanka.", "5. Waxa uu soo diyaariyaa warbixino joogto ah oo ku saabsan xaaladda degmada isagoo u gudbinaya Guddoomiyaha Gobolka."], "en": ["1. The District Commissioner is the executive head of the district, and links the district administration with the Region.", "2. The Commissioner implements the decisions and policies set by the Local Council.", "3. The Commissioner chairs the meetings of the Local Council, the standing committee, and the district-level development and security committees.", "4. The Commissioner signs the by-laws approved by the Local Council.", "5. The Commissioner prepares regular reports on the situation of the district and submits them to the Regional Governor."], "ch": 10, "pg": 48}, {"id": "a108", "k": "art", "n": 108, "lab": "Article 108", "labso": "Qodobka 108aad", "tso": "Wada Shaqaynta Dawladda Federaalka", "ten": "Cooperation with the Federal Government", "so": ["1. Dawladda Waqooyi Bari waxa ay si buuxda ula shaqaynaysaa Dawladda Federaalka Soomaaliya, si loogu adeego shacabka Waqooyi Bari, si waafaqsan Dastuurka Federaalka iyo midka Dawladda Waqooyi Bari.", "2. Marka laga reebo awoodaha Dastuurku siinayo Dawladda Federaalka iyo midnimada qaranka Soomaaliyeed, Dawladda Waqooyi Bari waxa ay qaadan kartaa go’aannadeeda masiiriga ah, waxa ayna wadahadal kala gelaysaa Dawladda Federaalka ah.", "3. Wada shaqaynta Dawladda Waqooyi Bari iyo Dawladda Federaalka waxa ay ku salaysan tahay;", "(b) Xaqdhawrka masiirka dadka iyo gobollada Waqooyi Bari;", "(t) Metelaad buuxda oo Dawladda Waqooyi Bari ku leedahay Baarlamaanka Federaalka, iyo Golaha Fulinta Jamhuuriyadda Federaalka Soomaaliya, si la mid ah Dawladaha xubnaha ka ah Dawladda Federaalka;", "(j) Qaybsiga awoodda siyaasadda, difaaca, dhaqaalaha iyo khayraadka oo ku salaysan sinnaan iyo cadaalad, lana mid ah Dawladaha xubnaha ka ah Dawladda Federaalka;", "(x) Ka qaybgalka wada xaajoodyada iyo heshiisyada heer qaran iyo heer caalami ee khuseeya danaha dadka iyo dhulka Dawladda Waqooyi Bari;", "(kh) Tixgelin maangal ah oo Dawladda Federaalka Soomaaliya ay siiso wax ka qabashada duruufaha siyaasadeed, nabadgelyo, bulsho, dhaqaale, iyo horumarineed ee gaarka u ah Dawladda Waqooyi Bari."], "en": ["1. The North East State works fully with the Federal Government of Somalia to serve the people of the North East, in accordance with the Federal Constitution and that of the North East State.", "2. Apart from the powers the Constitution gives the Federal Government and the unity of the Somali nation, the North East State may take its own decisions on its destiny, and shall negotiate with the Federal Government.", "3. Cooperation between the North East State and the Federal Government is based on:", "(a) Respect for the self-determination of the people and regions of the North East;", "(b) Full representation of the North East State in the Federal Parliament and the Executive Council of the Federal Republic of Somalia, equal to the member states of the Federal Government;", "(c) Sharing of political, defence, economic and resource power on the basis of equality and justice, on a par with the member states of the Federal Government;", "(d) Participation in national and international negotiations and agreements that concern the interests of the people and territory of the North East State;", "(e) Reasonable consideration by the Federal Government of Somalia in addressing the political, security, social, economic and development conditions particular to the North East State."], "ch": 11, "pg": 49}, {"id": "a109", "k": "art", "n": 109, "lab": "Article 109", "labso": "Qodobka 109aad", "tso": "Metelaadda Golayaasha Heer Federaal", "ten": "Representation in Federal Bodies", "so": ["1. Metelaadda heer Federaal waa in ay noqoto doorasho qof iyo cod ah oo xor iyo xalaal ah;", "2. Marka doorasho qof iyo cod ah suurtagal noqon weydo, doorashadu waa in ay noqoto:", "(b) Mid caddaalad ah, daahfuran oo heshiis lagu yahay, lehna habraac u dhexeeya Dawladda Federaalka iyo Dawladda Waqooyi Bari;", "(t) Metelaad loo siman yahay, kuna salaysayn meerto kuraasta la wada leeyahay.", "3. Metelaaddu waa in ay ku salaysan tahay danta dadka iyo Dawladda Waqooyi Bari."], "en": ["1. Representation at federal level must be by a free and fair one-person-one-vote election;", "2. Where a one-person-one-vote election is not possible, the selection must be:", "(a) Fair, transparent and agreed, with a procedure agreed between the Federal Government and the North East State;", "(b) Equal representation, based on a rotation of shared seats.", "3. Representation must be based on the interests of the people and the State of the North East."], "ch": 11, "pg": 50}, {"id": "a110", "k": "art", "n": 110, "lab": "Article 110", "labso": "Qodobka 110aad", "tso": "Wada Shaqaynta iyo Iskaashiga Dawladaha Xubnaha ka ah Dawladda Federaalka", "ten": "Cooperation with Federal Member States", "so": ["1. Dawladda Waqooyi Bari waxa ay wada shaqayn iyo iskaashi la yeelanaysaa Dawladaha xubnaha ka ah Dawladda Federaalka iyo Maamul Goboleedyada.", "2. Wada shaqaynta iyo iskaashigu waa mid ku salaysan isxaqdhawr iyo danaha Dawladaha xubnaha ka ah Dawladda Federaalka iyo Maamul Goboleedyada.", "3. Golaha Fulinta ee Dawladda Waqooyi Bari ayaa awood u leh in uu la galo wadahadal iyo heshiisyo iskaashi Dawladaha xubnaha ka ah Dawladda Federaalka iyo Maamul Goboleedyada.", "4. Dawladda Waqooyi Bari lama geli karto Dawladaha xubnaha ka ah Dawladda Federaalka ama Maamul Goboleed heshiis ka hor imaanaya Dastuurka, danaha dadka Waqooyi Bari, iyo midnimada ummadda iyo qaranka Soomaaliyeed."], "en": ["1. The North East State shall work and cooperate with the member states of the Federal Government and with regional administrations.", "2. Cooperation is based on mutual respect and the interests of the member states of the Federal Government and of regional administrations.", "3. The Executive Council of the North East State has the power to enter into negotiations and cooperation agreements with the member states of the Federal Government and regional administrations.", "4. The North East State may not enter into an agreement with a federal member state or regional administration that conflicts with the Constitution, the interests of the people of the North East, or the unity of the Somali people and nation."], "ch": 11, "pg": 50}, {"id": "a111", "k": "art", "n": 111, "lab": "Article 111", "labso": "Qodobka 111aad", "tso": "Wadahadallada iyo Heshiisyada Caalamiga ah", "ten": "International Negotiations and Agreements", "so": ["1. Dawladda Waqooyi Bari waxa waajib ku ah in ay ka qayb qaadato wadahadalada caalamiga ah ee khuseeya danaha Waqooyi Bari.", "2. Heshiis kasta oo heer caalami ah oo ka hor imaanaya danaha iyo jirtaanka Dawladda Waqooyi Bari, waa waxba kama jiraan lagamana fulin karo dhulka Dawladda Waqooyi Bari."], "en": ["1. The North East State has a duty to take part in international negotiations that concern the interests of the North East.", "2. Any international agreement that conflicts with the interests and existence of the North East State is null and void and may not be implemented in the territory of the North East State."], "ch": 11, "pg": 50}, {"id": "a112", "k": "art", "n": 112, "lab": "Article 112", "labso": "Qodobka 112aad", "tso": "Qunsuliyadaha iyo Hay’adaha Caalamiga ah", "ten": "Consulates and International Organisations", "so": ["Dawladda Waqooyi Bari waxa ay soo dhoweynaysaa qunsuliyadaha, hay’adaha dawliga ah iyo deeq bixiyayaasha degeya dhulka Dawladda Waqooyi Bari, waxa ayna leeyihiin damaanadqaad nabadgelyo iyo ixtiraam xasaanadeed."], "en": ["The North East State welcomes consulates, intergovernmental organisations and donors based in the territory of the North East State, and they are guaranteed security and respect for their immunity."], "ch": 11, "pg": 51}, {"id": "a113", "k": "art", "n": 113, "lab": "Article 113", "labso": "Qodobka 113aad", "tso": "Mabaadi’da Guud ee Guddiyada Madaxa Bannaan", "ten": "General Principles of Independent Commissions", "so": ["1. Guddiyada madaxa bannaan waa ka madax bannaan yihiin Golayaasha Dawladda marka ay gudanayaan waajibaadkooda dastuuriga ah si waafaqsan sharciga.", "2. Guddi madax bannaan marka uu ku jiro gudashada waajibaadkiisa waa in ay ka muuqataa in uu ku shaqaynayo dhawrista xuquuqda Aadanaha, caddaaladda iyo daah furnaan.", "3. Miisaaniyadda Guddiyada Madaxa Bannaan waa in lagu qoondeeyo miisaaniyad sannadeedka Golaha Wakiilladu ansixiyo.", "4. Miisaaniyadda Guddiyada madaxa bannaan waxa ay ahaanaysaa madax gaar ah oo ka tirsan miisaaniyadda Dawladda Waqooyi Bari."], "en": ["1. Independent commissions are independent of the organs of the State when carrying out their constitutional duties in accordance with the law.", "2. An independent commission, in carrying out its duties, must be seen to work with respect for human rights, justice and transparency.", "3. The budget of the Independent Commissions must be allocated in the annual budget approved by the House of Representatives.", "4. The budget of the Independent Commissions shall be a separate heading within the budget of the North East State."], "ch": 12, "pg": 51}, {"id": "a114", "k": "art", "n": 114, "lab": "Article 114", "labso": "Qodobka 114aad", "tso": "Aasaaska Guddiyada Madaxa Bannaan", "ten": "Establishment of Independent Commissions", "so": ["Dawladda Waqooyi Bari waxa ay yeelanaysaa guddiyo madax bannaan oo waajibaadkooda lagu qeexayo xeerar gaar ah oo Golaha Wakiilladu ansixiyo."], "en": ["The North East State shall have independent commissions whose duties are defined by specific laws approved by the House of Representatives."], "ch": 12, "pg": 51}, {"id": "a115", "k": "art", "n": 115, "lab": "Article 115", "labso": "Qodobka 115aad", "tso": "Guddiga Iibka iyo Qandaraasyada", "ten": "The Procurement and Contracts Commission", "so": ["1. Guddiga Iibka iyo Qandaraasyada waa guddi madax bannaan oo u xilsaaran dhammaan qandaraasyada Dawladda Waqooyi Bari.", "2. Awoodaha, iyo Waajibaadka Guddiga Qandaraasyada waxaa ka mid ah:", "(b) Dejinta iyo dhaqangelinta shuruucda, siyaasadda iyo habraacyada qandaraasyada;", "(t) Kormeerka, qiimaynta iyo hubinta tayada in qandaraasyada loo fuliyo si waafaqsan shuruucda iyo heshiisyada;", "(j) Baadhista iyo go’aan ka gaadhista cabashooyinka la xidhiidha qandaraasyada iyo heshiisyada;", "(x) Tababaridda shaqaalaha dawladda ee waaxyaha iibka iyo qandaraasyada; (kh) Soo saarista warbixin sannadeed si loo kobciyo daah furnaanta.", "3. Guddiga Qandaraasyadu waxa ay ka kooban yihiin shan (5) xubnood.", "4. Muddada xil haynta guddiga waa toddoba (7) sano oo aan la cusboonaysiin karin.", "5. Xeerka Guddiga Iibka iyo Qandaraasyada ayaa nidaaminaya awoodaha iyo waajibaadka Guddiga Qandaraasyada."], "en": ["1. The Procurement and Contracts Commission is an independent commission responsible for all contracts of the North East State.", "2. The powers and duties of the Contracts Commission include:", "(a) Setting and implementing the laws, policy and procedures for contracts;", "(b) Monitoring, evaluating and quality-checking that contracts are carried out in accordance with the laws and agreements;", "(c) Investigating and deciding complaints relating to contracts and agreements;", "(d) Training government staff in procurement and contracts departments; (e) Issuing an annual report to strengthen transparency.", "3. The Contracts Commission consists of five (5) members.", "4. The commission's term of office is seven (7) years and is not renewable.", "5. The Procurement and Contracts Commission Law shall regulate the powers and duties of the Contracts Commission."], "ch": 12, "pg": 52}, {"id": "a116", "k": "art", "n": 116, "lab": "Article 116", "labso": "Qodobka 116aad", "tso": "Guddiga La Dagaallanka Musuqmaasuqa", "ten": "The Anti-Corruption Commission", "so": ["1. Guddiga La Dagaalanka Musuqmaasuqa waa guddi madax bannaan, dhexdhexaad ah, oo metela bulshada.", "2. Awoodaha iyo Waajibaadka Guddiga La dagaallanka Musuqmaasuqa waxaa ka mid ah:", "(b) Waxa ay fuliyaan, dhiirrigeliyaanna ka hortagga musuqmaasuqa.", "(t) Waxa ay xoojiyaan isla xisaabtanka iyo maamul wanaagga hay’adaha Dawladda iyo kuwa dawliga ah.", "(j) Waxa ay baadhaan falalka musuqmaasuqa, waxa ayna warbixinada la wadaagaan hay’adaha ay khusayso;", "(x) Xubnaha guddigu waa shan (5) xubnood oo ugu yaraan laba (2) ka mid ah ay dumar yihiin.", "3. Muddada xil haynta guddiga waa toddoba (7) sano oo aan la cusboonaysiin karin.", "4. Xeerka La Dagaalanka Musuqmaasuqa ayaa nidaaminaya awoodaha iyo waajibaadka Guddiga La Dagaallanka Musuqmaasuqa."], "en": ["1. The Anti-Corruption Commission is an independent, neutral commission that represents society.", "2. The powers and duties of the Anti-Corruption Commission include:", "(a) Implementing and promoting the prevention of corruption.", "(b) Strengthening accountability and good governance in State and public institutions.", "(c) Investigating acts of corruption and sharing reports with the relevant institutions;", "(d) The commission has five (5) members, at least two (2) of whom are women.", "3. The commission's term of office is seven (7) years and is not renewable.", "4. The Anti-Corruption Law shall regulate the powers and duties of the Anti-Corruption Commission."], "ch": 12, "pg": 52}, {"id": "a117", "k": "art", "n": 117, "lab": "Article 117", "labso": "Qodobka 117aad", "tso": "Guddiga Doorashooyinka iyo Soohdimaha", "ten": "The Electoral and Boundaries Commission", "so": ["1. Guddiga Doorashada iyo Soohdimaha waa hay’ad madax bannaan, u xil saaran arrimaha doorashooyinka iyo soohdimaha, dhexdhexaad ah, waxa ayna xilkeeda u gudaneysaa si waafaqsan Dastuurka, xeerarka iyo shuruucda doorashada.", "2. Guddiga Doorashada iyo Soohdimaha waxa uu ka kooban yahay sagaal (9) xubnood:", "3. Muddada xil haynta ee Guddiga Doorashada waa hal (1) muddo xileed. Mar labaadna waa loo cusboonaysiin karaa, iyadoo la raacayo habraacii lagu soo magacaabay.", "4. Go’aannada Guddiga Doorashada iyo Soohdimaha waxaa burin kara Maxkamadda Sare.", "5. Xeerka Doorashada iyo Soohdimaha ayaa nidaaminaya magacaabista, awoodaha iyo waajibaadka Guddiga Doorashada iyo Soohdimaha."], "en": ["1. The Electoral and Boundaries Commission is an independent, neutral institution responsible for elections and boundaries, and carries out its duties in accordance with the Constitution and the electoral laws and regulations.", "2. The Electoral and Boundaries Commission consists of nine (9) members:", "3. The term of office of the Electoral Commission is one (1) term. It may be renewed a second time, following the procedure by which it was appointed.", "4. Decisions of the Electoral and Boundaries Commission may be overturned by the Supreme Court.", "5. The Electoral and Boundaries Law shall regulate the appointment, powers and duties of the Electoral and Boundaries Commission."], "ch": 12, "pg": 53}, {"id": "a118", "k": "art", "n": 118, "lab": "Article 118", "labso": "Qodobka 118aad", "tso": "Magacaabista iyo Xil ka Qaadista Guddiyada Madaxa Bannaan", "ten": "Appointment and Removal of Independent Commissions", "so": ["Xeerka guddi kasta lagu dhisay ayaa lagu nidaaminayaa habraaca magacaabista iyo xil ka qaadista guddiyada madaxa bannaan marka aan Dastuurku si kale u tilmaamin."], "en": ["The law establishing each commission shall regulate the procedure for appointing and removing the members of independent commissions, unless the Constitution provides otherwise."], "ch": 12, "pg": 53}, {"id": "a119", "k": "art", "n": 119, "lab": "Article 119", "labso": "Qodobka 119aad", "tso": "Hay’adda Shaqaalaha Rayidka ah", "ten": "The Civil Service Agency", "so": ["1. Hay’adda Shaqaalaha Rayidka ah waa hay’ad madax bannaan.", "2. Awoodaha, iyo waajibaadka Hay’adda Shaqaalaha Rayidka ah waxaa ka mid ah:", "(b) Ilaalinta xuquuqda shaqaalaha rayidka ah;", "(t) Shaqaalaysiinta, hubinta habraacyada iyo soo jeedinta magacaabista shaqaalaha rayidka ah oo ku dhisan caddaalad iyo mudnaan;", "(j) Horumarinta xirfadaha iyo tababarka shaqaalaha rayidka ah;", "(x) Maamulidda, kormeeridda iyo la xisaabtanka shaqaalaha rayidka ah;", "(kh) Jaangoynta mushaharka, gunnada shaqaalaha iyo u suubbanaantooda;", "(d) Baadhida iyo wax ka qabashada cabashooyinka, iyo arrimaha anshax marinta shaqaalaha rayidka ah;", "(r) Hirgelinta Xeerka Anshaxa Shaqaalaha Rayidka ah;", "(s) Kaydka diiwaanka shaqaalaha rayidka ah.", "3. Guddiga Shaqaalaha Rayidka waxa uu ka kooban yahay shan (5) xubnood.", "4. Xeerka Shaqaalaha Rayidka ah ayaa nidaaminaya waajibaadka iyo awoodaha Hay’adda Shaqaalaha Rayidka ah."], "en": ["1. The Civil Service Agency is an independent institution.", "2. The powers and duties of the Civil Service Agency include:", "(a) Protecting the rights of civil servants;", "(b) Recruiting, checking procedures and proposing the appointment of civil servants on the basis of fairness and merit;", "(c) Developing the skills and training of civil servants;", "(d) Managing, supervising and holding civil servants accountable;", "(e) Setting the pay and benefits of staff and their welfare;", "(f) Investigating and addressing complaints and disciplinary matters of civil servants;", "(g) Implementing the Civil Service Code of Conduct;", "(h) Keeping the register of civil servants.", "3. The Civil Service Commission consists of five (5) members.", "4. The Civil Service Law shall regulate the duties and powers of the Civil Service Agency."], "ch": 13, "pg": 53}, {"id": "a120", "k": "art", "n": 120, "lab": "Article 120", "labso": "Qodobka 120aad", "tso": "Hay’adda Dakhliga", "ten": "The Revenue Authority", "so": ["1. Hay’adda Dakhliga Waqooyi Bari waa hay’ad madax bannaan, waxa ayna la shaqaysaa Wasaaradda Maaliyadda.", "2. Waajibaadka guud ee Hay’adda Dakhliga waa qiimaynta, ururinta, jaangoynta cashuuraha iyo kor joogtaynta dakhliga.", "3. Guddiga Hay’adda Dakhliga waxa uu ka kooban yahay toddoba (7) xubnood:", "(b) Guddoomiyaha Guddiga Dakhliga;", "(t) Afar (4) xubnood oo guddiga ka mid ah;", "(j) Agaasimaha Guud ee Wasaaradda Maaliyadda;", "(x) Agaasimaha Guud ee Wasaaradda Ganacsiga;", "4. Hay’adda Dakhliga waxa ay leedahay Agaasime Guud, mana aha xubin ka mid ah Guddiga.", "5. Shuruudaha laga doonayo xubnaha Guddiga Dakhliga waa:", "(b) In uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) In uu Muslim yahay, ku dhaqma Diinta Islaamka, leeyahay anshax wanaagsan, maskax ahaanna fayow yahay;", "(j) In uu daacad u yahay mabaadi’da asaasiga ah ee Dawladda Waqooyi Bari;", "(x) In aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin;", "(kh) In aan da’diisu ka yarayn soddon (30) sano;", "(d) In uu haysto shahaadada jaamacadda mid ka mid ah cilmiga xisaabaadka, ganacsiga, sharciga, cashuuraha, maamulka dawladda iyo khibrad aan ka yarayn saddex (3) sano.", "6. Xubnaha Guddiga Dakhliga ee ku xusan Faqrada 3, Xarfaha (b) iyo (t) waxa magacaabaya Madaxweynaha, waxaana cod hal dheeri ah (50%+1) ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "7. Xil ka qaadista Xubnaha Guddiga Dakhliga ee ku xusan Faqrada 3, Xarfaha (b) iyo (t) waxaa soo jeedinaya Madaxweynaha, waxaana cod hal dheeri (50%+1) ah ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "8. Xeerka Hay’adda Dakhliga ayaa nidaaminaya awoodaha, waajibaadka iyo qaab maamuleedka Hay’adda Dakhliga."], "en": ["1. The Revenue Authority of the North East is an independent institution and works with the Ministry of Finance.", "2. The general duties of the Revenue Authority are assessing, collecting and setting taxes and overseeing revenue.", "3. The Board of the Revenue Authority consists of seven (7) members:", "(a) The Chair of the Revenue Board;", "(b) Four (4) members of the board;", "(c) The Director General of the Ministry of Finance;", "(d) The Director General of the Ministry of Commerce;", "4. The Revenue Authority has a Director General, who is not a member of the Board.", "5. The requirements for members of the Revenue Board are:", "(a) Being a citizen who is a member of the people of the North East State;", "(b) Being a Muslim who practises Islam, of good character and of sound mind;", "(c) Being loyal to the fundamental principles of the North East State;", "(d) Not having been convicted of a crime by a final judgment of a competent court;", "(e) Being at least thirty (30) years old;", "(f) Holding a university degree in accounting, business, law, taxation or public administration, with no less than three (3) years of experience.", "6. The members of the Revenue Board in Clause 3, letters (a) and (b) are appointed by the President and approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "7. The removal of the members of the Revenue Board in Clause 3, letters (a) and (b) is proposed by the President and approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "8. The Revenue Authority Law shall regulate the powers, duties and administrative structure of the Revenue Authority."], "ch": 13, "pg": 54}, {"id": "a121", "k": "art", "n": 121, "lab": "Article 121", "labso": "Qodobka 121aad", "tso": "Hay’adda Dhawrista Tayada", "ten": "The Quality Standards Authority", "so": ["1. Hay’adda Dhawrista Tayada waa hay’ad madax bannaan, waxa ayna siyaasad ahaan hoos imanaysaa Wasaaradda Ganacsiga.", "2. Guddoomiyaha Hay’adda Dhawrista Tayada waxaa magacaabaya Madaxweynaha, ka dib marka u helo soo jeedinta Wasiirka Ganacsiga, waxaana cod hal dheeri ah (50%+1) ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "3. Waajibaadka guud ee Hay’adda Dhawrista Tayada waa: hirgelinta halbeegyada tayada; ilaalinta badbaadada iyo caafimaadka; kobcinta dhoofinta iyo wax soo saar tayo leh; hirgelinta shaybaarka Dawladda; kormeerka, hubinta iyo baadhista tayada badeecadaha sida cuntada, bacaha, biyaha, daawada, iyo daawo-u-ekaha.", "4. Xeerka gaar ah ayaa nidaaminaya awoodaha, waajibaadka iyo qaab maamuleedka Hay’adda Dhawrista Tayada."], "en": ["1. The Quality Standards Authority is an independent institution and comes, for policy purposes, under the Ministry of Commerce.", "2. The Chair of the Quality Standards Authority is appointed by the President after receiving the proposal of the Minister of Commerce, and approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "3. The general duties of the Quality Standards Authority are: implementing quality standards; protecting safety and health; promoting exports and quality production; running the State laboratory; and monitoring, checking and testing the quality of goods such as food, packaging, water, medicines and medicine-like products.", "4. A specific law shall regulate the powers, duties and administrative structure of the Quality Standards Authority."], "ch": 13, "pg": 55}, {"id": "a122", "k": "art", "n": 122, "lab": "Article 122", "labso": "Qodobka 122aad", "tso": "Hay’adda Culimada", "ten": "The Council of Islamic Scholars", "so": ["1. Hay’adda Culimadu waa hay’ad madax bannaan, waxa ayna ka kooban tahay toddoba (7) xubnood oo kala ah:", "(b) Guddoomiye;", "(t) Guddoomiye ku Xigeen;", "(j) Xoghayn;", "(x) Iyo afar (4) xubnood.", "2. Shuruudaha xubnaha Hay’adda Culimada:", "(b) Waa in uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) Waa in aanay da’diisu ka yaraan afartan sano (40);", "(j) Waa in uu yahay Muslim sunni ah, ku dhaqma Diinta Islaamka, leeyahay anshax wanaagsan, maskax ahaan fayow, laguna yaqaan Alle ka cabsi;", "(x) Waa in aanay hore maxkamad awood u lihi ugu xukumin xukun kama dambays ah oo ka dhashay fal dembiyeed;", "(kh) Waa in uu leeyahay ugu yaraan aqoon heerka labaad ee jaamacadda amaba wax u dhigma oo dhinaca Diinta ah;", "(d) Waa in aanu ka mid noqon xisbi siyaasadeed, qabanna xil dawladeed oo kale, inta uu xubinta ka yahay Hay’adda;", "(r) Waa in uu ku sifoobo caddaalad.", "3. Xubnaha Hay’adda Culimadu waxa ay iska dhex dooranayaan Guddoomiye iyo Guddoomiye ku Xigeen.", "4. Waajibaadka iyo awoodaha Hay’adda Culimada:", "(b) Waxa ay Dawladda kala taliyaan arrimaha khuseeya Shareecada Islaamka, gaar ahaan fasiraadda iyo iswaafajinta Shareecada lslaamka iyo Xeerarka Dawladda Waqooyi Bari Soomaaliya.", "(t) Waxa ay ka tala bixiyaan magacaabista garsoorayaasha Shareecada lslaamka marka ay weydiistaan Golaha Adeegga Garsoorka;", "(j) Waxa ay caddayn waafaqsan Shareecada Islaamka ka bixiyaan mas’alooyinka iyo khilaafka arrimaha diiniga ah;", "(kh) Waxa ay cilmi baadhis ku sameeyaan masaa’ilka cusub si ay u waafajiyaan Shareecada Islaamka;", "(d) Waxa ay ka tala bixiyaan manhajyada waxbarashada iyo kutubta laga turjumo ama laga qoro diinta Islaamka;", "(r) Waxa ay tababar iyo wacyigelin ka siiyaan laamaha dawladda aqoonta diiniga ah ee khusaysa masuuliyaddooda;", "5. Magacaabista xubnaha Hay’adda Culimada waxaa soo jeedinaya Wasiirka Caddaaladda, waxaana magacaabaya Madaxweynaha, waxaana cod hal dheeri ah (50+1) ku ansixinaya guntanka xubnaha Golaha Wakiillada.", "6. Xeerka gaar ah ayaa nidaaminaya awoodaha, waajibaadka iyo qaab maamuleedka Hay’adda Culimada."], "en": ["1. The Council of Islamic Scholars is an independent institution and consists of seven (7) members:", "(a) A Chair;", "(b) A Deputy Chair;", "(c) A Secretary;", "(d) And four (4) members.", "2. Requirements for members of the Council of Islamic Scholars:", "(a) They must be a citizen who is a member of the people of the North East State;", "(b) They must be at least forty (40) years old;", "(c) They must be a Sunni Muslim who practises Islam, of good character, of sound mind and known for fear of God;", "(d) They must not previously have been convicted by a competent court in a final judgment arising from a criminal act;", "(e) They must have at least a second-level university education, or its equivalent, in religious studies;", "(f) They must not belong to a political party or hold another government office while a member of the Council;", "(g) They must be characterised by fairness.", "3. The members of the Council of Islamic Scholars elect from among themselves a Chair and a Deputy Chair.", "4. Duties and powers of the Council of Islamic Scholars:", "(a) They advise the State on matters concerning Islamic Sharia, in particular the interpretation and harmonisation of Islamic Sharia with the laws of the North East State of Somalia.", "(b) They advise on the appointment of Islamic Sharia judges when the Judicial Service Council requests it;", "(c) They give rulings consistent with Islamic Sharia on questions and disputes in religious matters;", "(e) They carry out research on new questions in order to align them with Islamic Sharia;", "(f) They advise on education curricula and on books translated or written about Islam;", "(g) They give training and awareness to State departments on religious knowledge relevant to their responsibilities;", "5. The appointment of members of the Council of Islamic Scholars is proposed by the Minister of Justice, made by the President, and approved by a vote of one more than half (50+1) of the quorum of the members of the House of Representatives.", "6. A specific law shall regulate the powers, duties and administrative structure of the Council of Islamic Scholars."], "ch": 13, "pg": 55}, {"id": "a123", "k": "art", "n": 123, "lab": "Article 123", "labso": "Qodobka 123aad", "tso": "Hanti Dhawraha Guud", "ten": "The Auditor General", "so": ["1. Xafiiska Hanti Dhawraha Guud waa madax bannaan yahay, waxa uuna leeyahay xasaanad inta uu xilkiisa gudanayo.", "2. Xafiiska Hanti Dhawraha Guud xaruntiisu waa caasimadda Dawladda Waqooyi Bari,", "3. Shuruudaha laga rabo Hanti Dhawraha Guud waa:", "(b) In uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) In uu Muslim yahay, ku dhaqma Diinta Islaamka, leeyahay anshax wanaagsan, maskax ahaanna fayow yahay;", "(j) In uu daacad u yahay mabaadi’da aasaasiga ah ee Dawladda Waqooyi Bari;", "(x) In aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin;", "(kh) In aan da’diisu ka yarayn afartan (40) sano;", "(d) In uu haysto shahaadada heerka labaad ee jaamacadda cilmiga xisaabaadka iyo aqoon xirfadeed oo hanti dhawrka ah iyo khibrad aan ka yarayn shan (5) sano.", "4. Magacaabista Hanti Dhawraha Guud waxaa soo jeedinaysa Hay’adda Shaqaalaha Rayidka, ka dib Madaxweynaha ayaa magacaabaya, waxaana cod hal dheeri ah (50%+1) ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "5. Hanti Dhawraha Guud waxa xilka looga qaadi karaa marka ay jirto sabab cad, sharci ah.", "6. Xil ka qaadista Hanti Dhawraha Guud waxaa soo jeedinaya Madaxweynaha, waxaana cod hal dheeri (50%+1) ah ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "7. Hawl wadeennada kale ee xafiiska Hanti Dhawrka waa in lagu soo xulaa si caddaalad ah oo daah furan ayna kormeeraan xulistooda Guddiga Adeegga Shaqaalaha Rayidka ah.", "8. Waajibaadka Xafiiska Hanti Dhawraha Guud waxaa ka mid ah:", "(b) Waxa uu hubiyaa sax ahaanshaha xisaabta maaliyadda;", "(t) Waxa uu kormeer iyo dabagal ku sameeyaa dhammaan hay’adaha Dawladda; mashaariicda iyo shirkadaha gacanta ku haya hantida dawladda;", "(j) Waxa uu diiwaangeliyaa dhammaan sharciyada, heshiisyada, hantida guurtada iyo maguurtada, kala wareejinta miisaaniyadda, deeqaha iyo dhacdo kasta oo dhaqaale;", "(x) Waxa uu baadhaa hufnaanta dakhliga iyo kharashyada;", "9. Xeerka Hanti Dhawraha Guud ayaa nidaaminaya awoodaha, waajibaadka iyo qaab maamuleedka Xafiiska Hanti Dhawka Guud."], "en": ["1. The Office of the Auditor General is independent and has immunity while performing its duties.", "2. The seat of the Office of the Auditor General is the capital of the North East State.", "3. The requirements for the Auditor General are:", "(a) Being a citizen who is a member of the people of the North East State;", "(b) Being a Muslim who practises Islam, of good character and of sound mind;", "(c) Being loyal to the fundamental principles of the North East State;", "(d) Not having been convicted of a crime by a final judgment of a competent court;", "(e) Being at least forty (40) years old;", "(f) Holding a second-level (master's) university degree in accounting, professional auditing knowledge and no less than five (5) years of experience.", "4. The appointment of the Auditor General is proposed by the Civil Service Agency; the President then appoints, and it is approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "5. The Auditor General may be removed from office where there is a clear legal reason.", "6. The removal of the Auditor General is proposed by the President and approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "7. The other staff of the Audit Office must be selected fairly and transparently, with their selection overseen by the Civil Service Commission.", "8. The duties of the Office of the Auditor General include:", "(a) Verifying the accuracy of the financial accounts;", "(b) Inspecting and monitoring all State institutions, and the projects and companies that hold State property;", "(c) Registering all laws, agreements, movable and immovable property, budget transfers, grants and every economic event;", "(d) Examining the integrity of revenue and expenditure;", "9. The Auditor General Law shall regulate the powers, duties and administrative structure of the Office of the Auditor General."], "ch": 13, "pg": 56}, {"id": "a124", "k": "art", "n": 124, "lab": "Article 124", "labso": "Qodobka 124aad", "tso": "Bangiga Dawladda Waqooyi Bari", "ten": "The Bank of the North East State", "so": ["1. Bangiga Dawladda Waqooyi Bari waa hay’ad madax bannaan, waxa uuna mas’uul ka yahay:", "(b) Khasnadda Dhexe ee Midaysan ee Dawladda Waqooyi Bari;", "(t) Waxa uu kormeeraa bangiyada kale ee Dawladda iyo kuwa gaarka loo leeyahay iyo hay’adaha maaliyadeed ee ka hawlgala Dawladda Waqooyi Bari;", "(j) Maamulka iyo dhiirrigelinta nidaam lacageed, maaliyadeed oo xasilloon, la iskuna halayn karo;", "(x) Taageerada siyaasadda dhaqaale ee Dawladda, ee ku wajahan horumarinta arrimaha dhaqaalaha iyo maaliyadda;", "2. Dakhliga soo gala Dawladda waa in lagu shubaa xisaab khaas ah oo ka furan Bangiga Dawladda, kana mid ah Khasnadda Dhexe ee Midaysan.", "3. Agaasinka Bangigga Dawladda Waqooyi Bari waa guddi toddoba (7) xubnood ka kooban.", "4. Guddiga Bangiga waxaa magacaabistiisa xeer Madaxweyne ku soo saaraya Madaxweynaha.", "5. Shuruudaha laga rabo Guddoomiyaha Bangiga, waa:", "(b) In uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) In uu Muslim yahay, ku dhaqma Diinta Islaamka, leeyahay anshax wanaagsan, maskax ahaanna fayow yahay;", "(j) In uu daacad u yahay mabaadi’da aasaasiga ah ee Dawladda Waqooyi Bari;", "(x) In aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin;", "(kh) In aan da’diisu ka yarayn afartan (40) sano;", "(d) In uu haysto shahaadada heerka labaad ee jaamacadda cilmiga xisaabaadka iyo aqoon xirfadeed oo bangiyada ah iyo khibrad aan ka yarayn shan (5) sano.", "6. Hay’adda Shaqaalaha Rayidka ah ayaa soo jeedinaysa, ka dib Madaxweynaha ayaa magacaabaya Guddoomiyaha Bangiga, waxaana cod hal dheeri ah (50%+1) ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "7. Xil ka qaadista Guddoomiyaha Bangiga waxaa soo jeedinaya Madaxweynaha waxaana cod hal dheeri (50%+1) ah ku ansixinaya xubnaha Golaha Wakiillada.", "8. Waxaa ka reebban deegaannadda Dawladda Waqooyi Bari in laga furo bangiyo iyo hay’ado maaliyadeed oo ku shaqeeya nidaamka ribada.", "9. Guddoomiyaha Bangigu waxa uu leeyahay xasaanad muddada uu xilka hayo.", "10. Xeerka Bangiga ayaa nidaaminaya awoodaha, waajibaadka iyo qaab maamuleedka Bangigga Dawladda Waqooyi Bari."], "en": ["1. The Bank of the North East State is an independent institution, and is responsible for:", "(a) The Single Treasury Account of the North East State;", "(b) Supervising the other State and private banks and financial institutions operating in the North East State;", "(c) Managing and promoting a stable and reliable monetary and financial system;", "(d) Supporting the State's economic policy aimed at developing economic and financial affairs;", "2. Revenue coming to the State must be deposited in a special account opened at the State Bank, forming part of the Single Treasury Account.", "3. The directorate of the Bank of the North East State is a board of seven (7) members.", "4. The appointment of the Bank Board is made by Presidential decree issued by the President.", "5. The requirements for the Governor of the Bank are:", "(a) Being a citizen who is a member of the people of the North East State;", "(b) Being a Muslim who practises Islam, of good character and of sound mind;", "(c) Being loyal to the fundamental principles of the North East State;", "(d) Not having been convicted of a crime by a final judgment of a competent court;", "(e) Being at least forty (40) years old;", "(f) Holding a second-level (master's) university degree in accounting, professional banking knowledge and no less than five (5) years of experience.", "6. The Civil Service Agency proposes, and the President then appoints, the Governor of the Bank, approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "7. The removal of the Governor of the Bank is proposed by the President and approved by a vote of one more than half (50%+1) of the members of the House of Representatives.", "8. Opening banks and financial institutions that operate on an interest-based (riba) system is prohibited in the territory of the North East State.", "9. The Governor of the Bank has immunity for the period of office.", "10. The Bank Law shall regulate the powers, duties and administrative structure of the Bank of the North East State."], "ch": 13, "pg": 57}, {"id": "a125", "k": "art", "n": 125, "lab": "Article 125", "labso": "Qodobka 125aad", "tso": "Xisaabiyaha Guud", "ten": "The Accountant General", "so": ["1. Xafiiska Xisaabiyaha Guud waa madax bannaan yahay, waajibaadkiisana waxaa ka mid ah:", "(b) Dhaqangelinta miisaaniyadda isagoo si dhow ula shaqaynaya Wasaaradda Maaliyadda;", "(t) Ilaalinta xisaabaadka hay’adaha Dawladda;", "2. Shuruudaha laga doonayo in uu buuxiyo Xisaabiyaha Guud waa:", "(b) In uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) In uu Muslim yahay, ku dhaqma Diinta Islaamka, leeyahay anshax wanaagsan, maskax ahaanna fayow yahay;", "(j) In uu daacad u yahay mabaadi’da asaasiga ah ee Dawladda Waqooyi Bari;", "(x) In aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin;", "(kh) In aan da’diisu ka yarayn afartan (40) sano;", "(d) In uu haysto shahaadada heerka labaad ee jaamacadda cilmiga xisaabaadka iyo aqoon xirfadeed oo xisaabaadka ah iyo khibrad aan ka yarayn shan (5) sano.", "3. Magacaabista Xisaabiyaha Guud waxaa soo jeedinaysa Hay’adda Shaqaalaha Rayidka, ka dib Madaxweynaha ayaa magacaabaya, waxaana cod hal dheeri ah (50%+1) ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "4. Xil ka qaadista Xisaabiyaha Guud Waxaa soo jeedinaya Madaxweynaha, waxaana cod hal dheeri (50%+1) ah ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "5. Hawl wadeennada kale ee xafiiska Xisaabiyaha Guud waa in lagu soo xulaa si caddaalad ah oo daah furan ayna kormeeraan xulistooda Guddiga Shaqaalaha Rayidka ah.", "6. Awoodaha Xafiiska Xisaabiyaha Guud waxaa ka mid ah:", "(b) Waxa uu warbixin u gudbiyaa Wasaaradda Maaliyadda;", "(t) Waxa uu ansixinayaa dhammaan kharashyada hay’adaha Dawladda ee ka baxa Khasnadda Dhexe ee Midaysan, waxaana la saxeexa Agaasimaha Guud ee Wasaaradda Maaliyadda;", "(j) Waxa uu kormeeraa xafiisyada xisaabiyayaasha heerarka kala duwan ee Dawladda, isaga oo hubinaya hannaanka qabashada dakhliga iyo bixinta kharashyada;", "(x) Waxa uu ilaaliyaa joogtaynta, diiwaangelinta, iyo warbixinadda ballanqaadyada miisaaniyadda hay’adaha Dawladda iyo fulintooda;", "(kh) Waxa uu ka qayb qaataa dejinta iyo wax ka beddelka miisaaniyadda;", "(d) Waxa uu si dhow ula shaqeeyaa Wasaaradda Maaliyadda si loo fududeeyo socodsiinta hawlaha maaliyadda.", "(r) Waxa uu diyaariyaa warbixin xilliyeedka maaliyadda iyo miisaaniyadda, una gudbiyaa Wasiirka Maaliyadda.", "7. Xisaabiyaha Guud waxa uu leeyahay xasaanad muddada uu xilka hayo.", "8. Xeerka Xafiiska Xisaabiyaha Guud ayaa nidaaminaya awoodaha, waajibaadka iyo qaab maamuleedka Xafiiska Xisaabiyaha Guud."], "en": ["1. The Office of the Accountant General is independent, and its duties include:", "(a) Implementing the budget, working closely with the Ministry of Finance;", "(b) Keeping the accounts of State institutions;", "2. The requirements the Accountant General must meet are:", "(a) Being a citizen who is a member of the people of the North East State;", "(b) Being a Muslim who practises Islam, of good character and of sound mind;", "(c) Being loyal to the fundamental principles of the North East State;", "(d) Not having been convicted of a crime by a final judgment of a competent court;", "(e) Being at least forty (40) years old;", "(f) Holding a second-level (master's) university degree in accounting, professional accounting knowledge and no less than five (5) years of experience.", "3. The appointment of the Accountant General is proposed by the Civil Service Agency; the President then appoints, and it is approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "4. The removal of the Accountant General is proposed by the President and approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "5. The other staff of the Office of the Accountant General must be selected fairly and transparently, with their selection overseen by the Civil Service Commission.", "6. The powers of the Office of the Accountant General include:", "(a) Reporting to the Ministry of Finance;", "(b) Approving all expenditure of State institutions drawn from the Single Treasury Account, co-signing with the Director General of the Ministry of Finance;", "(c) Supervising the accounting offices at the various levels of the State, checking the process of receiving revenue and making payments;", "(d) Maintaining the continuity, recording and reporting of the budget commitments of State institutions and their implementation;", "(e) Taking part in setting and amending the budget;", "(f) Working closely with the Ministry of Finance to ease the running of financial operations.", "(g) Preparing periodic financial and budget reports and submitting them to the Minister of Finance.", "7. The Accountant General has immunity for the period of office.", "8. The Accountant General Law shall regulate the powers, duties and administrative structure of the Office of the Accountant General."], "ch": 13, "pg": 58}, {"id": "a126", "k": "art", "n": 126, "lab": "Article 126", "labso": "Qodobka 126aad", "tso": "Garyaqaanka Guud", "ten": "The Solicitor General", "so": ["1. Xafiiska Garyaqaanka Guud waa madax bannaan yahay.", "2. Hay’adda Shaqaalaha Rayidka ah ayaa soo jeedinaysa, ka dib Madaxweynaha ayaa magacaabaya Garyaqaanka Guud, waxaana cod hal dheeri ah (50%+1) ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "3. Shuruudaha laga doonayo in uu buuxiyo Garyaqaanka Guud waa:", "(b) In uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari;", "(t) In uu Muslim yahay, ku dhaqma Diinta Islaamka, leeyahay anshax wanaagsan, maskax ahaanna fayow yahay;", "(j) In uu daacad u yahay mabaadi’da aasaasiga ah ee Dawladda Waqooyi Bari;", "(x) In aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin;", "(kh) In aan da’diisu ka yarayn soddon (30) sano;", "(d) In uu haysto shahaado jaamacadda heerka labaad oo shareecada iyo qaanuunka ah, lana aqoonsan yahay, iyo waayo aragnimo aan ka yarayn shan (5) sano;", "4. Garyaqaanka Guud waxa xilka ka qaadi kara Madaxweynaha marka ay jirto sabab cad oo sharci ah.", "5. Awoodaha iyo waajibaadka Xafiiska Garyaqaanka Guud waxaa ka mid ah:", "(b) Waa la taliyaha sharci ee Dawladda, waxa uuna bixiyaa fasiraad sharciyeed oo rasmi ah marka loo baahdo;", "(t) Diyaarinta ama ka talo bixinta hindise sharciyeedyada, iyo ka jawaabidda wixii su’aalo ah ay ka qabaan Golaha Fulinta marka la horgeeyo si ay uga doodaan, kaddibna ansixiyaan, inta aan loo gudbin Golaha Wakiillada si loo meelmariyo;", "(j) Waxa uu leeyahay awood wakiilnimo, isaga oo metelaya Dawladda marka ay hortegayso maxkaddaha gudaha ama caalamiga ah;", "(x) Waxa uu hubiyaa in dhammaan xeerarka, wareegtooyinka iyo heshiisyadu ay waafaqsan yihiin dastuurka iyo shuruucda;", "(kh) Waxa uu hubiyaa in wax qadabka Hay’adaha Dawladdu waafaqsan yahay sharciga;", "(d) Xafiiska Garyaqaanka Guud waxa uu dhexdhexaadin ka sameeyaa khilaaf kasta oo qaanuuneed oo ka dhex dhasha xubnaha ama hay’adaha Dawladda;", "(r) Soo saaridda faafinta rasmiga ah ee Dawladda.", "(s) Garyaqaanka Guud waxa uu leeyahay xasaanad.", "6. Garyaqaanka Guud waxa uu leeyahay xasaanad.", "7. Xeerka Xafiiska Garyaqaanka Guud ayaa nidaaminaya awoodaha, waajibaadka iyo qaab maamuleedka Xafiiska Garyaqaanka Guud."], "en": ["1. The Office of the Solicitor General is independent.", "2. The Civil Service Agency proposes, and the President then appoints, the Solicitor General, approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives.", "3. The requirements the Solicitor General must meet are:", "(a) Being a citizen who is a member of the people of the North East State;", "(b) Being a Muslim who practises Islam, of good character and of sound mind;", "(c) Being loyal to the fundamental principles of the North East State;", "(d) Not having been convicted of a crime by a final judgment of a competent court;", "(e) Being at least thirty (30) years old;", "(f) Holding a recognised second-level (master's) university degree in Sharia and law, and no less than five (5) years of experience;", "4. The Solicitor General may be removed from office by the President where there is a clear legal reason.", "5. The powers and duties of the Office of the Solicitor General include:", "(a) Being the legal adviser of the State, and giving official legal interpretations when needed;", "(b) Preparing or advising on bills, and answering any questions the Executive Council has when a bill is put before it for debate and approval, before it is sent to the House of Representatives for passage;", "(c) Having the power of representation, representing the State when it appears before domestic or international courts;", "(d) Ensuring that all regulations, circulars and agreements are consistent with the Constitution and the laws;", "(e) Ensuring that the work of State institutions is consistent with the law;", "(f) The Office of the Solicitor General mediates in any legal dispute arising between members or institutions of the State;", "(g) Issuing the State's Official Gazette.", "(h) The Solicitor General has immunity.", "6. The Solicitor General has immunity.", "7. The Solicitor General Law shall regulate the powers, duties and administrative structure of the Office of the Solicitor General."], "ch": 13, "pg": 59}, {"id": "a127", "k": "art", "n": 127, "lab": "Article 127", "labso": "Qodobka 127aad", "tso": "Difaacaha Xuquuqda Aadanaha", "ten": "The Human Rights Defender", "so": ["1. Xafiiska difaacaha xuquuqda aadanaha waa madax bannaan yahay.", "2. Xafiiska Difaacaha xuquuqda aadanuhu waxa uu ka hawl galaa dhammaan deegaanada Dawladda Waqooyi Bari.", "3. Difaacaha Xuquuqda Aadanaha waxa uu leeyahay xasaanad muddo xileedkiisa."], "en": ["1. The Office of the Human Rights Defender is independent.", "2. The Office of the Human Rights Defender operates in all areas of the North East State.", "3. The Human Rights Defender has immunity during their term of office."], "ch": 14, "pg": 61}, {"id": "a128", "k": "art", "n": 128, "lab": "Article 128", "labso": "Qodobka 128aad", "tso": "Magacaabidda Difaacaha Xuquuqda Aadanaha", "ten": "Appointment of the Human Rights Defender", "so": ["1. Golaha Fulinta ayaa soo jeedinaya saddex (3) musharax oo u tartamaya xilka difaacaha Xuquuqda Aadanaha, ka dib Madaxweynaha ayaa u gudbinaya Golaha Wakillada, waxaana cod hal dheeri ah (50%+1) ku dooranaya xubnaha Golaha Wakiillada.", "2. Shuruudaha Difaacaha Xuquuqda Aadanaha waa;", "(b) In uu yahay muwaaddin ka mid ah shacabka Dawladda Waqooyi Bari, Muslim ah, kuna dhaqma Diinta Islaamka, leeyahay anshax wanaagsan, maskax ahaanna fayow yahay;", "(t) In uu daacad u yahay mabaadi’da asaasiga ah ee Dawladda Waqooyi Bari;", "(j) In aanay maxkamad awood u leh dembi ciqaabeed kama dambays ah ku xukumin;", "(x) In aan da'diisu ka yarayn soddon (30) sano;", "(kh) In uu haysto shahaadado jaamacadeed Shareecada Islaamka ama qaanuunka iyo waayo aragnimo aan ka yarayn shan (5) sano.", "3. Muddada xil haynta Difaacaha Xuquuqda Aadanahu waa toddoba (7) sano, oo mar kaliya dib loo dooran karo."], "en": ["1. The Executive Council proposes three (3) candidates competing for the office of Human Rights Defender; the President then submits them to the House of Representatives, whose members elect one by a vote of one more than half (50%+1).", "2. The requirements for the Human Rights Defender are:", "(a) Being a citizen who is a member of the people of the North East State, a Muslim who practises Islam, of good character and of sound mind;", "(b) Being loyal to the fundamental principles of the North East State;", "(c) Not having been convicted of a crime by a final judgment of a competent court;", "(d) Being at least thirty (30) years old;", "(e) Holding a university degree in Islamic Sharia or law, with no less than five (5) years of experience.", "3. The term of office of the Human Rights Defender is seven (7) years, and they may be re-elected once only."], "ch": 14, "pg": 61}, {"id": "a129", "k": "art", "n": 129, "lab": "Article 129", "labso": "Qodobka 129aad", "tso": "Awoodaha Difaacaha Xuquuqda Aadanaha", "ten": "Powers of the Human Rights Defender", "so": ["1. Awoodaha iyo waajibaadka Difaacaha Xuquuqda Aadanuhu waa:", "(b) Ka hortegidda gabood fallada Xuquuqda Aadanaha, isagoo talabixin siinaya hay'adaha ay khuseyso;", "(t) Wacyigalinta dadweynaha iyo mas’uuliyiinta Dawladda muhiimadda ay leedahay dhowrista Xuquuqda Aadanaha ee ku cad Dastuurka iyo sharciyada, isla markaasna ku xusan axdiyada iyo heshiisyada caalamiga ah;", "(j) Waxa uu ilaaliyaa, difaacaa xuquuqda aadanaha, gaar ahaan carruurta, agoonta, dadka dhimirkoodu dhiman yahay iyo cidkasta oo u baahan daryeel sharci;", "(x) Difaaca iyo kaalmaynta dhibanayaasha xadgudubyada xuquuqda Aadanaha ee Dastuurka iyo shuruucda kale ay qeexayaan;", "(kh) Baadhidda cabashooyinka xuquuqdooda bini'aadannimo, una gudbiyo hay'adaha dawliga ah iyo kuwa waddaniga ah natiijada baadhista si sharciga waafaqsan;", "(d) Kormeeridda goob kasta oo ay ka dhacaan ama la tuhunsan yahay gabood fallo;", "(r) Horseedidda, kor u qaadidda iyo dib u habeynta sharciyada iyo habdhaqanka maamulka si kor loogu qaado dhawrista iyo qaddarinta Xuquuqda Aadanaha;", "(s) Soo saarista warbixin sannadeed la xidhiidha xaaladda Xuquuqda Aadanaha ee Dawladda Waqooyi Bari;", "(sh) Talo siinta Goleyaasha Dawladda si loo horumariyo ilaalinta Xuquuqda Aadanaha;", "(dh) Cilmi baadhis iyo tababarro la xidhiidha xuquuqda Aadnaha;", "(c) Gudashada xilalka kale ee sharciyada Dawladda Waqooyi Bari siiyaan xafiiskaas.", "2. Dhammaan awoodaha iyo xilalka difaacaha xuquuqda aadanuhu waa inay waafaqsan yihiin shareecada islaamka."], "en": ["1. The powers and duties of the Human Rights Defender are:", "(a) Preventing human rights abuses by advising the institutions concerned;", "(b) Raising awareness among the public and State officials of the importance of respecting the human rights set out in the Constitution and the laws, and in international charters and agreements;", "(c) Protecting and defending human rights, especially of children, orphans, persons with mental disabilities and anyone who needs legal protection;", "(d) Defending and assisting victims of the human rights violations defined by the Constitution and other laws;", "(e) Investigating complaints about human rights, and lawfully submitting the results to state and national institutions;", "(f) Inspecting any place where abuses take place or are suspected;", "(g) Leading, advancing and reforming laws and administrative practice to raise respect for human rights;", "(h) Issuing an annual report on the human rights situation in the North East State;", "(i) Advising the organs of the State on improving the protection of human rights;", "(j) Research and training on human rights;", "(k) Carrying out the other duties the laws of the North East State give the office.", "2. All the powers and duties of the Human Rights Defender must be consistent with Islamic Sharia."], "ch": 14, "pg": 62}, {"id": "a130", "k": "art", "n": 130, "lab": "Article 130", "labso": "Qodobka 130aad", "tso": "Xil Waayidda Difaacaha Xuquuqda Aadanaha", "ten": "Removal of the Human Rights Defender", "so": ["1. Difaacaha Xuquuqda Aadanaha waxaa xilka lagaga qaadi karaa cod hal dheeri ah (50%+1) guntanka fadhiga Golaha Wakiillada marka ay sugnaato mid ama ka badan sababaha hoos ku cad:", "(b) Marka uu lumiyo mid ama ka badan shuruudihii lagu soo doortay;", "(t) Marka uu geeriyoodo ama uu ku dhaco xanuun uu la gudan waayo xilkiisa;", "(j) Marka uu iscasilaad keeno, lagana aqbalo;", "(x) Marka uu ku xadgudbo Shareecda Islaamka, Dastuurka iyo qawaaniinta dalka;", "(kh) Marka maxkamad awood u leh ku riddo xukun ciqaabeed kama dambays ah."], "en": ["1. The Human Rights Defender may be removed from office by a vote of one more than half (50%+1) of the quorum of the sitting of the House of Representatives when one or more of the following grounds is established:", "(a) When they lose one or more of the requirements on which they were selected;", "(b) When they die or suffer an illness leaving them unable to perform their duties;", "(c) When they resign and it is accepted;", "(d) When they violate Islamic Sharia, the Constitution and the laws of the country;", "(e) When a competent court passes a final criminal judgment."], "ch": 14, "pg": 62}, {"id": "a131", "k": "art", "n": 131, "lab": "Article 131", "labso": "Qodobka 131aad", "tso": "Hantida iyo Maaliyadda", "ten": "Property and Finance", "so": ["1. Mabaadi’da guud ee maaliyadda waxa lagu salaynayaa heshiis heer federal ah oo Dawladda Waqooyi Bari qayb ka tahay.", "2. Hantida Dawladda Waqooyi Bari waxa ay ka kooban tahay:", "(b) Lacagaha caddaanka ah ee Dawladda;", "(t) Deymaha taagan ee Dawladda ka maqan;", "(j) Hantida guurtada, maguurtada iyo badeecadaha ku salaysan qaab sharci ah;", "(x) Hantida ay Dawladdu ku heli karto hirgelinta shuruucda cashuuraha iyo deeq kasta oo uu sharcigu jideeyey;", "(kh) Qoondada iyo kabka miisaaniyadda ka timaadda Dawladda Federaalka;", "(d) Qoondada ay Dawladda Waqooyi Bari ka hesho heshiisyadda Dawladda Federaalka ee khuseeya iyo kuwa Dawladaha xubnaha ka ah Dawladda Federaalka si waafaqsan sharciga qaybsiga kheyraadka;", "(r) Hadiyadaha la siiyo madaxda Dawladda ee leh muuqaal Dawladeed.", "3. Maaliyadda Dawladda waxaa lagu bixin karaa deymaha ay Dawladdu aqoonsan tahay iyo kharashyada Dawladda ee sharciga waafaqsan;", "4. Iibinta, iyo wareejinta hantida maguurtada ah waxaa cod hal dheeri ah (50%+1) ku ansixinaya xubnaha Golaha Wakiillada."], "en": ["1. The general principles of public finance shall be based on a federal-level agreement to which the North East State is a party.", "2. The property of the North East State consists of:", "(a) The State's cash;", "(b) Outstanding debts owed to the State;", "(c) Movable and immovable property and goods held on a lawful basis;", "(d) Property the State may obtain through implementing tax laws, and any grant provided for by law;", "(e) Allocations and budget support from the Federal Government;", "(f) The share the North East State receives from relevant Federal Government agreements and from those of federal member states, in accordance with the resource-sharing law;", "(g) Gifts given to State leaders in an official capacity.", "3. State funds may be used to pay debts the State recognises and lawful State expenditure;", "4. The sale and transfer of immovable property is approved by a vote of one more than half (50%+1) of the members of the House of Representatives."], "ch": 15, "pg": 63}, {"id": "a132", "k": "art", "n": 132, "lab": "Article 132", "labso": "Qodobka 132aad", "tso": "Dhulka iyo Khayraadka Dabiiciga ah", "ten": "Land and Natural Resources", "so": ["1. Dhulku waa hanti guud oo ka dhexeeya dadweynaha, waxaana mas’uul ka ah Dawladda.", "2. Khayraadka dabiiciga ah waxaa mas’uul ka ah Dawladda Waqooyi Bari waxa ayna qaadaysaa tallaabo kasta oo dan u ah, si waafaqsan shuruucda Dawladda Waqooyi Bari iyo shuruucda Dawladda Federaalka ah si looga faa’iidaysto khayraadka ku jira berriga iyo badda iyada oo la ilaalinayo bedqabka deegaanka."], "en": ["1. Land is common property shared among the people, and the State is responsible for it.", "2. The North East State is responsible for natural resources and shall take every beneficial measure, in accordance with the laws of the North East State and the laws of the Federal Government, to benefit from the resources on land and at sea while protecting the environment."], "ch": 15, "pg": 63}, {"id": "a133", "k": "art", "n": 133, "lab": "Article 133", "labso": "Qodobka 133aad", "tso": "Mas’uuliyadda iyo Ilaalinta Hantida iyo Maaliyadda Dawladda", "ten": "Responsibility for and Protection of State Property and Finance", "so": ["1. Golaha Fulinta ayaa mas’uul ka ah ilaalinta iyo maaraynta maaliyadda Dawladda.", "2. Xeerka Guud ee Maamulka Maaliyadda ayaa nidaaminaya masuuliyadda hantida, maaliyadda iyo cashuuraha ee heer Dawladdeed, heer Gobol iyo Degmo."], "en": ["1. The Executive Council is responsible for protecting and managing the finances of the State.", "2. The General Public Financial Management Law shall regulate responsibility for property, finance and taxation at state, regional and district level."], "ch": 15, "pg": 64}, {"id": "a134", "k": "art", "n": 134, "lab": "Article 134", "labso": "Qodobka 134aad", "tso": "Miisaaniyadda Dawladda", "ten": "The State Budget", "so": ["1. Miisaaniyadda Dawladdu waa dakhliga ay Dawladdu filayso in ay hesho sannad maaliyadeedka, iyo dhammaan kharashyada ay damacsan tahay in ay gasho si loo gaadho himilooyinkeeda.", "2. Sannad maaliyadeedka Waqooyi Bari waxa uu bilowdaa 1 -da Janaayo, waxa uuna dhammaadaa 31-da Diseembar.", "3. Hay’adaha madaxa bannaan ee Dawladda waxa ay yeelanayaan miisaaniyad u gaar ah oo ka mid ah miisaaniyadda guud.", "4. Hay’ad kasta oo qayb ahaan lagu maalgeliyo hanti Dawladeed, waxa ay yeelanaysaa miisaaniyad u gaar ah oo ku lammaan miisaaniyadda guud.", "5. Marka Golaha Wakiilladu aanu oggolaan miisaaniyadda cusub ee Dawladda bilowga sannadka, waxaa lagu sii dhaqmayaa miisaaniyadda sannadkii hore ugu badnaan muddo saddex (3) bilood ah.", "6. Xeerka miisaaniyadda waxaa Golaha Wakiillada horgeynaya Wasiirka Maaliyadda, waxaana cod hal dheeri ah (50%+1) ku ansixinaya guntanka fadhiga Golaha Wakiillada.", "7. Xeerka Maamulka Guud ee Maaliyadda ayaa qeexaya dhammaan arrimaha la xidhiidha diyaarinta, oggolaanshaha, dhaqangelinta, iyo warbixinta natiijada miisaaniyadda."], "en": ["1. The State budget is the revenue the State expects to receive in the financial year, and all the expenditure it intends to incur to achieve its aims.", "2. The financial year of the North East begins on 1 January and ends on 31 December.", "3. The independent institutions of the State shall have their own budgets within the general budget.", "4. Every institution partly funded by State property shall have its own budget attached to the general budget.", "5. When the House of Representatives has not approved the State's new budget by the start of the year, the previous year's budget continues to apply for a maximum of three (3) months.", "6. The budget law is presented to the House of Representatives by the Minister of Finance and approved by a vote of one more than half (50%+1) of the quorum of the sitting of the House.", "7. The General Public Financial Management Law defines all matters relating to the preparation, approval, implementation and reporting of budget results."], "ch": 16, "pg": 64}, {"id": "a135", "k": "art", "n": 135, "lab": "Article 135", "labso": "Qodobka 135aad", "tso": "Habraaca Miisaaniyadda", "ten": "Budget Procedure", "so": ["1. Ku talagalka miisaaniyadda Dawladda waxaa soo diyaariya Wasiirka Maaliyadda, isaga oo ku salaynaya odoroska Wasaaradaha iyo Hay’adaha kale ee Dawladda soo gudbiyeen iyo xogta ay ururisay Waaxda Miisaaniyadda, waana in miisaaniyadda loo gudbiyo Golaha Fulinta ugu dambeyn 10-ka Oktoobar ee sannad kasta.", "2. Miisaaniyadda ay Golaha Fulintu oggolaadaan waa in la horgeeyaa Golaha Wakiillada ugu dambayn 30-ka Oktoobar ee sannad kasta.", "3. Golaha Wakiillada waxaa waajib ku ah in ay ansixiyaan miisaaniyadda la hor keeno ugu dambayn 31-ka Diseembar sannad kasta."], "en": ["1. The draft State budget is prepared by the Minister of Finance, based on the estimates submitted by the ministries and other State institutions and data collected by the Budget Department, and the budget must be sent to the Executive Council no later than 10 October each year.", "2. The budget approved by the Executive Council must be presented to the House of Representatives no later than 30 October each year.", "3. The House of Representatives has a duty to approve the budget presented to it no later than 31 December each year."], "ch": 16, "pg": 65}, {"id": "a136", "k": "art", "n": 136, "lab": "Article 136", "labso": "Qodobka 136aad", "tso": "Habraaca Xisaabxidhka Sannad Maaliyadeedka", "ten": "Procedure for the Annual Closing Accounts", "so": ["1. Xisaabxidhka sannad maaliyadeedka waxaa diyaarinaya Xisaabiyaha Guud oo si dhow ula shaqaynaya Wasaaradda Maaliyadda.", "2. Wasiirka Maaliyadda ayaa xisaabxidh sannadeedka u diraya Hanti Dhawraha Guud, Golaha Fulinta iyo Golaha Wakiillada ugu dambeyn 30-ka Abriil ee sannadka xiga.", "3. Hanti Dhawraha Guud waxa uu xisaabxidhka sanad maaliyadeedka la baadhay u gudbiyaa Golaha Wakiillada ugu dambayn 30 -ka Juun ee sannadka xiga, isaga oo warbixintiisa la wadaagaya Golaha Fulinta.", "4. Marka Golaha Wakiilladu diido xisaabxidhka sannad maaliyadeedka, waa in uu Goluhu dib ugu celiyo Hanti Dhawraha Guud kana dalbado warbixin dheeraad ah.", "5. Marka Golaha Wakiilladu ku qanci waayo warbixinta Hanti Dhawraha Guud ee xisaabxidhka sannad maaliyadeedka, una muuqato in fal dembiyeed dhacay, waxa uu u gudbinayaa Xafiiska Xeer Ilaaliyaha Guud, si uu waajibaadkiisa dastuuriga ah uga guto."], "en": ["1. The closing accounts for the financial year are prepared by the Accountant General working closely with the Ministry of Finance.", "2. The Minister of Finance sends the annual closing accounts to the Auditor General, the Executive Council and the House of Representatives no later than 30 April of the following year.", "3. The Auditor General submits the audited closing accounts for the financial year to the House of Representatives no later than 30 June of the following year, sharing the report with the Executive Council.", "4. When the House of Representatives rejects the closing accounts for the financial year, it must return them to the Auditor General and request an additional report.", "5. When the House of Representatives is not satisfied with the Auditor General's report on the closing accounts and it appears a criminal act has taken place, it refers the matter to the Office of the Attorney General to carry out its constitutional duties."], "ch": 16, "pg": 65}, {"id": "a137", "k": "art", "n": 137, "lab": "Article 137", "labso": "Qodobka 137aad", "tso": "Sakada", "ten": "Zakat", "so": ["1. Sakadu waa waajib diini ah oo saaran muwaaddiniinta ay ku waajibtay, waana nidaam maaliyadeed oo Dawladdu aqoonsan tahay.", "2. Dawladdu waxa ay dhisaysaa hay’ad u gaar ah si loo habeeyo nidaamka sakada.", "3. Xeer gaar ah ayaa lagu nidaaminayaa arrimaha sakada."], "en": ["1. Zakat is a religious obligation on the citizens on whom it is due, and is a financial system the State recognises.", "2. The State shall establish a dedicated institution to organise the zakat system.", "3. A specific law shall regulate matters of zakat."], "ch": 16, "pg": 65}, {"id": "a138", "k": "art", "n": 138, "lab": "Article 138", "labso": "Qodobka 138aad", "tso": "Shaqaalaha Rayidka ah", "ten": "Civil Servants", "so": ["1. Shaqaalaha Rayidka ahi waa shaqaalaha Dawladda, waxaana lagu qaadanayaa tartan furan, caddaalad ah, kuna salaysan aqoon iyo karti, waxaana ka mas’uul ah Hay’adda Shaqaalaha Rayidka ah.", "2. Hay’adaha Dawladdu waxa ay mas’uul ka yihiin maamulka iyo maaraynta shaqaalahooda si waafaqsan Xeerka Shaqaalaha Rayidka ah.", "3. Shaqaalaha rayidka ah ee Dawladdu waxa ay u gutaan waajibaadkooda si waafaqsan dastuurka iyo xeerark
