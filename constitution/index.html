const D = {"parts": [{"so": "Baaqa Dawladda Waqooyi Bari ee Soomaaliya", "en": "Declaration of the North East State of Somalia"}, {"so": "Metelaadda Shacabka iyo Dhismaha Dawladda", "en": "Representation of the People and Structure of the State"}, {"so": "Maamul Wanaagga", "en": "Good Governance"}, {"so": "Arrimaha Shaqaalaha", "en": "Public Service Affairs"}, {"so": "Ciidamada, Amniga iyo Halganka", "en": "Forces, Security and the Struggle"}, {"so": "Wax ka Beddelka iyo Ansixinta Dastuurka", "en": "Amendment and Adoption of the Constitution"}], "chapters": [{"n": 1, "part": 1, "so": "Dawladda Waqooyi Bari", "en": "The North East State"}, {"n": 2, "part": 1, "so": "Xuquuqda iyo Xorriyaadka Aasaasiga ah", "en": "Fundamental Rights and Freedoms"}, {"n": 3, "part": 1, "so": "Waajibaadka Muwaaddinka", "en": "Duties of the Citizen"}, {"n": 4, "part": 2, "so": "Metelaadda Shacabka", "en": "Representation of the People"}, {"n": 5, "part": 2, "so": "Qaab Dhismeedka Dawladda", "en": "Structure of the State"}, {"n": 6, "part": 2, "so": "Golaha Wakiillada", "en": "The House of Representatives"}, {"n": 7, "part": 2, "so": "Habraaca Hindise Sharciyeedyada", "en": "Legislative Procedure"}, {"n": 8, "part": 2, "so": "Golaha Fulinta", "en": "The Executive Council"}, {"n": 9, "part": 2, "so": "Garsoorka", "en": "The Judiciary"}, {"n": 10, "part": 2, "so": "Gobollada iyo Degmooyinka", "en": "Regions and Districts"}, {"n": 11, "part": 2, "so": "Xidhiidhka Federaalka", "en": "Federal Relations"}, {"n": 12, "part": 3, "so": "Guddiyada Madaxa Bannaan", "en": "Independent Commissions"}, {"n": 13, "part": 3, "so": "Hay’adaha iyo Xafiisyada Madaxa Bannaan", "en": "Independent Institutions and Offices"}, {"n": 14, "part": 3, "so": "Difaacaha Xuquuqda Aadanaha", "en": "The Human Rights Defender"}, {"n": 15, "part": 3, "so": "Hantida iyo Maaliyadda", "en": "Property and Finance"}, {"n": 16, "part": 3, "so": "Miisaaniyadda", "en": "The Budget"}, {"n": 17, "part": 4, "so": "Shaqaalaha Rayidka ah iyo Shaqaalaha Gaarka ah", "en": "Civil Servants and Private-Sector Workers"}, {"n": 18, "part": 5, "so": "Ciidamada iyo Amniga", "en": "Forces and Security"}, {"n": 19, "part": 5, "so": "Halgankii Daraawiishta iyo Gaboodfalladii Gumeysiga", "en": "The Dervish Struggle and Colonial Abuses"}, {"n": 20, "part": 6, "so": "Wax ka Beddelka Dastuurka", "en": "Amendment of the Constitution"}, {"n": 21, "part": 6, "so": "Ansixinta iyo Dhaqangalka Dastuurka", "en": "Adoption and Entry into Force of the Constitution"}], "items": [{"id": "preamble", "k": "pre", "lab": "Preamble", "labso": "Gogoldhig", "tso": "Gogoldhig", "ten": "Preamble", "so": ["Haddaannu nahay dadka Dawladda Waqooyi Bari ee Soomaaliya —", "Annaga oo u MAHAD CELINAYNA ALLAHA WEYN ee koonkan oo dhan abuuray ee nagu galladay nimcada Islaamka, isla markaana QIRAYNA Nebigeenna Muxammad (SCW) ee na soo gaadhsiiyey ammaanada:", "Annaga oo ILAALINAYNA guulihii iyo midhihii halganka iyo go’aannadii shirarkii taariikhiga ahaa ee muddada dheer soo taxnaa laga soo bilaabo 1991 -kii ilaa maanta, ee SHACAB WEYNAHA ee deegaannada SSC-KHAATUMO iyo MAAKHIR ku muujiyeen himiladooda, iyo ilaalinta midnimada qaranka Soomaaliyeed:", "Annaga oo QADARINAYNA kacdoonkii JAMAAHIIRTA, CIIDAMADDA, iyo SHACABKA naftooda iyo maalkooda u huray in ay dhulkooda iyo dadkooda badbaadiyaan:", "Annaga oo TIXGELINAYNA dhaxalka dhaqanka, sooyaalka, iyo muhiimadda ay leedahay ilaalinta bedqabka deegaanka iyo nolosha bulshada:", "Annaga oo SHARFAYNA halgamayaashii Daraawiishta oo muddo 21 sannadood ah si geesinnimo leh u difaacay dhulka, dadka, sharafta iyo gobanimada ummada Soomaaliyeed, halgankaas oo lagu waayey naf iyo maal aad u tiro badan:", "Annaga oo ku HANWEYN doorka hormuudka ah ee dadka yagu ku leeyihiin xorriyadda, dhismaha dawladnimada iyo difaaca midnimada qaranka Soomaaliyeed:", "Annaga oo AQOONSAN himilada dadkayaga oo ku salaysan dawladnimo ku dhisan dhawrista xuquuqda aadanaha, sinnaanta, xorriyadda muwaaddinka, caddaalad bulsho, sarraynta sharciga iyo MIDNIMADA QARANKA SOOMAALIYEED:", "Annaga oo ADKAYNAYNA xaqa sharciga ah ee dadkayagu u leeyihiin in ay aayahooda ka tashadaan:", "Annaga oo TIXRAACAYNA qodobka 49 aad ee Dastuurka ku meelgaadhka ah ee Jamhuuriyadda Federaalka:", "Waxa aanu ku ANSIXINNAY Dastuurkan si waafaqsan Qodobka 151, Faqrada 1 ee Dastuurkan, maanta oo taariikhdu tahay 30-ka Luuliyo 2025, si jiilka waqtigan nool iyo kuwa mustaqbalkuba ugu noolaadaan dawladnimo casri ah oo u qalanta, ayna mudan yihiin."], "en": ["We, the people of the North East State of Somalia —", "GIVING THANKS to Almighty Allah, who created this whole universe and blessed us with the gift of Islam, and AFFIRMING our Prophet Muhammad (PBUH), who delivered the trust to us;", "PROTECTING the achievements and fruits of the struggle and the decisions of the historic conferences held in succession since 1991 to this day, in which THE GREAT PEOPLE of the SSC-KHAATUMO and MAAKHIR areas expressed their aspirations and the protection of the unity of the Somali nation;", "HONOURING the uprising of the MASSES, the FORCES and the PEOPLE who gave their lives and wealth to save their land and their people;", "RESPECTING our cultural heritage and history, and the importance of protecting the environment and the life of society;", "HONOURING the Dervish fighters who for 21 years courageously defended the land, the people, the honour and the freedom of the Somali nation, a struggle in which very many lives and much wealth were lost;", "PROUD of the leading role our people have played in freedom, state-building and the defence of the unity of the Somali nation;", "RECOGNISING the aspiration of our people for a statehood founded on respect for human rights, equality, the freedom of the citizen, social justice, the supremacy of law and the UNITY OF THE SOMALI NATION;", "AFFIRMING the legal right of our people to determine their own future;", "REFERRING to Article 49 of the Provisional Constitution of the Federal Republic;", "We have ADOPTED this Constitution in accordance with Article 151, Clause 1 of this Constitution, on this day, 30 July 2025, so that the present generation and those of the future may live in a modern statehood that is worthy of them and that they deserve."], "ch": 0, "pg": null}, {"id": "a1", "k": "art", "n": 1, "lab": "Article 1", "labso": "Qodobka 1aad", "tso": "Tilmaanta Dawladda Waqooyi Bari", "ten": "Description of the North East State", "so": ["1. Magaca Dawladdu waa:", "2. Dawladda Waqooyi Bari waa Dawlad xubin ka ah Jamhuuriyadda Federaalka Soomaaliya, talo wadaag ah, kuna dhisan metelaadda dadweynaha.", "3. Dawladda Waqooyi Bari waxa ay dhawraysaa gobannimada, madax bannaanida iyo midnimada Jamhuuriyadda Federaalka Soomaaliya.", "4. Allah Subxaanahu watacaalaa ka sokow (SWT), awoodda waxa iska leh Shacabka si waafaqsan shareecadda Islaamka.", "5. Dawladda Waqooyi Bari waxa ay ku dhisan tahay caddaalad bulsho, oo ka reebban gobolaysi iyo qabyaalad.", "6. Midnimada dhulka, dadka iyo jiritaanka Dawladda Waqooyi Bari waa lama taabtaan."], "en": ["1. The name of the State is: [left blank in the printed text]", "2. The North East State is a member state of the Federal Republic of Somalia, consultative in nature and founded on the representation of the people.", "3. The North East State upholds the sovereignty, independence and unity of the Federal Republic of Somalia.", "4. Apart from Allah (SWT), power belongs to the people in accordance with Islamic Sharia.", "5. The North East State is founded on social justice, free from regionalism and clannism.", "6. The unity of the land, the people and the existence of the North East State are inviolable."], "ch": 1, "pg": 1}, {"id": "a2", "k": "art", "n": 2, "lab": "Article 2", "labso": "Qodobka 2aad", "tso": "Diinta", "ten": "Religion", "so": ["1. Diinta dadka iyo Dawladda Waqooyi Bari waa Islaam, Sunni ah.", "2. Diin aan ahayn diinta Islaamka laguma faafin karo Dawladda Waqooyi Bari.", "3. Dawladda Waqooyi Bari ayaa mas’uul ka ah fulinta axkaamta Shareecada iyo ku dhaqanka diinta Islaamka, ilaalinta anshaxa bulshada, iyo ka hortagga xumaanta.", "4. Lama soo saari karo sharci aan waafaqsanayn mabaadi’da guud ee Shareecada Islaamka iyo maqaasiddeeda."], "en": ["1. The religion of the people and of the North East State is Islam, Sunni.", "2. No religion other than Islam may be propagated in the North East State.", "3. The North East State is responsible for implementing the rulings of Sharia and the practice of Islam, protecting public morals and preventing wrongdoing.", "4. No law may be enacted that is inconsistent with the general principles of Islamic Sharia and its objectives (maqasid)."], "ch": 1, "pg": 1}, {"id": "a3", "k": "art", "n": 3, "lab": "Article 3", "labso": "Qodobka 3aad", "tso": "Mabaadi’da Asaasiga ah", "ten": "Fundamental Principles", "so": ["1. Dawladda Waqooyi Bari waxa ay ku dhisan tahay mabaadi’dan aasaasiga ah:", "(b) Shareecada Islaamku waa muqaddas, waxa ayna saldhig u tahay Dastuurka iyo dhammaan shuruucda, xeerarka, habka maamulka iyo dhaqanka bulshada;", "(t) Ilaalinta midnimada dhuleed iyo wadajirka ummadda Soomaaliyeed;", "(j) Nidaamka Dawladda waxaa saldhig u ah: talo wadaagga; metelaadda bulshada; kala soocnaanta golayaasha Dawladda; maamul wanaagga; hufnaanta; daah furnaanta iyo isla xisaabtanka;", "(x) Nabad ku wada noolaanshaha, iyo in khilaafaadka lagu xalliyo wadahadal;", "(kh) Horumarinta adeegyada aasaasiga ah ee bulshada: daryeelka hooyada iyo dhalaanka; caafimaadka; waxbarashada; helitaanka biyo nadiif ah; daryeelka dadka baahiyaha gaarka ah qaba iyo agoonta;", "(d) Dhiirrigelinta, aasaasida iyo horumarinta xirfadlayaasha, hal-abuurka iyo tababarka xirfadaha;", "(r) Bedqabka deegaanka, dhul daaqsimeedka, khayraadka dabiiciga ah bad iyo berri.", "(s) Ku dhaqanka Shareecadda Islaamka, samafalka, naxariista bulshada dhexdeeda, akhlaaqda wanaagsan, ka hortagga caadooyinka qaloocan, afkaarta gurracan iyo dhaqammada xun;", "(sh) Dhawrista xuquuqda aadanaha, sinnaanta sharciga hortiisa, caddaaladda, dammaanad-qaadka amniga, ka hortagga shaqaalaynta iyo ciidamaynta carruurta.", "(dh) Horumarinta dhaqaalaha, dhiirrigelinta maalgashiga iyo ganacsiga suuqa xorta iyo xalaasha ah, wax wadaqabsiga bulshada dhexdeeda, bulshada iyo Dawladda iyo wax la-qabsiga bulshooyinka caalamka;", "(c) Ixtiraamka heshiisyada dalka iyo kuwa caalamiga ah ee aan ka hor imaanayn shareecada, danta Waqooyi Bari iyo danta qaranka Soomaaliyeed;", "(g) Ka qaybgalka haweenka iyo dhallinyarada ee maamulka, siyaasadda, ganacsiga iyo arrimaha bulshada.", "(f) Yaraynta saboolnimadda, horumarinta xoolo dhaqatada, beeralayda iyo kalluumaysatada, shaqo abuurka, qaybinta fursadaha si caddaalad ah, macdanta; faleenka; xabkaha iyo warshadaha ku shaqeeya wax soo saarka waddaniga ah.", "(q) Horumarinta af Soomaaliga, suugaanta, hiddaha iyo dhaqanka suubban; cilmi baadhista, iyo ilaalinta xuquuqda qoraalka iyo hal-abuurka."], "en": ["1. The North East State is founded on these fundamental principles:", "(a) Islamic Sharia is sacred and is the foundation of the Constitution and of all laws, regulations, administration and social custom;", "(b) Protecting the territorial unity and cohesion of the Somali nation;", "(c) The system of the State is founded on: consultation; representation of society; separation of the organs of State; good governance; integrity; transparency and mutual accountability;", "(d) Peaceful coexistence, and resolving disputes through dialogue;", "(e) Developing basic social services: maternal and child care; health; education; access to clean water; care for persons with special needs and orphans;", "(f) Encouraging, establishing and developing professionals, creativity and vocational training;", "(g) Protecting the environment, rangeland, and natural resources at sea and on land;", "(h) Practising Islamic Sharia, charity, compassion within society and good morals, and preventing deviant customs, misguided ideas and harmful practices;", "(i) Respecting human rights, equality before the law and justice, guaranteeing security, and preventing the employment and military recruitment of children;", "(j) Developing the economy, encouraging investment and free and halal market trade, cooperation within society and between society and the State, and engagement with the communities of the world;", "(k) Respecting national and international agreements that do not conflict with Sharia, the interests of the North East and the national interest of Somalia;", "(l) Participation of women and youth in administration, politics, business and social affairs;", "(m) Reducing poverty; developing pastoralists, farmers and fishers; creating jobs; distributing opportunities fairly; minerals, frankincense, gums and industries engaged in national production;", "(n) Developing the Somali language, literature, heritage and good culture; research; and protecting copyright and creative works."], "ch": 1, "pg": 2}, {"id": "a4", "k": "art", "n": 4, "lab": "Article 4", "labso": "Qodobka 4aad", "tso": "Sarraynta Sharciga", "ten": "Supremacy of the Law", "so": ["1. Sharciga ayaa ka sarreeya qof kasta.", "2. Dhammaan hay’adaha Dawladda iyo dadweynuhu waxa ay u hoggaansamayaan sharciga.", "3. Shareecada Islaamka ayaa saldhig u ah Dastuurka iyo xeer dejinta, sharci kasta iyo go’aan maamuleed kasta oo ka soo horjeedaana waa waxba kama jiraan."], "en": ["1. The law is above every person.", "2. All State institutions and the public are subject to the law.", "3. Islamic Sharia is the foundation of the Constitution and of lawmaking, and any law or administrative decision that contradicts it is null and void."], "ch": 1, "pg": 3}, {"id": "a5", "k": "art", "n": 5, "lab": "Article 5", "labso": "Qodobka 5aad", "tso": "Afka", "ten": "Language", "so": ["Afka rasmiga ah ee Dawladda Waqooyi Bari waa af Soomaali iyo af Carabi."], "en": ["The official languages of the North East State are Somali and Arabic."], "ch": 1, "pg": 3}, {"id": "a6", "k": "art", "n": 6, "lab": "Article 6", "labso": "Qodobka 6aad", "tso": "Calanka iyo Astaanta", "ten": "Flag and Emblem", "so": ["1. Calanka Dawladda Waqooyi Bari sida lagu muujiyey Lifaaqa Koowaad, waa laydi dhinaca bidix ku leh saddex xagal midab cad ah, oo dhexda uu kaga yaal faras oo uu ku joogo halyey darwiish ah; dhinaca sare waa midab buluug furan oo ay dhexda kaga taal xiddig cad oo shangees ah, madaxyo sima nna leh; dhinaca hoosena waa midab cagaar furan ah.", "2. Astaanta Dawladda Waqooyi Bari, ee lagu muujiyey Lifaaqa Labaad, waxay ka kooban tahay gaashaan dhexda kula calanka Dawladda Waqooyi Bari oo leh xiddaayad dahabi ah, dhexdana ku leh calanka Dawladda Waqooyi Bari. Gaashaanka dushiisa waxaa ku yaal rukummo Carbeed oo xardhan, lehna shan madax oo midab dahabi ah oo labada geesba ku yaalliin ay kala qaaran yihiin. Hareeraha waxaa ka haya laba faras oo isu tusmaysan, kuna kala taagan labo waran oo iska weydaarsan caar adda hoose ee gaashaanka, ayna weheliyaan laba caleen-cawbaar, diillin cadna ay ku qoofalan tahay."], "en": ["1. The flag of the North East State, as shown in Annex 1, is a rectangle with a white triangle on the left side, in the middle of which is a horse carrying a Dervish hero; the upper band is light blue with a white five-pointed star of equal points in the middle; the lower band is light green.", "2. The emblem of the North East State, shown in Annex 2, consists of a shield bearing the flag of the North East State with a gold border, with the flag of the North East State in its centre. Above the shield is an engraved Arabic crown with five gold points, the outer ones on both sides set apart. On either side, two horses face each other, standing on two spears crossed below the shield, accompanied by two branches of bay leaves wrapped in a white ribbon."], "ch": 1, "pg": 3}, {"id": "a7", "k": "art", "n": 7, "lab": "Article 7", "labso": "Qodobka 7aad", "tso": "Dhulka iyo Soohdimaha", "ten": "Territory and Borders", "so": ["1. Dhulka Dawladda Waqooyi Bari waxa uu ka kooban yahay gobollada Sool, Sanaag, iyo Togdheer oo ka mid ah Jamhuuriyadda Federaalka Soomaaliya.", "2. Midnimada dhulka Dawladda Waqooyi Bari waa lama taabtaan, laguma xadgudbi karo, lamana kala qaybin karo.", "3. Dhulka Dawladda Waqooyi Bari waxaa ku dhan hawada sare, berriga iyo dhulka hoostiisa, jiidda dhaqaalaha buluugga ah ee badda oo dhan 200 maylka badda ah, kana bilowda halka uu ku dhammaado hirka ugu dambeeya, waxaana mas’uul ka ah Dawladda Waqooyi Bari si waafaqsan Dastuurka Federaalka.", "4. Soohdimaha Dawladda Waqooyi Bari waa:", "(b) Bari waxaa ka xiga Maamul Waqooyi Bari Puntland;", "(t) Waqooyi waxaa ka xiga Gacanka Cadmeed;", "(j) Galbeed waxaa ka xiga Gobolka Waqooyi Galbeed iyo Galbeedka Gobolka Togdheer;", "(x) Koonfur waxaa ka xiga Dawlad Deegaanka Soomaalida.", "5. Dawladda Waqooyi Bari waxa ay u furan tahay gobol iyo degmo kasta oo danaynaya in ay ka mid noqdaan."], "en": ["1. The territory of the North East State consists of the regions of Sool, Sanaag and Togdheer, which are part of the Federal Republic of Somalia.", "2. The territorial unity of the North East State is inviolable; it may not be violated or divided.", "3. The territory of the North East State includes the airspace, the land and the subsoil, and the blue economic zone of the sea of 200 nautical miles, starting from the low-water line, for which the North East State is responsible in accordance with the Federal Constitution.", "4. The borders of the North East State are:", "(a) To the east, the North East Puntland Administration;", "(b) To the north, the Gulf of Aden;", "(c) To the west, the North West Region and the western part of Togdheer Region;", "(d) To the south, the Somali Regional State.", "5. The North East State is open to any region or district that wishes to join it."], "ch": 1, "pg": 4}, {"id": "a8", "k": "art", "n": 8, "lab": "Article 8", "labso": "Qodobka 8aad", "tso": "Shacabka iyo Jinsiyadda", "ten": "The People and Citizenship", "so": ["1. Shacabka Dawladda Waqooyi Bari Soomaaliya waxa uu ka kooban y ahay dhammaan muwaaddiniinta Soomaaliyeed ee deggan dhulka Dawladda Waqooyi Bari.", "2. Qof kasta oo muwaaddin Soomaaliyeed ah waxa uu xuquuq iyo waajibaad ku leeyahay Dawladda Waqooyi Bari marka uu buuxiyo shuruudaha sharciyeed ee de ggenaanshaha iyo doorashooyinka.", "3. Qof kasta oo ka mid ah shacabka Dawladda Waqooyi Bari waa in uu helo warqadaha aqoonsiga heer Dawlad Goboleed iyo heer Federaal.", "4. Tirakoobka dadweynaha Dawladda Waqooyi Bari waxaa la samaynayaa tobankii (10) sano hal mar.", "5. Xeer gaar ah ayaa nidaaminaya degg enaanshaha dhulka Dawladda Waqooyi Bari Soomaaliya."], "en": ["1. The people of the North East State of Somalia consist of all Somali citizens residing in the territory of the North East State.", "2. Every Somali citizen has rights and duties in the North East State once they meet the legal requirements for residence and elections.", "3. Every member of the people of the North East State must obtain identity documents at state level and federal level.", "4. A census of the population of the North East State shall be carried out once every ten (10) years.", "5. A specific law shall regulate residence in the territory of the North East State of Somalia."], "ch": 1, "pg": 4}, {"id": "a9", "k": "art", "n": 9, "lab": "Article 9", "labso": "Qodobka 9aad", "tso": "Magaala Madaxda iyo Magaalada Ganacsiga", "ten": "The Capital and the Commercial City", "so": ["1. Magaala Madaxda Dawladda Waqooyi Bari waa magaalada Laascaanood waana xarunta Dawladda.", "2. Magaala Madaxda labaad ee Dawladda Waqooyi Bari, ahna Magaalada Ganacsiga waa Laasqoray.", "3. Xeer gaar ah ayaa nidaaminaya maqaamka Magaala Madaxda iyo magaala ganacsiyeedka Dawladda Waqooyi Bari."], "en": ["1. The capital of the North East State is the city of Las Anod, and it is the seat of the State.", "2. The second capital of the North East State, and its commercial city, is Las Qoray.", "3. A specific law shall regulate the status of the capital and the commercial city of the North East State."], "ch": 1, "pg": 5}, {"id": "a10", "k": "art", "n": 10, "lab": "Article 10", "labso": "Qodobka 10aad", "tso": "Karaamada Aadanaha", "ten": "Human Dignity", "so": ["1. Qof kastaa waxa uu xaq u leeyahay karaamo, qaddarin, naxariisasho, iyo xorriyad.", "2. Karaamada Aadanaha laguma xad gudbi karo, dhawristeeduna waa waajib saaran Dawladda iyo dadka oo dhan.", "3. Awoodda Dawladda looma isticmaali karo ku xadgudubka karaamada qofka iyo xuquuqda aasaasiga ah ee Shareecada Islaamka iyo Dastuurku siiyeen."], "en": ["1. Every person has the right to dignity, respect, compassion and freedom.", "2. Human dignity may not be violated, and respecting it is a duty of the State and of all people.", "3. The power of the State may not be used to violate a person's dignity or the fundamental rights granted by Islamic Sharia and the Constitution."], "ch": 2, "pg": 5}, {"id": "a11", "k": "art", "n": 11, "lab": "Article 11", "labso": "Qodobka 11aad", "tso": "Sinnaanta", "ten": "Equality", "so": ["1. Shacabka Dawladda Waqooyi Bari iyadoon lagu kala soocin qabiil, dhalasho, afka, lab iyo dheddig, hanti, mudnaan iwm, waxa ay sharciga hortiisa ku leeyihiin xuquuq iyo waajibaad siman.", "2. Waxaa reebban kala sarraynta iyo takoorka ku salaysan isirka, abtirsiga, dhalashada iyo deegaanka,", "3. Waa waajib saaran Dawladda iyo muwaad diniinta cidhibtirka dhaqam mada xun ee hadhaadiga ah iyo kuwa dhawaan soo baxa ah."], "en": ["1. The people of the North East State, without distinction by clan, birth, language, sex, wealth, status or the like, have equal rights and duties before the law.", "2. Superiority and discrimination based on ethnicity, lineage, birth and place of origin are prohibited.", "3. It is a duty of the State and of citizens to eradicate harmful customs, both those inherited and those newly emerging."], "ch": 2, "pg": 5}, {"id": "a12", "k": "art", "n": 12, "lab": "Article 12", "labso": "Qodobka 12aad", "tso": "Xaqa Nolosha", "ten": "Right to Life", "so": ["1. Qof kasta waxa uu leeyahay xaqa noolaanshaha, marka laga reebo qof lagu fuliyey xukun maxkamadeed oo kama dambays ah, shareecadana waafaqsan.", "2. Waxaa reebban denbiyada laga galo xaqa nolosha iyo nabadgelyada qofka, sida xasuuq, jidhdil, xadhig iyo dil aan shareecada waafaqsanayn."], "en": ["1. Every person has the right to life, except a person on whom a final court judgment consistent with Sharia has been carried out.", "2. Crimes against the right to life and the security of the person, such as massacre, torture, detention and killing contrary to Sharia, are prohibited."], "ch": 2, "pg": 6}, {"id": "a13", "k": "art", "n": 13, "lab": "Article 13", "labso": "Qodobka 13aad", "tso": "Xorriyada Qofka", "ten": "Liberty of the Person", "so": ["1. Qofna xorriyaddiisa si aan sharciga waafaqsanayn loogama qaadi karo, lagamana xannibi karo. Xannibaad kasta oo lagu sameeyaana waa in ay sharciga ku caddahay.", "2. Qof kasta waa madax bannaan yahay, haddii aanay madax bannaanidaasi ka hor imaanayn Shareecada lslaamka, shuruucda kale ee u degsan Dawladda Waqooyi Bari, anshaxa guud, xasilloonida, ama xuquuqda qof kale."], "en": ["1. No person may be deprived of liberty or restricted unlawfully. Any restriction imposed must be set out clearly in law.", "2. Every person is free, provided that this freedom does not conflict with Islamic Sharia, the other laws in force in the North East State, public morals, stability, or the rights of another person."], "ch": 2, "pg": 6}, {"id": "a14", "k": "art", "n": 14, "lab": "Article 14", "labso": "Qodobka 14aad", "tso": "Xorriyadda iyo Nabadgelinta Qofka", "ten": "Freedom and Security of the Person", "so": ["1. Qof kasta waxa uu xaq u leeyahay nabadgelyada jidhkiisa, hantidiisa iyo dhawrista sharaftiisa waana laguma xad gudbaan.", "2. Qofna laguma khasbi karo in lagu sameeyo tijaabo dhakhtareed ama cilmi baadhiseed oggolaanshihiisa la’aanteed. Marka qofku sharciyan awood u lahayn in uu wax oggolaado, waa in xigtadiisa laga helo oggolaansho.", "3. Gudniinka gabdhuhu waa midka ay oggoshahay Shareecada Islaamka oo keliya.", "4. Waxaa reebban soo rididda ilmaha marka aanay jirin xaalado caafimaad oo nafta hooyada lagu badbaadinayo."], "en": ["1. Every person has the right to security of their body, their property and the protection of their honour, and these are inviolable.", "2. No person may be compelled to undergo a medical or research experiment without their consent. Where a person is legally unable to give consent, consent must be obtained from their next of kin.", "3. Female circumcision is only the form permitted by Islamic Sharia.", "4. Abortion is prohibited unless there are medical circumstances in which the mother's life is being saved."], "ch": 2, "pg": 6}, {"id": "a15", "k": "art", "n": 15, "lab": "Article 15", "labso": "Qodobka 15aad", "tso": "Xorriyadda Ka Mid Noqoshada", "ten": "Freedom of Association", "so": ["1. Qof kasta waxa uu xaq u leeyahay in uu ka mid noqdo urur ama koox sida urur shaqaale, dhaqan-dhaqaale iyo bulsho.", "2. Ka mid noqoshada iyo aasaasidda ururradu waa inay waafaqsan tahay Dastuurka, xeerarka iyo danaha dadka Dawladda Waqooyi Bari.", "3. Waxaa reebban ka mid noqoshada ururrada leh dabeecad qabiil, ciidan, ama ku salaysan afkaaro ka soo horjeeda shareecada islaamka, midnimada ummadda iyo dhaqanka dawladnimo."], "en": ["1. Every person has the right to join an association or group, such as a trade union, or a cultural, economic or social association.", "2. Joining and founding associations must be consistent with the Constitution, the laws and the interests of the people of the North East State.", "3. Joining associations of a clan or military character, or those based on ideas contrary to Islamic Sharia, national unity and the culture of statehood, is prohibited."], "ch": 2, "pg": 6}, {"id": "a16", "k": "art", "n": 16, "lab": "Article 16", "labso": "Qodobka 16aad", "tso": "Xorriyadda Caqiidada", "ten": "Freedom of Belief", "so": ["1. Qofka Muslimka ahi caqiidadiisa kama noqon karo.", "2. Qofka ajnabiga ah, ee aan Muslimka ahayn xor ayuu u yahay caqiidadiisa, lagumana qasbi karo mid kale.", "3. Diin, aragti iyo dhaqan khilaafsan diinta Islaamka laguma faafin karo geyiga Dawladda Waqooyi Bari."], "en": ["1. A Muslim may not renounce their faith.", "2. A foreigner who is not Muslim is free in their belief and may not be compelled to adopt another.", "3. No religion, ideology or practice contrary to Islam may be propagated in the territory of the North East State."], "ch": 2, "pg": 7}, {"id": "a17", "k": "art", "n": 17, "lab": "Article 17", "labso": "Qodobka 17aad", "tso": "Xorriyadda Fikirka", "ten": "Freedom of Thought", "so": ["1. Qof kasta waxa uu xaq u leeyahay in uu yeesho, soona bandhigo ra’yigiisa ama xog kale oo sharciga iyo anshaxa waafaqsan.", "2. Qof kasta waxa uu ra’yigiisa ku cabbiri karaa qaab hadal, qoraal, muuqaal, suugaan, habka elektaroonikada, ama habab kale oo sharciga iyo anshaxa waafaqsan."], "en": ["1. Every person has the right to hold and express their opinion or other information consistent with the law and morals.", "2. Every person may express their opinion through speech, writing, images, literature, electronic means, or other means consistent with the law and morals."], "ch": 2, "pg": 7}, {"id": "a18", "k": "art", "n": 18, "lab": "Article 18", "labso": "Qodobka 18aad", "tso": "Xorriyadda Saxaafadda", "ten": "Freedom of the Press", "so": ["1. Saxaafaddu waa mid xor ah, oo ka madax bannaan faragelin dawladeed marka ay shaqadooda u gudanayaan si waafaqsan shuruucda dalka u yaalla.", "2. Xeerka Saxaafadda ayaa nidaaminaya waajibaadka iyo xorriyadda saxaafadda."], "en": ["1. The press is free and independent of government interference while carrying out its work in accordance with the laws in force in the country.", "2. The Press Law shall regulate the duties and freedom of the press."], "ch": 2, "pg": 7}, {"id": "a19", "k": "art", "n": 19, "lab": "Article 19", "labso": "Qodobka 19aad", "tso": "Xurmada Hoyga", "ten": "Sanctity of the Home", "so": ["1. Qofna hoygiisa lama geli karo, lama baadhi karo, lamana basaasi karo amar garsoore oo sababaysan la’aantiis, haddii aanu isla wakhtigaas fal dembiyeed ka dhacayn hoyga dhexdiisa ama qof dembiile ah oo hay’adaha amnigu ku raad joogaan gabbaad ka dhigan.", "2. Waxaa waajib ah in si toos ah loogu akhriyo mulkiilaha ama degganaha hoyga amarka Garsooraha inta aan lagu dhaqaaqin baadhista, baadhahana waxaa ka reebban ku xadgudubka sharciga."], "en": ["1. No person's home may be entered, searched or spied upon without a reasoned judicial order, unless a criminal act is taking place inside the home at that moment, or a criminal being pursued by the security agencies has taken refuge there.", "2. The judge's order must be read directly to the owner or occupant of the home before the search begins, and the person conducting the search is prohibited from breaking the law."], "ch": 2, "pg": 7}, {"id": "a20", "k": "art", "n": 20, "lab": "Article 20", "labso": "Qodobka 20aad", "tso": "Xorriyadda Kulanka, Bannaanbaxa iyo Cabashada", "ten": "Freedom of Assembly, Demonstration and Petition", "so": ["1. Qof kasta waxa uu xor u yahay in uu abaabulo, ka qayb qaato kulammo ama bannaanbaxyo uu ku muujinayo ra’yigiisa hab nabadgelyo ah oo sharciga waafaqsan.", "2. Bannaanbaxyada iyo kulammada waxaa lagu joojin karaa marka ay jiraan sababo lid ku ah diinta lslaamka, caafimaadka, anshaxa, amniga iyo xasilloonida Dawladda Waqooyi Bari.", "3. Qof kasta waxa uu xaq u leeyahay in uu cabashadiisa qoraal ugu gudbiyo hay’adaha Dawladda ee ay khusayso, hay’adda uu qoraalka cabashadu ku socdo waxaa waajib ku ah in uu ka jawaabo sida ugu dhakhsaha badan ee suurtagal ah."], "en": ["1. Every person is free to organise and take part in meetings or demonstrations expressing their opinion peacefully and lawfully.", "2. Demonstrations and meetings may be stopped where there are reasons contrary to Islam, health, morals, security and the stability of the North East State.", "3. Every person has the right to submit a written complaint to the relevant State institutions, and the institution to which the complaint is addressed must respond as quickly as possible."], "ch": 2, "pg": 8}, {"id": "a21", "k": "art", "n": 21, "lab": "Article 21", "labso": "Qodobka 21aad", "tso": "Xorriyadda Degitaanka iyo Dhaqdhaqaaqa", "ten": "Freedom of Residence and Movement", "so": ["1. Muwaaddinka kasta oo Soomaaliyeed waxa uu xaq u leeyahay in uu dego, ku dhex socdo ama safro, kuna soo laabto dhulka Dawladda Waqooyi Barri goortii uu doono.", "2. Xorriyadda ku xusan Faqradda 1aad ee Qodobkan waxa ka reebban meelaha ama waqtiyada xeer ka reebo mariddeeda ama degitaankeeda."], "en": ["1. Every Somali citizen has the right to reside in, move within or travel, and return to the territory of the North East State whenever they wish.", "2. The freedom in Clause 1 of this Article does not apply to places or times where a law prohibits passage or residence."], "ch": 2, "pg": 8}, {"id": "a22", "k": "art", "n": 22, "lab": "Article 22", "labso": "Qodobka 22aad", "tso": "Xaqa Ka Qaybgalka Siyaasadda", "ten": "Right to Political Participation", "so": ["1. Shacabka Dawladda Waqooyi Bari waxa uu xaq u leeyahay in uu ka qayb qaato arrimaha siyaasadda sida:", "(b) In uu samaysan karo ama ka mid noqon karo xisbi siyaasadeed, kana qayb qaadan karo hawlihiisa;", "(t) In xisbi siyaasadeed gudihiisa looga dooran karo xil kasta oo xisbigaas ah;", "(j) Muwaaddin kasta oo buuxiya shuruudaha sharcigu tilmaamayo waxa uu xaq u leeyahay in uu wax doorto, lana doorto;", "(x) Xuquuqda ku xusan Faqrada 1aad ee Qodobkan waa in loogu dhaqmaa si waafaqsan Dastuurka iyo xeerarka kale ee khuseeya."], "en": ["1. The people of the North East State have the right to take part in political affairs, such as:", "(a) Forming or joining a political party and taking part in its activities;", "(b) Being elected within a political party to any office of that party;", "(c) Every citizen who meets the requirements set by law has the right to vote and to be elected;", "(d) The rights in Clause 1 of this Article must be exercised in accordance with the Constitution and other relevant laws."], "ch": 2, "pg": 8}, {"id": "a23", "k": "art", "n": 23, "lab": "Article 23", "labso": "Qodobka 23aad", "tso": "Xorriyadda iyo Xuquuqda Xirfadda iyo Shaqada", "ten": "Freedom and Rights of Profession and Work", "so": ["1. Muwaaddin kasta waxa uu xaq u leeyahay in uu si xor ah u doorto xirfadda, shaqada uu rabo.", "2. Dawladdu waxa ay u xil saaran tahay shaqo abuurista iyo tayeynta tababarrada shaqaalaha.", "3. Waxaa reebban shaqo khasab ah, haddii aan qaanuunku si kale u tilmaamin.", "4. Shaqaale kasta waxa uu xaq u leeyahay mushahar u dhigma shaqada uu qabto.", "5. Shaqaale kasta waxa uu xaq u leeyahay maalin nasasho ah toddobaadkiiba, fasax sannadeed, fasaxa ciidaha Islaamka, maalmaha ku astaysan munaasabadaha kala duwan ee Dawladda Waqooyi Bari u aqoonsan yahay maalmo fasax ah.", "6. Haweenku waxa ay gaar u leeyihiin fasaxyada dhalmada iyo naas nuujinta.", "7. Fasaxyada waafaqsan sharciga inta ay shaqaaluhu ku jiraan waxba iska dhimi maayo xuquuqdooda mushahar.", "8. Dawladda iyo loo shaqeeyayaasha gaarka ah waa in ay daryeelaan shaqaalaha jidh ahaan iyo damiir ahaan, isla markaana sugaan amniga iyo bedqabka goobta shaqada.", "9. Shaqaaluhu waxa ay xaq u leeyihiin in ay cabashadooda ku muujiyaan bannaanbax ama shaqo joojin si shuruucda waafaqsan, ciidammada qalabka sida marnaba shaqa joojin ma samayn karaan.", "10. Shaqaalaha iyo loo shaqeeyuhuba waxa ay xaq u leeyihiin in ay yeeshaan ururro maareeya una dooda danahooda.", "11. Shaqaale kasta wuxuu xaq u leeyahay in uu doorto shaqada iyo loo shaqeeyaha uu door bido.", "12. Qof kasta oo shaqaale ah, gaar ahaan haweenka, waxa ay xaq u leeyihiin in laga ilaaliyo, faquuqid, liidid iyo anshax darro goobaha shaqada. Hab dhaqan kasta waa in uu waafaqsanaadaa sinnaanshaha jinsiga ee goobaha shaqada, marka laga reebo wixii shareecada islaamku ku kala gaar yeeshay labka iyo dheddigga.", "13. Xeerar gaar ah ayaa nidaaminaya ururrada shaqaalaha rayidka ah iyo shaqaalaha gaarka ah."], "en": ["1. Every citizen has the right to choose freely the profession and work they want.", "2. The State is responsible for job creation and for improving the quality of workers' training.", "3. Forced labour is prohibited, unless the law provides otherwise.", "4. Every worker has the right to a wage commensurate with the work they do.", "5. Every worker has the right to a weekly day of rest, annual leave, leave for the Islamic Eids, and days marking the various occasions that the North East State recognises as public holidays.", "6. Women have the particular right to maternity and breastfeeding leave.", "7. Lawful leave taken while in employment shall not reduce workers' wage entitlements in any way.", "8. The State and private employers must care for workers physically and mentally, and ensure security and safety at the workplace.", "9. Workers have the right to express their grievances through demonstration or strike in accordance with the law; the armed forces may never strike.", "10. Workers and employers have the right to form associations that manage and advocate for their interests.", "11. Every worker has the right to choose the work and the employer they prefer.", "12. Every worker, women in particular, has the right to be protected from discrimination, belittlement and misconduct at the workplace. All conduct must be consistent with gender equality at the workplace, except where Islamic Sharia distinguishes between men and women.", "13. Specific laws shall regulate associations of civil servants and of private-sector workers."], "ch": 2, "pg": 9}, {"id": "a24", "k": "art", "n": 24, "lab": "Article 24", "labso": "Qodobka 24aad", "tso": "Xaqa Deegaanka", "ten": "Right to the Environment", "so": ["1. Qof kasta waxa uu xaq u leeyahay in uu helo bay’ad aan waxyeello u lahayn caafimaadkiisa, oo laga ilaaliyey wasakhda, dikhowga iyo waxyaabaha kale ee halista ah.", "2. Qof kasta waxa uu xaq u leeyahay in uu wax ka helo khayraadka dabiiciga ah ee Dawladda Waqooyi Bari, iyada oo laga ilaalinayo ka faa’ideysi kasta oo waxyeello u gaysan kara deegaanka iyo waarista khayraadka."], "en": ["1. Every person has the right to an environment that is not harmful to their health, protected from pollution, smoke and other hazardous substances.", "2. Every person has the right to benefit from the natural resources of the North East State, while protecting against any exploitation that could harm the environment and the sustainability of resources."], "ch": 2, "pg": 9}, {"id": "a25", "k": "art", "n": 25, "lab": "Article 25", "labso": "Qodobka 25aad", "tso": "Xorriyadda Lahaanshaha Hantida Gaarka ah", "ten": "Freedom to Own Private Property", "so": ["1. Qof kasta oo u dhashay ama sifo sharci ah ku deggan Dawladda Waqooyi Bari waxa uu xaq u leeyahay in uu yeesho hanti gaar ah si sharciga waafaqsan.", "2. Hantida gaarka ah waxaa loola wareegi karaa dan guud oo sharciga waafaqsan keliya, iyadoo markaana la bixinayo magdhaw munaasib ah, oo u dhigma hantida danta guud loola wareegay.", "3. Xeer gaar ah ayaa nidaaminaya waxyaabaha geli kara danta guud ee keeni kara la wareegidda hantida gaarka ah."], "en": ["1. Every person born in or lawfully residing in the North East State has the right to own private property in accordance with the law.", "2. Private property may be taken over only for a lawful public interest, and appropriate compensation equivalent to the property acquired must then be paid.", "3. A specific law shall regulate what may count as a public interest justifying the acquisition of private property."], "ch": 2, "pg": 10}, {"id": "a26", "k": "art", "n": 26, "lab": "Article 26", "labso": "Qodobka 26aad", "tso": "Xuquuqaha Aasaasiga ah ee Bulshada", "ten": "Fundamental Social Rights", "so": ["1. Dawladda Waqooyi Bari waa in ay fududaysaa sidii dhammaan bulshadu u heli lahayd daryeel nololeed oo u qalma karaamadooda bani aadaminnimo iyo in qof kasta helo arrimaha lama huraanka ah, si waafaqsan mabaadi’da caddaaladda bulshada.", "2. Qof kasta waxa uu xaq u leeyahay biyo nadiif ah.", "3. Qof kasta waxa uu xaq u leeyahay daryeel caafimaad, lagamana hor istaagi karo daryeel caafimaad oo degdeg ah sabab kasta, oo ay ka mid tahay awood la’aan dhaqaale.", "4. Qof kasta waxa uu xaq u leeyahay daryeel bulsho oo dhammaystiran.", "5. Xuquuqaha lagu aqoonsaday Qodobkan waxaa ka mid ah xaqa qof kasta uu u leeyahay in uu si sharciga waafaqsan u ilaashado, raadsado, si buuxdana xuquuqdaas u gaaro, iyadoo aanay Dawladda ama cid kale ku faragelin.", "6. Waa in haweenka, carruurta, dadka da’da ah, iyo dadka naafada ah ay helaan daryeel gaar ah, si ay u gaadhaan xuquuqdooda dhaqan dhaqaale."], "en": ["1. The North East State must make it easier for all of society to obtain living conditions worthy of their human dignity, and for every person to obtain basic necessities, in accordance with the principles of social justice.", "2. Every person has the right to clean water.", "3. Every person has the right to health care, and no one may be refused emergency health care for any reason, including inability to pay.", "4. Every person has the right to comprehensive social welfare.", "5. The rights recognised in this Article include every person's right to lawfully protect, seek and fully attain those rights, without interference from the State or anyone else.", "6. Women, children, older persons and persons with disabilities must receive special care so they can attain their economic and social rights."], "ch": 2, "pg": 10}, {"id": "a27", "k": "art", "n": 27, "lab": "Article 27", "labso": "Qodobka 27aad", "tso": "Daryeelka Qoyska", "ten": "Family Welfare", "so": ["1. Qoyska oo ah unugga bulshada waxa aasaas u ah guurka, ilaalintiisuna waa waajib sharci ah oo saaran Dawladda.", "2. Daryeelka Hooyada iyo Dhallaanka waa waajib saaran aabbaha qoyska.", "3. Ubadku waxa uu waalidkiis xaq ugu leeyahay xannaano ay ka mid tahay waxbarasho iyo barbaarin, haddiise xannaanadaas uu ka waayo qoyskiisa iyo qaraabadiisa, waa in Dawladdu qaaddo mas’uuliyadda ama u yeesho cid kale oo daryeesha.", "4. Waalidka aan isku filnayn waxa uu ubadkiisa qaangaadhka ah ee awooda xaq ugu leeyahay daryeel sharci ah.", "5. Guurku waxa uu ansaxayaa marka ay dhammaystirmaan shuruudaha iyo tiirarka guurka, oo ay ka mid tahay oggolaansho ninka iyo haweenayda ka yimid."], "en": ["1. The family, the basic unit of society, is founded on marriage, and protecting it is a legal duty of the State.", "2. The care of the mother and infant is a duty of the father of the family.", "3. A child has the right to care from their parents, including education and upbringing; if the child is deprived of that care by their family and relatives, the State must take responsibility or arrange for someone else to provide care.", "4. A parent who is not self-sufficient has the right to lawful support from their adult children who are able to provide it.", "5. A marriage is valid when the conditions and pillars of marriage are fulfilled, including the consent of the man and the woman."], "ch": 2, "pg": 10}, {"id": "a28", "k": "art", "n": 28, "lab": "Article 28", "labso": "Qodobka 28aad", "tso": "Carruurta", "ten": "Children", "so": ["1. Ubad kasta marka uu dhasho waxa uu xaq u leeyahay magac suubban iyo diiwaangelin maddani ah.", "2. Ubad kasta waxa uu xaq u leeyahay in laga ilaaliyo dhaqan xumo, dayacaad, xadgudub ama liiditaan.", "3. Carruurta looma diri karo inay qabtaan shaqo, ama adeegyo aan ku habboonayn da’dooda, halisna gelin kara caafimaadkooda ama koritaankooda.", "4. Carruurta laguma fulin karo xeer ciqaabeed sida, qisaasta iyo xuduudaha kale ee shareecadu jidaysay.", "5. Waxaa reebban xidhitaanka carruurta da’doodu ka yar tahay shan iyo toban (15) sano, waxaase lagu hayn karaa goobo dhaqan celin oo iyaga u gaar ah.", "6. Carruurtu waxa ay xaq u leeyihiin in ay helaan kaalmo qareennimo oo kharashkeeda ay Dawladdu bixiso marka aan waalidku awoodin, si ay uga badbaadaan dacwad kasta oo caddaalad darro u keeni karta.", "7. Carruurtu waxa ay xaq u leeyihiin in laga ilaaliyo, loona adeegsan dagaallada hubaysan.", "8. Waalidka ayaa ka mas’uul ah ubadkiisa, danta carruurta ayaana mar walba mudnaanta leh arrin kasta oo maslaxaddooda khusaysa, si waafaqsan shareecada islaamka.", "9. Ereyga ‘carruur’ ee Dastuurka ku xusan waxaa looga jeedaa qof da’diisu ka yar tahay shan iyo toban sano (15) jir."], "en": ["1. Every child at birth has the right to a good name and civil registration.", "2. Every child has the right to be protected from abuse, neglect, violation or belittlement.", "3. Children may not be sent to do work or services unsuitable for their age that could endanger their health or development.", "4. Penal laws such as qisas and the other hudud prescribed by Sharia may not be applied to children.", "5. The imprisonment of children under fifteen (15) years of age is prohibited, but they may be held in rehabilitation centres designated for them.", "6. Children have the right to legal assistance paid for by the State when the parents cannot afford it, to protect them from any case that could lead to injustice.", "7. Children have the right to be protected from, and not to be used in, armed conflict.", "8. Parents are responsible for their children, and the interest of the child always takes priority in every matter concerning their welfare, in accordance with Islamic Sharia.", "9. The word \"child\" in this Constitution means a person under fifteen (15) years of age."], "ch": 2, "pg": 11}, {"id": "a29", "k": "art", "n": 29, "lab": "Article 29", "labso": "Qodobka 29aad", "tso": "Waxbarashada", "ten": "Education", "so": ["1. Waxbarashadu waa xuquuq aasaasi ah oo ay leeyihiin dhammaan muwaaddiniinta Soomaaliyeed ee Dawladda Waqooyi Bari.", "2. Dhammaan muwaad diniinta Soomaaliyeed ee Dawladda Waqooyi Bari waxa ay xaq u leeyihiin in ay helaan waxbarasho lacag la’aan ah ilaa dugsi sare.", "3. Dawladdu waxa ay mudnaan siinaysaa horumarinta, baahinta iyo fidinta waxbarashada dadweynaha.", "4. Dugsiyada, mac -hadyada iyo jaamacadaha gaarka loo leeyahay waa in lagu dhisaa si waafaqsan sharciga, lana jaan qaadaan barnaamijyada iyo manaahijta waxbarashada Dawladda Waqooyi Bari.", "5. Dawladdu waxa ay dhiirrigelineysaa sare -u-qaadidda cilmi baadhista; hal abuurka iyo farshaxanka; horumarinta hiddaha & dhaqanka, ciyaaraha (isboortiga) si waafaqsan shareecada iyo dhaqanka suuban ee dadka Soomaaliyeed.", "6. Dawladdu waxa ay dugsiyada Dawladda oo dhan ka hirgelinaysaa manhaj midaysan oo qeexaya yoolalka iyo kartida waxbarasho ee looga baahan yahay ardayda.", "7. Dawladdu waxa ay dhiirrigelinaysaa tartan furan oo xor ah oo lagu diyaarinayo manhaj hoosaadyo, iyo agabka waxbarashada, sida buugta manhajka lagu fulinayo.", "8. Dawladdu waxa ay kobcinaysaa tayada waxbarashada sare, mac -hadyada farsamada, mac-hadyada tiknoolojiyadda, mac-hadyada shareecada iyo xarumaha cilmi baadhista.", "9. Waxaa khasab ah in carruurta lagu baro diinta Islaamka dugsiyada Dawladda iyo kuwa gaarka loo leeyahayba.", "10. Waxbarashada diinta iyo tarbiyadda Islaamka waa dariiqad aasaasi ah, dhammaan heerarka waxbarashada hoose, dhexe, sare, iyo tacliinta sare.", "11. Waxaa la furan karaa dugsiyo waxbarasho, kuwo xirfadeed iyo jaamacado gaar ah oo waafaqsan manhajka Dawladdu u dejisay, kuna salaysan baahida iyo siyaasadda waxbarashada Dawladda Waqooyi Bari.", "12. Waxbarashada aasaasiga ah ee carruurtu waa khasab.", "13. Dawladda ayaa u xilsaaran helitaanka goobaha, agabka iyo hawlwadeennada waxbarashada aasaasiga ah.", "14. Dawladdu waxa ay dhiirrigelineysaa isla maarkaasna tayayneysaa waxbarashada diineed ee dugsiyada Qur'aanka."], "en": ["1. Education is a fundamental right of all Somali citizens in the North East State.", "2. All Somali citizens in the North East State have the right to free education up to secondary school.", "3. The State gives priority to developing, spreading and expanding public education.", "4. Private schools, institutes and universities must be established in accordance with the law and keep pace with the education programmes and curricula of the North East State.", "5. The State encourages the advancement of research, creativity and the arts, the development of heritage and culture, and sport, in accordance with Sharia and the good culture of the Somali people.", "6. The State implements in all State schools a unified curriculum that defines the learning goals and competencies required of students.", "7. The State encourages open and free competition in preparing sub-curricula and learning materials, such as the textbooks through which the curriculum is delivered.", "8. The State develops the quality of higher education, technical institutes, technology institutes, Sharia institutes and research centres.", "9. Teaching children the religion of Islam is compulsory in both State and private schools.", "10. Religious education and Islamic upbringing are a basic subject at all levels of primary, intermediate, secondary and higher education.", "11. Private schools, vocational schools and universities may be opened in line with the curriculum set by the State and based on the needs and education policy of the North East State.", "12. Basic education for children is compulsory.", "13. The State is responsible for providing the premises, materials and staff for basic education.", "14. The State encourages and improves the quality of religious education in Quranic schools."], "ch": 2, "pg": 11}, {"id": "a30", "k": "art", "n": 30, "lab": "Article 30", "labso": "Qodobka 30aad", "tso": "Dhaqanka iyo Afka", "ten": "Culture and Language", "so": ["1. Dawladdu waxa ilaalisaa isla markaana horumarisaa afka, hiddaha iyo dhaqanka suubban ee shacabka Dawladda Waqooyi Bari, iyada oo ku dadaaleysa in ay suuliso caadooyinka hadhaadiga ah iyo kuwa dhowaan -soo-baxa ah ee wax u dhimaya diinta, dhaqanka suubban, midnimada, ilbaxnimada iyo caafimaadka bulshada.", "2. Dawladdu waxa ay ururisaa, ilaalisaa, kaydisaa, suugaanta, waxyaabaha iyo xarumaha taariikhiga ah, iyadoo horumarinaysa aqoonta iyo farsamada xilkaas lagu gudan karo.", "3. Xuquuqda Qodobkan ku xusan waa in loogu dhaqmaa si waafaqsan xuquuqda asaasiga ah ee Dastuurkan lagu aqoonsaday."], "en": ["1. The State protects and develops the language, heritage and good culture of the people of the North East State, while working to eliminate inherited and newly emerging customs that harm religion, good culture, unity, civilisation and public health.", "2. The State collects, protects and preserves literature, historical objects and sites, while developing the knowledge and techniques needed to carry out that duty.", "3. The rights in this Article must be exercised in accordance with the fundamental rights recognised in this Constitution."], "ch": 2, "pg": 12}, {"id": "a31", "k": "art", "n": 31, "lab": "Article 31", "labso": "Qodobka 31aad", "tso": "Xaqa Hellidda Xogta", "ten": "Right of Access to Information", "so": ["1. Qof kasta oo ka mid ah shacabka Dawladda Waqooyi Bari ah waxa uu xaq u leeyahay in uu helo xogta maamulku hayo oo aan amniga, wadajirka iyo xuquuqda muwaaddin kale wax u dhimayn.", "2. Qof kasta oo ka mid ah shacabka Dawladda Waqooyi Bari ah waxa uu xaq u leeyahay helitaanka xogta ay cid kale hayso oo loogu baahan yahay in lagu fuliyo ama lagu ilaaliyo xuquuq kasta oo dastuurku oggol yahay.", "3. Xeerka Dhawrista Xogta ayaa nidaaminaya xaqa helitaanka xogta."], "en": ["1. Every member of the people of the North East State has the right to access information held by the administration that does not harm security, cohesion or the rights of another citizen.", "2. Every member of the people of the North East State has the right to access information held by another party that is needed to exercise or protect any right the Constitution permits.", "3. The Data Protection Law shall regulate the right of access to information."], "ch": 2, "pg": 13}, {"id": "a32", "k": "art", "n": 32, "lab": "Article 32", "labso": "Qodobka 32aad", "tso": "Go’aannada Maamul", "ten": "Administrative Decisions", "so": ["Shacabka Dawladda Waqooyi Bari waxa ay xaq u leeyihiin in go’aammada ka soo baxa Golayaasha Dawladda ay ahaadaan kuwo waafaqsan Dastuurka iyo shuruucda kale ee dalka u yaala."], "en": ["The people of the North East State have the right for decisions issued by the organs of the State to be consistent with the Constitution and the other laws in force in the country."], "ch": 2, "pg": 13}, {"id": "a33", "k": "art", "n": 33, "lab": "Article 33", "labso": "Qodobka 33aad", "tso": "Xaqa Dacwada iyo Is Difaaca", "ten": "Right to Litigation and Self-Defence", "so": ["1. Qof kasta waxa uu xaq u leeyahay in uu dacwad sharciga waafaqsan ka furto maxkamadaha awoodda u leh.", "2. Qof kasta waxa uu xaq u leeyahay in uu dacwadaha madaniga ah iyo kuwa ciqaabta ah u helo garsoor madax bannaan, caddaalad ah, laguna qaadayo maxkamad dadweynaha u furan, haddii aanay wax u dhimayn amniga, dhaqanka iyo anshaxa wanaagsan, laguna galo wakhti macquul ah.", "3. Qof kasta oo aan iska difaaci karin maxkamadda horteeda, ama awoodin in uu qareen qabsado, Dawladda ayey waajib ku tahay in ay u qabato qareen lacag la’aan ah.", "4. Qof ama koox bulshada ka mid ah waxa ay xaq u leeyihiin in ay soo oogaan dacwad ay ku raadinayaan dan guud, dawladda ayaana damaanad qaadaysa dhammaan baahiyaha dacwadda si waafaqsan xeerarka u yaalla Dawladda Waqooyi Bari."], "en": ["1. Every person has the right to bring a lawful case before the competent courts.", "2. Every person has the right, in civil and criminal cases, to an independent and fair hearing held in a court open to the public, unless this harms security, culture and good morals, and to be heard within a reasonable time.", "3. For every person who cannot defend themselves before the court or cannot afford a lawyer, the State has a duty to provide a lawyer free of charge.", "4. A person or a group of society has the right to bring a case in the public interest, and the State guarantees all the needs of the case in accordance with the laws in force in the North East State."], "ch": 2, "pg": 13}, {"id": "a34", "k": "art", "n": 34, "lab": "Article 34", "labso": "Qodobka 34aad", "tso": "Xuquuqda Eedaysanaha", "ten": "Rights of the Accused", "so": ["1. Qofna dembiile ma aha ilaa ay maxkamadi si kama dambays ah u xukunto.", "2. Qof kasta oo xorriyaddiisa shakhsiga ah laga qaado waa in maxkamadda awoodda u leh isla markiiba si tifaftiran u ogeysiisaa dembiga lagu tuhunsan yahay, uguna macnayso dembiga lagu soo oogey af uu garanayo.", "3. Eedeysane kasta waa in afartan iyo siddeed (48) saacadood gudahood lagu hor geeyo maxkamad.", "4. Qof kasta waxa uu xaq u leeyahay in uu qabsado qareen difaaca, marka uusan awood u lahaynna Dawladdu u qabato.", "5. Qof kasta oo maxkamad lagu soo taagey tuhun fal dembi ciqaabeed waxa uu xaq u leeyahay garsoor caaddil ah.", "6. Eedaysanaha xorriyaddiisa shakhsiga ah laga qaado waa in xaaladdiisa lagu wargeliyo qoyskiisa ama eheladiisa.", "7. Eedaysanaha waxaa lagu sii deyn karaa dammaanad inta dacwaddiisu socoto marka sharcigu oggol yahay.", "8. Eedeysanaha laguma hayn karo goob aan sharcigu bannayn, waana in loo oggolaado booqashada eheladiisa, dhakhtarkiisa iyo qareenkiisa.", "9. Eedaysanuhu waxa uu xaq u leeyahay in la dhawro nabadgelyadiisa iyo sharaftiisa aadaminnimo.", "10. Eedaysanuhu waxa uu xaq u leeyahay in uu goobjoog ka ahaado fadhiga maxkamadda qaadaysa dacwadiisa oo iska difaaco caddaymaha la soo hordhigay ee lidka ku ah.", "11. Eedaysanuhu waxa uu xaq u leeyahay in loo qabto turjubaan haddii uusan garanayn afka maxkamadda laga isticmaalayo.", "12. Eedaysanaha laguma khasbi karo qirashada dembiga loo haysto."], "en": ["1. No person is guilty until a court has given a final judgment.", "2. Every person deprived of personal liberty must be informed immediately and in detail by the competent court of the offence they are suspected of, and the charge must be explained to them in a language they understand.", "3. Every accused person must be brought before a court within forty-eight (48) hours.", "4. Every person has the right to a defence lawyer, and where they cannot afford one, the State shall provide one.", "5. Every person brought before a court on suspicion of a criminal act has the right to a fair trial.", "6. When an accused person is deprived of personal liberty, their family or relatives must be informed of their situation.", "7. An accused person may be released on bail while their case is ongoing, where the law permits.", "8. An accused person may not be held in a place not permitted by law, and must be allowed visits from their relatives, their doctor and their lawyer.", "9. An accused person has the right to have their security and human dignity respected.", "10. An accused person has the right to be present at the court session hearing their case and to defend themselves against the evidence presented against them.", "11. An accused person has the right to an interpreter if they do not understand the language used in court.", "12. An accused person may not be compelled to confess to the offence they are charged with."], "ch": 2, "pg": 14}, {"id": "a35", "k": "art", "n": 35, "lab": "Article 35", "labso": "Qodobka 35aad", "tso": "Xuquuqda iyo Ciqaabta Xukumanaha", "ten": "Rights and Punishment of Convicted Persons", "so": ["1. Qofka maxkamadi xukuntay waxa uu xaq u leeyahay ilaalinta nabadgelyadiisa iyo sharaftiisa aadaminnimo.", "2. Qofka maxbuuska ah waxaa lagu dhaqayaa xeerarka Dawladda Waqooyi Bari, Soomaaliya iyo sharciyada caalamiga ah ee maxaabiista ee waafaqsan danta iyo Diinta ummadda Soomaaliyeed.", "3. Xukumanaha laguma hayn karo goob aan sharcigu bannayn, waana in loo oggolaado booqashada eheladiisa, dhakhtarkiisa iyo qareenkiisa.", "4. Qofka Maxbuuska ahi waxa uu xaq u leeyahay daryeel caafimaad, cunto iyo waxbarasho.", "5. Qofka xukumanaha ahi waxa uu xaq u leeyahay in uu rafcaan ka qaato xukunkii maxkamaddu ku ridday.", "6. Ciqaab iyo dembi waa wixii qodob, xeer ama sharci waafaqsan, shareecada islaamkuna jideysey, waxaana reebban in ciqaabta loo fuliyo hab aan sharciga waafaqsanayn.", "7. Mas’uuliyadda ciqaabtu waa shakhsi, qofna looma ciqaabi karo fal-dembiyeed uu galay qof kale.", "8. Qofna laguma fulin karo ciqaab ama xukum aysan maxkamad awood u leh go’aamin.", "9. Qofna looma qaban karo, xidhi karo, ciqaabi karo fal markii uu ku kacay sharcigu dembi u aqoonsanayn, haddii uusan ahayn dembi ka soo horjeeda Shareecada Islaamka iyo bani’aadaminnimada."], "en": ["1. A person convicted by a court has the right to the protection of their security and human dignity.", "2. A prisoner shall be treated according to the laws of the North East State, of Somalia and international laws on prisoners that are consistent with the interests and religion of the Somali nation.", "3. A convicted person may not be held in a place not permitted by law, and must be allowed visits from their relatives, their doctor and their lawyer.", "4. A prisoner has the right to health care, food and education.", "5. A convicted person has the right to appeal the judgment the court passed on them.", "6. Punishment and crime are what an article, regulation or law consistent with Islamic Sharia has prescribed, and carrying out punishment in an unlawful manner is prohibited.", "7. Criminal liability is personal; no one may be punished for a criminal act committed by another person.", "8. No punishment or judgment may be carried out on a person unless decided by a competent court.", "9. No person may be arrested, detained or punished for an act that the law did not recognise as a crime when it was committed, unless it is a crime contrary to Islamic Sharia and humanity."], "ch": 2, "pg": 14}, {"id": "a36", "k": "art", "n": 36, "lab": "Article 36", "labso": "Qodobka 36aad", "tso": "Isucelinta Eedaysanayaasha iyo Dembiilayaasha", "ten": "Extradition of Accused and Convicted Persons", "so": ["1. Isucelinta dembiilaha ee Dawladda Waqooyi Bari iyo Dawladdaha xubnaha ka ah Dawladda Federaalka waa in ay waafaqsan tahay Shareecada Islaamka iyo heshiis ama is-afgarad dhexmaray labada dhinac.", "2. Isucelinta eedeysanayaasha iyo dembiilayaasha heer caalami ah waxaa lagu oggolaan karaa oo keliya si waafaqsan sharciga, iyo in uu jiro heshiis isucelin ah oo ay Jamhuuriyadda Federaalka Soomaaliya dhinac ka tahay.", "3. Qofna looma gacan gelin karo maamullada kale ee dalka ama dal kale arrimo siyaasadeed awgood.", "4. Waxaa reebban in muwaaddin Soomaaliyeed oo ka mid ah shacabka Dawladda Waqooyi Bari loo dhiibo Maamul kale ama dal shisheeye."], "en": ["1. The extradition of offenders between the North East State and the member states of the Federal Government must be consistent with Islamic Sharia and an agreement or understanding between the two sides.", "2. The international extradition of accused and convicted persons may be permitted only in accordance with the law, and where there is an extradition agreement to which the Federal Republic of Somalia is a party.", "3. No person may be handed over to other administrations in the country or to another country for political reasons.", "4. It is prohibited to hand over a Somali citizen who is a member of the people of the North East State to another administration or to a foreign country."], "ch": 2, "pg": 15}, {"id": "a37", "k": "art", "n": 37, "lab": "Article 37", "labso": "Qodobka 37aad", "tso": "Qaxootiga iyo Magangelyada", "ten": "Refugees and Asylum", "so": ["Xeer gaar ah ayaa nidaaminaya arrimaha qaxootiga iyo magangelyo doonka si waafaqsan Dastuurka Jamhuuriyadda Federaalka Soomaaliya iyo heshiisyada caalamiga ah."], "en": ["A specific law shall regulate matters of refugees and asylum seekers in accordance with the Constitution of the Federal Republic of Somalia and international agreements."], "ch": 2, "pg": 15}, {"id": "a38", "k": "art", "n": 38, "lab": "Article 38", "labso": "Qodobka 38aad", "tso": "Xorriyadda Wada Xidhiidhka iyo Isgaadhsiinta", "ten": "Freedom of Correspondence and Communication", "so": ["1. Qof kasta waxa uu xaq u leeyahay in uu la xidhiidho qofka uu doono.", "2. Qofna lama faragelin karo qoraalladiisa gaarka ah, waraaqihiisa boosta ama xidhiidhkiisa isgaadhsiineed.", "3. Wada xidhiidhka iyo isgaadhsiinta qofka waxa la faragelin karaa xaaladda uu xeerku banneeyo baadhitaankooda, dabagalkooda, ama dhegaysigooda, waana waajib in loo helo oggolaansho garsoore."], "en": ["1. Every person has the right to communicate with whomever they wish.", "2. No person's private writings, postal letters or telecommunications may be interfered with.", "3. A person's correspondence and communications may be interfered with where the law permits their examination, monitoring or interception, and the authorisation of a judge must be obtained."], "ch": 2, "pg": 15}, {"id": "a39", "k": "art", "n": 39, "lab": "Article 39", "labso": "Qodobka 39aad", "tso": "Xaddidaadda Xuquuqda", "ten": "Limitation of Rights", "so": ["1. Xuquuqda muwaaddinka waa la xaddidi karaa:", "(b) Marka maxkamad awood u leh ku riddo xukun ciqaabeed kama dambays ah.", "(t) Marka Qofku yahay garaad-dhiman, dhakhtar ama Maxkamad awood u leh caddaysay in aanu gudan karin xilkiisa.", "(j) Marka ay jirto xaalad degdeg ah sida ku xusan Qodobka 146, Faqrada 8.", "2. Qofna xorriyaddiisa loogama qaadi karo si aan Dastuurka iyo xeerarka Dawladda Waqooyi Bari waafaqsanayn.", "3. Waxa reebban in qof la qabto, la baadho ama la xayiro, haddii uusan markaa dembi faraha kula jirin, ama amar qabasho oo sababaysan ku soo saarin Garsoore awood u leh.", "4. Dawladda ayaa muwaaddiniinta u dammaanad qaadaysa xuquuqda iyo xorriyadaha. Sharciga ayaa qeexaya ciqaabta ka dhalan karta ku xad gudubka xorriyadda muwaaddinka.", "5. Dhammaan xorriyaadka qofka muwaaddinka ah waa in aysan ka hor iman Shareecada Islaamka, xeerarka anshaxa guud, xasilloonida ama xuquuqda qofka kale."], "en": ["1. The rights of a citizen may be limited:", "(a) When a competent court passes a final criminal judgment.", "(b) When the person is of unsound mind, and a doctor or competent court has established that they cannot carry out their duties.", "(c) When there is a state of emergency as set out in Article 146, Clause 8.", "2. No person may be deprived of liberty in a manner not consistent with the Constitution and the laws of the North East State.", "3. It is prohibited to arrest, search or detain a person unless they are caught in the act of a crime, or a competent judge has issued a reasoned arrest warrant.", "4. The State guarantees citizens their rights and freedoms. The law defines the punishment that may result from violating a citizen's liberty.", "5. All of a citizen's freedoms must not conflict with Islamic Sharia, the rules of public morals, stability or the rights of another person."], "ch": 2, "pg": 16}, {"id": "a40", "k": "art", "n": 40, "lab": "Article 40", "labso": "Qodobka 40aad", "tso": "Sixidda Xadgudubyada Xuquuqda Aadanaha", "ten": "Remedying Human Rights Violations", "so": ["1. Sixidda xadgudubka xuquuqda aadanaha waa in lagu helaa maxkamad ay dadku si fudud dacwad uga furan karaan.", "2. Qof ama urur kasta wuu tegi karaa maxkamadda awoodda u leh, si uu u difaaco xuquuqda dadka kale ee aan awoodin in ay iskood isu difaacaan.", "3. Sharci iyo xeerar ayaa qeexaya habraaca ku habboon ee lagu saxayo, xadgudubyada xaquuqda Aadanaha."], "en": ["1. Remedies for human rights violations must be available through a court in which people can easily bring a case.", "2. Any person or organisation may go to the competent court to defend the rights of others who cannot defend themselves.", "3. Laws and regulations shall define the appropriate procedure for remedying human rights violations."], "ch": 2, "pg": 16}, {"id": "a41", "k": "art", "n": 41, "lab": "Article 41", "labso": "Qodobka 41aad", "tso": "Fasiraadda Xuquuqda Asaasiga ah", "ten": "Interpretation of Fundamental Rights", "so": ["1. Marka la fasirayo xuquuqda ku xusan qaybtan waa in maxkamaddu ay raadiso qeexidda ujeeddooyinka laga leeyahay xuquuqdaas iyo qiyamka ay xambaarsan yihiin.", "2. Fasiraadda xuquuqda waxa ay maxkamaddu raacaysaa Shareecada Islaamka, qaanuunka caalamiga ah iyo go’aannada maxkamadaha dalal kale, hadday u aragto inay waafaqsan yihiin Diinta iyo danta ummadda Soomaaliyeed.", "3. Marka guud ahaan sharci la fasirayo ama la dhaqangelinayo, maxkamad kasta waa in ay tixgelisaa muhiimmada qodobbada Cutubkan, intii suurtagal ahna go’aankeeda ka dhigto kuwo la socon kara qodobbadan.", "4. Xuquuqda aasaasiga ah ee ku xusan Cutubkan kama hor imaan karaan xuquuqda kale ee Shareecada Islaamku jideysey iyo xeer dhaqameedka la jaanqaadi kara Shareecada Islaamka iyo Dastuurka."], "en": ["1. When interpreting the rights in this Part, the court must seek to define the purposes of those rights and the values they carry.", "2. In interpreting rights, the court shall follow Islamic Sharia, international law and the decisions of courts of other countries, if it considers them consistent with the religion and interests of the Somali nation.", "3. When interpreting or applying law generally, every court must take into account the importance of the provisions of this Chapter and, as far as possible, make its decisions consistent with them.", "4. The fundamental rights in this Chapter may not conflict with other rights prescribed by Islamic Sharia and with customary law (xeer) that is compatible with Islamic Sharia and the Constitution."], "ch": 2, "pg": 16}, {"id": "a42", "k": "art", "n": 42, "lab": "Article 42", "labso": "Qodobka 42aad", "tso": "Dhaqangelinta Xuquuqda Aasaasiga ah", "ten": "Implementation of Fundamental Rights", "so": ["1. Xuquuqda aasaasiga ah iyo xorriyaddu waa mid dhawrsan, mar kasta oo xeer la samaynayo ama fulin ay ka jirto heerarka kala duwan ee Dawladda.", "2. Waajibaadka Dawladdu waa dhawritaanka iyo ilaalinta xuquuqda iyo qaadidda tallaabooyin maangal ah oo lagu xakamaynayo xadgudubyada, cid kastaba ha ka yimaaddeene."], "en": ["1. Fundamental rights and freedoms are protected whenever a law is made or implementation takes place at the various levels of the State.", "2. The duty of the State is to respect and protect rights and to take reasonable measures to curb violations, whoever commits them."], "ch": 2, "pg": 17}, {"id": "a43", "k": "art", "n": 43, "lab": "Article 43", "labso": "Qodobka 43aad", "tso": "Waajibaadka Muwaaddinka", "ten": "Duties of the Citizen", "so": ["1. Muwaaddin kasta waxaa waajib ku ah: ku dhaqanka diinta Islaamka, ilaalinta Dastuurka iyo xeerarka kale Dawladda Waqooyi Bari iyo shuruucda iyo xeerarka u yaalla Jamhuuriyadda Federaalka Soomaaliya, iyo kuwa caalamiga ee aan ka hor imaanayn Shareecada Islaamka iyo shuruucda kale ee dalka u yaalla.", "1. Ku dhaqanka sinnaanta, xorriyaadka iyo xuquuqda lagama sooci karo waajibaadka muwaaddinka. Sidaas darteed, muwaaddin kasta waxaa waajib ku ah in uu noqdo:", "(b) Waddani daacad u ah horumarinta iyo wanaagga dalkiisa;", "(t) Mid ka qayb qaata hawlaha waxtarka iyo hortebinta u leh muwaaddinka, qoyska, wanaagga guud, horumarka Dawladda Waqooyi Bari, qaranka Soomaaliyeed iyo bulshada uu la nool yahay;", "(j) Mid horumariya mas’uuliyadda waalidnimo;", "(x) Mid dhiirrigeliya midnimada Dawladda Waqooyi Bari iyo qaranka Soomaaliyeed, isaga oo kaashanaya muwaaddiniinta kale;", "(kh) Mid horumariya mabda’a isla-xisaabtanka iyo daah furnaanta;", "(d) Mid ku dadaala codbixinta xilliyada doorashada;", "(r) Cashuur bixiye si waafaqsan Shareecada Islaamka, shuruucda Waqooyi Bari iyo Dawladda Federaalka.", "(s) Mid difaaca dhulka Dawladda Waqooyi Bari iyo dalka Jamhuuriyadda Federaalka Soomaaliya;", "2. Muwaaddin kasta oo ka mid ah shacabka Dawladda Waqooyi Barri oo da’diisu tahay siddeed iyo toban (18) ilaa soddon (30) sano waxaa laga rabaa gudashada shaqo qaran muddo laba iyo toban bilood ah, si waafaqsan xeerarka iyo shareecada Islaamka.", "3. Xeer gaar ah ayaa nidaaminaya gudashada waajibaadka shaqo qaran."], "en": ["1. Every citizen has the duty to practise the religion of Islam, and to uphold the Constitution and the other laws of the North East State, the laws and regulations in force in the Federal Republic of Somalia, and international ones that do not conflict with Islamic Sharia and the other laws in force in the country.", "1. Practising equality, freedoms and rights cannot be separated from the duties of the citizen. Therefore every citizen has the duty to be:", "(a) A patriot loyal to the development and wellbeing of their country;", "(b) One who takes part in activities that are useful and protective for the citizen, the family, the common good, the progress of the North East State, the Somali nation and the society they live in;", "(c) One who develops parental responsibility;", "(d) One who promotes the unity of the North East State and the Somali nation, cooperating with other citizens;", "(e) One who promotes the principle of mutual accountability and transparency;", "(f) One who makes the effort to vote at election time;", "(g) A taxpayer in accordance with Islamic Sharia and the laws of the North East and the Federal Government;", "(h) One who defends the territory of the North East State and the country of the Federal Republic of Somalia;", "2. Every citizen who is a member of the people of the North East State aged eighteen (18) to thirty (30) is required to perform national service for a period of twelve months, in accordance with the laws and Islamic Sharia.", "3. A specific law shall regulate the performance of national service duties."], "ch": 3, "pg": 17}, {"id": "a44", "k": "art", "n": 44, "lab": "Article 44", "labso": "Qodobka 44aad", "tso": "Awoodda iyo Metelaadda Shacabka", "ten": "Power and Representation of the People", "so": ["1. Awoodda xukunka waxaa leh Allaah (SWT), ka sokowna waxaa iska leh shacabka, iyaga oo adeegsanaya hay’adaha u xilsaaran si waafaqsan dastuurka iyo shuruucda Dawladda Waqooyi Bari.", "2. Nidaamka metelaadda shacabku waa in uu ahaado mid furan oo qof kasta fursad u siinaya in uu ka qayb qaato; habraacyadiisa iyo xeerarkiisana si fudud loo fahmi karo.", "3. Nidaamka metelaaddu waa in uu ahaadaa mid si ku filan oo macquul ah uga hortegi kara qalalaase ka dhasha tartanka siyaasadda iyo natiijooyinka doorashada.", "4. Golaha Wakiillada ayaa metela qaybaha kala duwan ee bulshada."], "en": ["1. The power to rule belongs to Allah (SWT), and after Him to the people, who exercise it through the institutions entrusted with it in accordance with the Constitution and the laws of the North East State.", "2. The system of popular representation must be open, giving every person the opportunity to participate, and its procedures and rules must be easy to understand.", "3. The system of representation must be able, sufficiently and reasonably, to prevent crises arising from political competition and election results.", "4. The House of Representatives represents the various sections of society."], "ch": 4, "pg": 18}, {"id": "a45", "k": "art", "n": 45, "lab": "Article 45", "labso": "Qodobka 45aad", "tso": "Nidaamka Doorashooyinka", "ten": "The Electoral System", "so": ["1. Muwaaddin kasta oo ka mid ah shacab ka Dawladda Waqooyi Bari Soomaaliya oo buuxiya shuruudaha doorashada waxa uu xaq u leeyahay in uu wax dooran karo lana dooran karo.", "2. Madaxweynaha, Madaxweyne ku Xigeenka, xubnaha Golaha Wakiillada iyo Golayaasha Degmooyinka waxaa toos u dooranaya dadweynaha.", "3. Doorashadu waa in ay u dhacdaa si caddaalad ah, oo sharciga waafaqsan.", "4. Cod bixintu waxa ay noqonaysaa mid caam ah, loo siman yahay, shakhsi ah, caddaalad ah, xor ah, waxaana reebban in qofna lagu farageliyo doorashada meesha uu codka marinayo.", "5. Qabsoomidda doorashada waa inay noqoto mid muddaysan, waxaana go’aaminaya Guddiga Doorashada iyo Soohdimaha, waana in aysan ka yaraan laba bilood, kana badnaan afar bilood ka hor dhammaadka mudda xileedka Dawladda.", "6. Xeerka Doorashooyinka ayaa nidaaminaya heerarka kala duwan ee doorashooyinka."], "en": ["1. Every citizen who is a member of the people of the North East State of Somalia and meets the electoral requirements has the right to vote and to be elected.", "2. The President, the Vice President, members of the House of Representatives and the District Councils are elected directly by the public.", "3. Elections must be held fairly and in accordance with the law.", "4. Voting shall be universal, equal, personal, fair and free, and it is prohibited to interfere with any person at the place where they cast their vote.", "5. Elections must be held on a fixed schedule set by the Electoral and Boundaries Commission, no less than two months and no more than four months before the end of the State's term of office.", "6. The Electoral Law shall regulate the different levels of elections."], "ch": 4, "pg": 19}, {"id": "a46", "k": "art", "n": 46, "lab": "Article 46", "labso": "Qodobka 46aad", "tso": "Ururrada iyo Xisbiyada Siyaasadda", "ten": "Political Associations and Parties", "so": ["1. Furashada iyo diiwaangelinta urur siyaasadeed waa in uu buuxiyaa shuruudaha ku xusan sharciga.", "2. Waxaa xisbi siyaasadeed noqonaya sa ddexda (3) urur ee ugu codka badan doorashada golayaasha deegaanka, waxaana lagu qeexayaa Xeerka Doorashada iyo Soohdimaha.", "3. Saddexda xisbi siyaasadeed ee ku soo baxa doorashada golayaasha deegaanka jiritaankoodu waxa uu noqonayaa laba muddo xileed.", "4. Ururrada ku guulaysan waaya in ay u gudbaan xisbi rasmi ah, waxa ay waayayaan sharciga ururnimada. Mar labaad way isu diiwaangelin karaan urur siyaasadeed ahaan, marka Guddiga Doorashadda iyo Soohdimaha uu furo tartanka ururrada si dastuurka iyo xeerka waafaqsan.", "5. Guddiga Doorashada iyo Soohdimaha ayaa u xilsaaran hubinta iyo is -hortaagga qoraallada, barnaamijyadooda siyaasadeed ee urur ama xisbi soo bandhigo, si waafaqsan Dastuurka iyo shuruucda kale.", "6. Marka xisbiyada jira ee sharciga ah midkood burburo ama la xidho, Guddiga Doorashada Waqooyi Bari ayaa urur siyaasadeedkii kaalinta ku xigta galay doorashooyinka Golayaasha Deegaanka ee ugu dambeeyay ugu yeedhaya in uu noqdo xisbi siyaasadeed buuxiya kaalinta bannaanaatay.", "7. Ururrada iyo xisbiyada siyaasadeed ee ka qaybgelaya tartanka doorashooyinka waxa ay xaq u leeyihiin la socodka dhaqangalka habraacyada doorashooyinka.", "8. Ururrada iyo xisbiyada siyaasadda ee doorashooyinka ka qaybgelaya waa in ay fursad siman u leeyihiin warbaahinta Dawladda marka lagu jiro ololayaasha doorashooyinka.", "9. Xeerka Doorashooyinka ayaa qeexi doona qaabka, ololaha iyo xadka ka qaybgalka xisbiyada.", "10. Shuruudaha aasaasiga ah ee ururrada iyo xisbiyada:", "(b) Waa in uu hoggaankiisa ku doorto qaab doorasho, daah furan, oo xor iyo xalaal ah;", "(t) Waa in uu dhiirrigeliyaa sarraynta sharciga, sinnaanta, dawlad wanaaga, iyo xuquuqda aadanaha, kuna dhaqmaa xeerka anshaxa;", "(j) Waa in uusan taageerin koox hubaysan, ku dhaqmin musuqmaasuq iyo nacayb abuur, kuna dhisnayn kooxaysi iyo qabiil."], "en": ["1. Opening and registering a political association must meet the requirements set out in law.", "2. The three (3) associations with the most votes in the local council elections shall become political parties, as defined in the Electoral and Boundaries Law.", "3. The three political parties that emerge from the local council elections shall exist for two terms of office.", "4. Associations that fail to qualify as official parties lose their legal status as associations. They may register again as political associations when the Electoral and Boundaries Commission opens the contest for associations in accordance with the Constitution and the law.", "5. The Electoral and Boundaries Commission is responsible for checking, and blocking where necessary, the documents and political programmes an association or party presents, in accordance with the Constitution and other laws.", "6. If one of the existing legal parties collapses or is closed, the North East Electoral Commission shall invite the political association that came next in the most recent local council elections to become a political party filling the vacant place.", "7. Political associations and parties taking part in electoral contests have the right to monitor the implementation of electoral procedures.", "8. Political associations and parties taking part in elections must have equal access to State media during election campaigns.", "9. The Electoral Law shall define the form, campaigning and limits of party participation.", "10. Basic requirements for associations and parties:", "(a) It must choose its leadership through an election that is transparent, free and fair;", "(b) It must promote the supremacy of law, equality, good governance and human rights, and follow the code of conduct;", "(c) It must not support an armed group, practise corruption or incite hatred, and must not be founded on factionalism or clan."], "ch": 4, "pg": 19}, {"id": "a47", "k": "art", "n": 47, "lab": "Article 47", "labso": "Qodobka 47aad", "tso": "Hannaanka iyo Qaab Dhismeedka Dawladda", "ten": "System and Structure of the State", "so": ["1. Hannaanka Dawladda Waqooyi Bari waxa uu ku dhisan yahay, nidaamka doorashooyinka xorta ah.", "2. Dadweynaha ayaa si toos ah u soo dooranaya Madaxweynaha, Madaxweyne ku Xigeenka, Golaha Wakiillada iyo Goleyaasha Deegaanka.", "3. Dawladda Waqooyi Bari waxa ay u qaybsantaa saddex qaybood oo kala ah:", "(b) Qaybta Wakiillada (Golaha Wakiillada);", "(t) Qaybta Fulinta (Golaha Fulinta);", "(j) Qaybta Garsoorka (Golaha Garsoorka).", "4. Qaab dhismeedka gobollada iyo degmooyinka waxa uu ka kooban yahay gobollo, gobol kastaana waxa uu leeyahay degmooyin.", "5. Dhismaha gobollada iyo degmooyinka, soohdimahooda iyo darajooyinkooda waxaa lagu qeexayaa Xeerka Gobollada iyo Degmooyinka.", "6. Wax ka beddelka tirada gobollada, degmooyinka, iyo soohdimaha oo sababaysan waxa soo jeedinaya Golaha Fulinta, waxaana oggolaanaya Golaha Wakiillada."], "en": ["1. The system of the North East State is founded on free elections.", "2. The public directly elects the President, the Vice President, the House of Representatives and the Local Councils.", "3. The North East State is divided into three branches:", "(a) The Representative branch (House of Representatives);", "(b) The Executive branch (Executive Council);", "(c) The Judicial branch (Judicial Council).", "4. The structure of regions and districts consists of regions, and each region has districts.", "5. The establishment of regions and districts, their boundaries and their grades shall be defined in the Regions and Districts Law.", "6. A reasoned change to the number of regions or districts, or to boundaries, is proposed by the Executive Council and approved by the House of Representatives."], "ch": 5, "pg": 20}, {"id": "a48", "k": "art", "n": 48, "lab": "Article 48", "labso": "Qodobka 48aad", "tso": "Kala Soocnaanta Qaybaha Dawladda", "ten": "Separation of the Branches of State", "so": ["1. Qaybaha Dawladda Waqooyi Bari ee kala ah Golaha Wakiillada, Golaha Fulinta, iyo Golaha Garsoorku waa kala soocan yihiin.", "2. Qayb kasta waxa ay u madax bannaan tahay gudashada waajibaadyada, xilalka iyo awoodaha dastuurku u jideeyey, awoodahooda iyo wada shaqayntoodana waxaa qeexaya dastuurka.", "3. Qofna xubin kama noqon karo isku mar, wax ka badan hal qayb oo qaybaha Dawladda ka mid ah.", "4. Wixii khilaaf dastuuri ah oo kala dhex gala qaybaha Dawladda, waxaa go’aan ka gaadhaya Maxkamadda Sare ee Dawladda Waqooyi Bari."], "en": ["1. The branches of the North East State, namely the House of Representatives, the Executive Council and the Judicial Council, are separate.", "2. Each branch is independent in carrying out the duties, offices and powers the Constitution assigns to it; their powers and cooperation are defined by the C
